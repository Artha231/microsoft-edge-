<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture & Vibration Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            background: #fff;
            font-family: Arial, sans-serif;
            color: #111;
        }

        body {
            padding: 20px;
            text-align: center;
        }

        #popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 24px;
        }

        .dialog {
            width: 100%;
            max-width: 340px;
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 32px #0002;
        }

        .dialog h3 {
            margin-bottom: 12px;
        }

        .dialog p {
            margin-bottom: 20px;
            line-height: 1.5;
            color: #555;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #stopBtn {
            margin-top: 20px;
            background: #d22;
        }

        #log-output {
            max-width: 400px;
            height: 180px;
            margin: 20px auto;
            padding: 12px;
            overflow-y: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            text-align: left;
            font: 13px monospace;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h3>Gesture & Vibration Analyzer</h3>
    <p style="margin-top: 8px; color: #666">
        Pengujian event gestur dan Vibration API.
    </p>

    <div id="popup" role="dialog"
         aria-modal="true"
         aria-labelledby="popupTitle">
        <div class="dialog">
            <h3 id="popupTitle">Pengujian Gestur</h3>
            <p id="popupMessage">
                Aktivitas gestur terdeteksi.
            </p>
            <button id="closePopup">Tutup & Uji Getaran</button>
        </div>
    </div>

    <button id="stopBtn">Hentikan Getaran</button>

    <div id="log-output">Menunggu aktivitas...</div>

<script>
    const popup = document.getElementById("popup");
    const message = document.getElementById("popupMessage");
    const closePopup = document.getElementById("closePopup");
    const stopBtn = document.getElementById("stopBtn");
    const logOutput = document.getElementById("log-output");

    let popupShown = false;
    let vibrationTimer = null;

    function addLog(text) {
        const line = document.createElement("div");
        line.textContent = "> " + text;
        logOutput.appendChild(line);

        while (logOutput.children.length > 40) {
            logOutput.removeChild(logOutput.firstChild);
        }

        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function showPopup(source) {
        if (popupShown) return;

        popupShown = true;
        message.textContent =
            "Event " + source + " terdeteksi. " +
            "Tekan tombol untuk menguji getaran.";

        popup.style.display = "flex";
        addLog("Pop-up ditampilkan: " + source);
    }

    function testVibration() {
        if (typeof navigator.vibrate !== "function") {
            addLog("Vibration API tidak didukung browser ini.");
            return;
        }

        const result = navigator.vibrate(200);

        addLog(
            result
                ? "Permintaan getaran singkat dikirim."
                : "Permintaan getaran ditolak."
        );
    }

    // Deteksi gerakan sentuhan.
    window.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch") {
            showPopup("pointermove");
        }
    }, { passive: true });

    // Deteksi halaman digulir.
    window.addEventListener("scroll", () => {
        showPopup("scroll");
    }, { passive: true });

    // Getaran hanya dicoba setelah pengguna menekan tombol.
    closePopup.addEventListener("click", () => {
        popup.style.display = "none";
        testVibration();
    });

    // Tombol penghentian.
    stopBtn.addEventListener("click", () => {
        if (vibrationTimer !== null) {
            clearInterval(vibrationTimer);
            vibrationTimer = null;
        }

        if (typeof navigator.vibrate === "function") {
            navigator.vibrate(0);
        }

        addLog("Pengujian getaran dihentikan.");
    });
</script>
</body>
</html>
