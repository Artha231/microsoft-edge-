```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-Click Fullscreen PoC</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      padding: 24px;
    }

    #status {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fullscreen Security Test</h1>
    <p id="status">Menguji permintaan fullscreen...</p>
  </main>

  <script>
    async function testFullscreen() {
      const status = document.getElementById("status");

      try {
        await document.documentElement.requestFullscreen();

        status.textContent =
          "Fullscreen berhasil diaktifkan.";
      } catch (error) {
        status.textContent =
          "Fullscreen ditolak browser: " +
          error.name;
      }
    }

    // Percobaan otomatis tanpa klik.
    window.addEventListener("load", testFullscreen);
  </script>
</body>
</html>
```
