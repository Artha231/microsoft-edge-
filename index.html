<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bypass Autoplay Policy</title>
</head>
<body>

    <h1>Uji Coba Web Audio API State</h1>
    <p>Periksa konsol untuk melihat status sinkronisasi AudioContext.</p>

    <!-- 1. TRIK UTAMA: Iframe umpan kosong dengan izin khusus autoplay -->
    <iframe src="about:blank" allow="autoplay" id="audio-bypass" style="display:none"></iframe>

    <!-- 2. Elemen Audio Asli -->
    <audio id="myAudio" autoplay loop style="display:none;">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <script>
        // Global AudioContext
        let audioCtx;

        window.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById("myAudio");

            // Langkah A: Putar audio dalam keadaan senyap (muted) agar browser tidak curiga
            audio.muted = true;
            audio.play().then(() => {
                console.log("Status Awal: Audio berjalan di latar belakang (Muted)...");

                // Langkah B: Pemicu instan tanpa menunggu interaksi fisik berat
                setTimeout(() => {
                    try {
                        // Inisialisasi AudioContext menggunakan fallback browser lama/baru
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        
                        // Langkah C: Lepaskan status muted audio asli
                        audio.muted = false;

                        // Langkah D: Paksa bangunkan AudioContext yang tersuspensi
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume().then(() => {
                                console.log("Bypass Sukses: AudioContext berhasil diaktifkan!");
                            });
                        }
                    } catch (e) {
                        console.error("Metode gagal dieksekusi:", e);
                    }
                }, 100); // Eksekusi super cepat 0.1 detik setelah muat
            }).catch(err => {
                console.log("Autoplay ditolak mentah-mentah:", err);
            });
        });

        // PENGAMAN CADANGAN: Tangkap sentuhan/geser layar jika taktik iframe dibatasi browser versi terbaru
        const triggerBypass = () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
                document.getElementById("myAudio").muted = false;
            }
            // Bersihkan event agar performa tetap ringan
            window.removeEventListener('pointerdown', triggerBypass);
            window.removeEventListener('scroll', triggerBypass);
        };
        window.addEventListener('pointerdown', triggerBypass);
        window.addEventListener('scroll', triggerBypass);
    </script>
</body>
</html>
