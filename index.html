<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POC Getar Lama → Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; cursor: default; }

    .icon {
        font-size: 100px;
        margin-bottom: 16px;
    }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-18deg) scale(1.35); }
        50%  { transform: rotate(18deg) scale(1.45); }
        100% { transform: rotate(-18deg) scale(1.35); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        letter-spacing: 2px;
        text-shadow: 0 0 35px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone:not(.active) .timer { color: #333; text-shadow: none; }

    /* Config panel — untuk ubah durasi getar & target */
    .config {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .config label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #8b93a1;
    }
    .config input {
        background: #05070a;
        border: 1px solid #2c313a;
        color: #ff2020;
        border-radius: 4px;
        padding: 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
    }
    .config .full { grid-column: 1 / -1; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 25px #ff0000;
        z-index: 10;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }

    /* Status bar */
    .status {
        position: fixed;
        top: 115px;
        left: 10px;
        right: 10px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        z-index: 5;
    }
    .status .item {
        text-align: center;
    }
    .status .item .v { font-size: 13px; font-weight: 900; color: #ff2020; }
    .status .item .l { color: #8b93a1; font-size: 8px; text-transform: uppercase; margin-top: 1px; }
</style>
</head>
<body>

<div class="config">
    <label>Jeda sebelum redirect (ms)
        <input type="number" id="cfgDelay" value="8000" min="1000" max="60000" step="1000">
    </label>
    <label>Panjang Getar Pola (ms)
        <input type="number" id="cfgChunk" value="9999" min="1000" max="20000" step="1000">
    </label>
    <label class="full">URL tujuan redirect
        <input type="text" id="cfgTarget" value="https://google.com">
    </label>
</div>

<div class="status">
    <div class="item"><div class="v" id="s-calls">0</div><div class="l">API Triggered</div></div>
    <div class="item"><div class="v" id="s-countdown">—</div><div class="l">Redirect in</div></div>
    <div class="item"><div class="v" id="s-elapsed">0.0s</div><div class="l">Time Spent</div></div>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">KLIK DI SINI UNTUK MEMULAI</div>
    <div class="timer" id="timer">0.0</div>
    <div class="hint" id="hint">Sentuh layar untuk memicu getaran panjang agresif dan menguji kebocoran state saat redirect.</div>
</div>

<button id="stopBtn">BATALKAN UJI COBA</button>

<script>
    const zone = document.getElementById('zone');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const timer = document.getElementById('timer');
    const stopBtn = document.getElementById('stopBtn');
    
    const cfgDelay = document.getElementById('cfgDelay');
    const cfgChunk = document.getElementById('cfgChunk');
    const cfgTarget = document.getElementById('cfgTarget');
    
    const sCalls = document.getElementById('s-calls');
    const sCountdown = document.getElementById('s-countdown');
    const sElapsed = document.getElementById('s-elapsed');

    let vibrateInterval = null;
    let redirectTimeout = null;
    let uiInterval = null;
    let isRunning = false;
    let startTime = 0;

    zone.addEventListener('click', () => {
        if (isRunning) return;
        isRunning = true;

        // Membaca input nilai dari panel config
        const delayTime = parseInt(cfgDelay.value) || 8000; 
        const chunkTime = parseInt(cfgChunk.value) || 9999; 
        const targetUrl = cfgTarget.value || "https://google.com";

        // Mengaktifkan efek animasi UI
        zone.classList.add('active');
        icon.textContent = "📳";
        title.textContent = "PROSES GETAR AKTIF...";
        stopBtn.classList.add('on');

        let callCount = 0;
        startTime = performance.now();

        // Trik 1: Pembuatan pola array agresif berulang demi menembus limit OS/Browser
        const triggerVibration = () => {
            if ('vibrate' in navigator) {
                // Pola: Getar panjang (chunk), jeda super tipis (10ms), getar panjang lagi
                navigator.vibrate([chunkTime, 10, chunkTime, 10, chunkTime]);
                callCount++;
                sCalls.textContent = callCount;
            }
        };

        // Langsung eksekusi ledakan getaran pertama
        triggerVibration();

        // Trik 2: Pemaksaan sinyal getar (interval spamming) setiap 1.5 detik
        // Ini memenuhi antrean buffer hardware sebelum proses redirect menghancurkan halaman
        vibrateInterval = setInterval(triggerVibration, 1500);

        // Mengatur update timer milidetik pada layar secara realtime
        uiInterval = setInterval(() => {
            const elapsed = (performance.now() - startTime) / 1000;
            sElapsed.textContent = elapsed.toFixed(1) + 's';

            const remaining = Math.max(0, (delayTime - (performance.now() - startTime)) / 1000);
            sCountdown.textContent = remaining.toFixed(1) + 's';
            timer.textContent = remaining.toFixed(1);
        }, 50);

        // Trik 3: Penguluran waktu (Delay Terkontrol) sebelum perpindahan halaman dimulai
        redirectTimeout = setTimeout(() => {
            // Sengaja melompati fungsi pencucian state 'navigator.vibrate(0)'
            // Sisa antrean getar di hardware akan dipaksa 'meluber' ke Google
            window.location.href = targetUrl;
        }, delayTime);
    });

    // Fitur emergency exit jika intensitas getaran hardware terlalu tinggi saat pengetesan
    stopBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        
        clearInterval(vibrateInterval);
        clearInterval(uiInterval);
        clearTimeout(redirectTimeout);
        
        if ('vibrate' in navigator) {
            navigator.vibrate(0);
        }

        isRunning = false;
        zone.classList.remove('active');
        icon.textContent = "👆";
        title.textContent = "KLIK DI SINI UNTUK MEMULAI";
        timer.textContent = "0.0";
        stopBtn.classList.remove('on');
        sCalls.textContent = "0";
        sCountdown.textContent = "—";
        sElapsed.textContent = "0.0s";
    });
</script>
</body>
</html>
