<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframe Download PoC - One Click</title>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }
    button {
      padding: 12px 18px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1769e0;
      color: #fff;
    }
    input { padding: 8px; width: 80px; }
    #status { margin-top: 16px; font-weight: bold; }
    #downloads a { display: block; margin-top: 12px; }
  </style>
</head>

<body>
  <div class="panel">
    <h2>Iframe Download PoC (One Click All)</h2>
    <p>Demo mengunduh seluruh file secara bersamaan menggunakan satu tombol klik.</p>

    <label for="count">Jumlah file (1–20):</label>
    <input id="count" type="number" min="1" max="20" value="20">

    <p>
      <button id="start" type="button">Unduh Semua File</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const countInput = document.getElementById("count");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];

    start.addEventListener("click", () => {
      // Bersihkan sisa objek memori sebelumnya
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      const count = Number(countInput.value);

      if (!Number.isInteger(count) || count < 1 || count > 20) {
        status.textContent = "Masukkan jumlah file dari 1 sampai 20.";
        return;
      }

      status.textContent = `Memproses pengunduhan ${count} file sekaligus...`;

      for (let i = 1; i <= count; i++) {
        const content = `PoC file ${i}\nDibuat untuk pengujian browser.\n`;
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        // 1. Buat elemen link unduhan di balik layar
        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-${i}.txt`;
        link.textContent = `Tautan file ${i}`;
        downloads.appendChild(link);

        // 2. Eksekusi trigger klik otomatis per file di dalam loop
        link.click();
      }

      status.textContent = `Proses selesai. Mencoba mengunduh ${count} file.`;
    });
  </script>
</body>
</html>
