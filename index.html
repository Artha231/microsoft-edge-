<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gesture → Getar Instan + Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .1s;
    }
    #zone.active { background: #2a0000; animation: bgPulse .15s infinite alternate; }
    @keyframes bgPulse {
        from { background: #2a0000; }
        to   { background: #4a0000; }
    }

    .icon { font-size: 110px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .04s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-25deg) scale(1.4); }
        50%  { transform: rotate(25deg) scale(1.5); }
        100% { transform: rotate(-25deg) scale(1.4); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 35px #ff0000;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    /* Gesture indicator */
    #gestureDot {
        position: fixed;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 32, 32, 0.4);
        pointer-events: none;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity .1s;
        z-index: 50;
        box-shadow: 0 0 25px #ff2020;
    }
    #gestureDot.on { opacity: 1; }

    /* Stats */
    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 4px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; color: #ff2020; }
    .stat .l { font-size: 8px; color: #8b93a1; text-transform: uppercase; margin-top: 2px; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        z-index: 10;
    }
    #stopBtn.on { display: block; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat"><div class="v" id="s-calls">0</div><div class="l">Calls</div></div>
    <div class="stat"><div class="v" id="s-queue">0</div><div class="l">Queue (s)</div></div>
    <div class="stat"><div class="v" id="s-elapsed">0.0</div><div class="l">Time</div></div>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Geser jari = getar langsung + redirect.<br>
        Tanpa jeda timer.
    </div>
</div>

<div id="gestureDot"></div>
<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');
const gestureDot = document.getElementById('gestureDot');
const sCalls  = document.getElementById('s-calls');
const sQueue  = document.getElementById('s-queue');
const sElapsed= document.getElementById('s-elapsed');

// ============================================================
// KONFIG
// ============================================================
const TARGET       = 'https://google.com';
const CHUNK        = 9999;   // durasi tiap getar
const PRELOAD      = 100;    // preload getar (async loop)
const REDIRECT_MS  = 100;    // redirect setelah 100ms getar

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let calls = 0;
let vibTimer = null;
let uiTimer = null;
let triggered = false;

// ============================================================
// GESTURE DOT
// ============================================================
function showDot(x, y) {
    gestureDot.style.left = x + 'px';
    gestureDot.style.top = y + 'px';
    gestureDot.classList.add('on');
}
function hideDot() {
    gestureDot.classList.remove('on');
}

// ============================================================
// FIRE GETAR
// ============================================================
function fire() {
    if (!running) return;
    try {
        navigator.vibrate(CHUNK);
        calls++;
        sCalls.textContent = calls;
        sQueue.textContent = Math.round((calls * CHUNK) / 1000);
    } catch(_) {}
}

// ============================================================
// START — dipanggil SAAT gesture (touchmove)
// ============================================================
function start() {
    if (running) return;
    running = true;
    startTime = performance.now();
    calls = 0;

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.innerHTML = `Getar + redirect ke <b>${TARGET}</b>...`;
    stopBtn.classList.add('on');

    // ============================================================
    // 1. FIRE GETAR LANGSUNG — SYNCHRONOUS, TANPA DELAY
    // ============================================================
    // Ini yang paling penting: fire SEBELUM ada async apapun.
    // Karena kita di dalam user gesture handler, sticky activation
    // pasti aktif → getar dijamin jalan.
    fire();
    fire();  // fire 2x untuk mastiin

    // ============================================================
    // 2. LOOP INTERVAL — getar berulang
    // ============================================================
    vibTimer = setInterval(fire, 50);

    // ============================================================
    // 3. ASYNC PRELOAD — pakai setTimeout supaya non-blocking
    // ============================================================
    let preloadCount = 0;
    function preloadNext() {
        if (!running || preloadCount >= PRELOAD) return;
        preloadCount++;
        fire();
        setTimeout(preloadNext, 0);
    }
    preloadNext();

    // ============================================================
    // 4. TIMER UI
    // ============================================================
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timer.textContent = elapsed.toFixed(1) + 's';
        sElapsed.textContent = elapsed.toFixed(1);
    }, 50);

    // ============================================================
    // 5. REDIRECT — setelah 100ms
    // ============================================================
    setTimeout(() => {
        if (!running) return;
        hint.innerHTML = '🚀 REDIRECTING...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECT';

        // ⚠ SENGAJA TIDAK cancel vibrate
        // Biarkan Android selesaikan antreannya di background
        try {
            window.location.href = TARGET;
        } catch (e) {
            hint.textContent = 'Redirect gagal: ' + e.message;
        }
    }, REDIRECT_MS);
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    clearInterval(vibTimer);
    clearInterval(uiTimer);
    vibTimer = null;
    uiTimer = null;

    try {
        navigator.vibrate(0);
        navigator.vibrate([]);
    } catch(_) {}

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Geser jari = getar langsung + redirect.<br>Tanpa jeda timer.';
    stopBtn.classList.remove('on');
    sCalls.textContent = '0';
    sQueue.textContent = '0';
    sElapsed.textContent = '0.0';
}

// ============================================================
// GESTURE HANDLERS
// ============================================================
// touchstart — cuma catat posisi untuk indikator
zone.addEventListener('touchstart', (e) => {
    if (running) return;
    const t = e.touches[0];
    if (t) showDot(t.clientX, t.clientY);
}, { passive: false });

// touchmove — INI YANG TRIGGER GETAR
zone.addEventListener('touchmove', (e) => {
    if (running) return;
    
    const t = e.touches[0];
    if (t) showDot(t.clientX, t.clientY);
    
    // Trigger getar LANGSUNG saat ada gerakan
    if (!triggered) {
        triggered = true;
        e.preventDefault();
        hideDot();
        start();  // ← getar langsung, TANPA delay
    }
}, { passive: false });

zone.addEventListener('touchend', () => {
    hideDot();
    triggered = false;
}, { passive: true });

zone.addEventListener('touchcancel', () => {
    hideDot();
    triggered = false;
}, { passive: true });

// Mouse fallback (desktop)
zone.addEventListener('mousedown', (e) => {
    if (running) return;
    showDot(e.clientX, e.clientY);
});

zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    showDot(e.clientX, e.clientY);
    triggered = true;
    hideDot();
    start();
});

zone.addEventListener('mouseup', () => {
    hideDot();
    triggered = false;
});

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    clearInterval(vibTimer);
    clearInterval(uiTimer);
    // ⚠ SENGAJA TIDAK cancel vibrate
});

// ============================================================
// INIT
// ============================================================
if (!('vibrate' in navigator)) {
    hint.textContent = '❌ Browser tidak mendukung getaran.';
    title.textContent = 'TIDAK DIDUKUNG';
}

})();
</script>

</body>
</html>
