```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture API Test</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
        }

        body {
            min-height: 100vh;
        }
    </style>
</head>
<body>
<script>
    let lastEvent = 0;

    function detectGesture(source) {
        const now = Date.now();

        if (now - lastEvent < 500) return;
        lastEvent = now;

        console.log("Gestur terdeteksi:", source);
    }

    window.addEventListener("pointermove", (event) => {
        detectGesture("pointermove: " + event.pointerType);
    }, { passive: true });

    window.addEventListener("scroll", () => {
        detectGesture("scroll");
    }, { passive: true });
</script>
</body>
</html>
```
