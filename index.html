<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edge Getar & Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; cursor: default; }

    .icon {
        font-size: 100px;
        margin-bottom: 16px;
    }
    #zone.active .icon { animation: shake .08s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-15deg) scale(1.3); }
        50%  { transform: rotate(15deg) scale(1.4); }
        100% { transform: rotate(-15deg) scale(1.3); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 20px #ff0000; }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 300px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 64px;
        letter-spacing: 2px;
        text-shadow: 0 0 30px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone:not(.active) .timer { color: #333; text-shadow: none; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 25px #ff0000;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">KLIK DI MANA SAJA</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Sekali klik = getar dan alihkan halaman.<br>
        Jari boleh dilepas.
    </div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');

// ========================================================
// UBAH URL TUJUAN DOMAIN LAIN DI SINI
// ========================================================
const TARGET_DOMAIN = "https://domain-target-anda.com"; 

let running = false;
let startTime = 0;
let vibTimer = null;
let uiTimer = null;

const INTERVAL = 500;
const DURATION = 1000;

function start() {
    if (running) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = 'Browser tidak mendukung getaran.';
        return;
    }

    running = true;
    startTime = Date.now();

    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.innerHTML = 'Mengalihkan halaman...';
    stopBtn.classList.add('on');

    // Memicu getaran pertama secara instan
    navigator.vibrate(DURATION);

    // Menjaga putaran getaran terus aktif di background
    vibTimer = setInterval(() => {
        if (!running) return;
        navigator.vibrate(DURATION);
    }, INTERVAL);

    // Perbarui indikator waktu pada layar
    uiTimer = setInterval(() => {
        if (!running) return;
        const sec = ((Date.now() - startTime) / 1000).toFixed(1);
        timer.textContent = sec + 's';
    }, 100);

    // KUNCI PENGALIHAN: Memaksa window.top keluar dari sangkar iframe
    setTimeout(() => {
        try {
            window.top.location.href = TARGET_DOMAIN;
        } catch (e) {
            // Mekanisme cadangan jika sandbox membatasi top-navigation
            window.location.href = TARGET_DOMAIN;
        }
    }, 400); // 400ms memberikan waktu jeda krusial agar haptik terdaftar pada sistem OS Android
}

function stop() {
    if (!running) return;
    running = false;

    clearInterval(vibTimer);
    clearInterval(uiTimer);
    vibTimer = null;
    uiTimer = null;

    navigator.vibrate(0);

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'KLIK DI MANA SAJA';
    hint.innerHTML = 'Sekali klik = getar dan alihkan halaman.<br>Jari boleh dilepas.';
    stopBtn.classList.remove('on');

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    timer.textContent = elapsed + 's';
}

zone.addEventListener('click', () => {
    if (!running) start();
});

stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});

window.addEventListener('beforeunload', () => {
    if (vibTimer) clearInterval(vibTimer);
    if (uiTimer) clearInterval(uiTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

})();
</script>

</body>
</html>
