<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fullscreen & Multi-Download PoC (Upgraded)</title>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
      transition: all 0.3s ease;
    }
    /* Memastikan tampilan panel tetap rapi saat masuk mode fullscreen */
    .panel:fullscreen {
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      border-radius: 0;
      padding: 40px;
      overflow-y: auto;
      background: #ffffff;
    }
    button {
      padding: 14px 20px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #d32f2f;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.2s;
    }
    button:hover {
      background: #b71c1c;
    }
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #1565c0; 
      padding: 10px;
      background: #e3f2fd;
      border-radius: 4px;
      display: inline-block;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #e8f5e9;
      color: #2e7d32;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
      border: 1px solid #c8e6c9;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Fullscreen & Multi-Download Test (Upgraded)</h2>
    <p>Demo pengujian perilaku browser saat memicu mode fullscreen dan unduhan massal dalam satu interaksi secara aman.</p>

    <p>
      <button id="start" type="button">Masuk Fullscreen & Unduh 20 File</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");
    const mainPanel = document.getElementById("main-panel");

    let objectUrls = [];

    // Fungsi pembantu untuk memberikan jeda asinkron (Mencegah Race Condition)
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Fungsi utama untuk mengelola unduhan berurutan secara aman
    async function triggerSafeDownloads() {
      // Bersihkan sisa objek memori dari pengujian sebelumnya
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      // Loop asinkron untuk memberikan jeda waktu agar browser tidak crash/memblokir
      for (let i = 1; i <= 20; i++) {
        const content = `PoC file ${i}\nPengujian kombinasi fitur browser.\nTanggal pengujian: ${new Date().toLocaleDateString('id-ID')}\n`;
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-kombinasi-${i}.txt`;
        link.textContent = `File ${i} Terunduh`;
        downloads.appendChild(link);

        // Eksekusi klik otomatis untuk memicu proses download bawaan browser
        link.click();

        status.textContent = `Memproses: Berhasil memicu unduhan file ${i} dari 20...`;

        // Jeda 250ms antar file (Angka optimal agar antrean browser teratur dan lolos proteksi malware)
        await delay(250);
      }

      status.textContent = "Proses selesai! Semua 20 file berhasil diantrekan ke antrean browser.";
      start.disabled = false; // Mengaktifkan kembali tombol setelah selesai
    }

    start.addEventListener("click", async () => {
      // Nonaktifkan tombol sementara agar user tidak melakukan klik ganda (double-trigger)
      start.disabled = true;
      status.textContent = "Menginisialisasi Mode Fullscreen...";

      // 1. Pemicu Mode Fullscreen (Harus dieksekusi pertama kali dari interaksi user gesture)
      try {
        if (mainPanel.requestFullscreen) {
          await mainPanel.requestFullscreen();
        } else if (mainPanel.webkitRequestFullscreen) { /* Dukungan khusus Safari kuno */
          await mainPanel.webkitRequestFullscreen();
        }
      } catch (err) {
        console.warn(`Gagal masuk fullscreen: ${err.message}`);
        status.textContent = "Gagal memasuki fullscreen, mencoba melanjutkan proses unduhan...";
      }

      // 2. Beri jeda 500ms agar browser menyelesaikan animasi transisi perpindahan layar ke Fullscreen
      await delay(100);

      // 3. Jalankan alur unduhan massal yang aman tanpa memicu race condition
      await triggerSafeDownloads();
    });
  </script>
</body>
</html>
