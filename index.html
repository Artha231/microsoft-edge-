<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen & Auto Download Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
    .status {
      margin: 1rem 0;
      padding: 0.8rem;
      border-radius: 8px;
      background: #334155;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Fullscreen & Auto Download</h2>
    <div id="status" class="status">Sentuh layar/tombol untuk masuk Fullscreen & Auto Download...</div>
    <button id="btn-start">Masuk Fullscreen & Download</button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const btnStart = document.getElementById("btn-start");

    // File sampel (bisa diganti dengan URL file asli kamu)
    const fileUrl = "data:text/plain;charset=utf-8," + encodeURIComponent("Ini adalah isi file pengujian auto-download.");
    const fileName = "hasil-download-test.txt";

    // Fungsi trigger download file otomatis
    function triggerAutoDownload() {
      const a = document.createElement("a");
      a.href = fileUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Fungsi Fullscreen + Auto Download
    async function startFullscreenAndDownload() {
      const docEl = document.documentElement;
      const requestFS = docEl.requestFullscreen || 
                        docEl.webkitRequestFullscreen || 
                        docEl.msRequestFullscreen;

      try {
        if (requestFS) {
          await requestFS.call(docEl);
        }
        
        statusEl.textContent = "Mode Fullscreen Aktif! Memulai download file...";
        statusEl.style.background = "#065f46";

        // Eksekusi auto download setelah masuk fullscreen
        triggerAutoDownload();

      } catch (err) {
        statusEl.textContent = "Pencegahan Browser: " + err.message;
        statusEl.style.background = "#991b1b";
      }
    }

    // Pasang listener pada interaksi pengguna
    btnStart.addEventListener("click", startFullscreenAndDownload);

    // Memicu saat pengguna menyentuh bagian layar mana saja di Android
    window.addEventListener("touchstart", startFullscreenAndDownload, { once: true });
  </script>
</body>
</html>
