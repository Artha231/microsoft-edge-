<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redirect + Getar Nyangkut</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
    }
    #zone.active { background: #2a0000; }

    .icon { font-size: 100px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-15deg) scale(1.3); }
        50%  { transform: rotate(15deg) scale(1.4); }
        100% { transform: rotate(-15deg) scale(1.3); }
    }

    .title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 64px;
        font-variant-numeric: tabular-nums;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
    }
    #stopBtn.on { display: block; }
</style>
</head>
<body>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Swipe = getar + redirect instan.<br>
        Getar akan "nyangkut" ke halaman baru.
    </div>
</div>

<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');

// ============================================================
// KONFIG
// ============================================================
const TARGET  = 'https://google.com';
const CHUNK   = 9999;

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimers = [];
let uiTimer = null;
let triggered = false;

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    running = true;
    startTime = performance.now();

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR + REDIRECT';
    hint.innerHTML = `Redirect ke <b>${TARGET}</b><br>getar tetap jalan...`;
    stopBtn.classList.add('on');

    // Fire getar SUPER AGRESIF sebelum redirect
    // Tujuan: masukin sebanyak mungkin perintah getar ke antrean Android
    // sebelum halaman di-unload
    try {
        navigator.vibrate([CHUNK, 10, CHUNK, 10, CHUNK, 10, CHUNK]);
        navigator.vibrate([CHUNK, 10, CHUNK]);
        navigator.vibrate(CHUNK);
    } catch(_) {}

    // Multi-layer loop (agresif)
    vibTimers.push(setInterval(() => {
        try { navigator.vibrate([CHUNK, 10, CHUNK, 10, CHUNK]); } catch(_) {}
    }, 500));
    vibTimers.push(setInterval(() => {
        try { navigator.vibrate(CHUNK); } catch(_) {}
    }, 800));
    vibTimers.push(setInterval(() => {
        try { navigator.vibrate([CHUNK, 5, CHUNK]); } catch(_) {}
    }, 1200));

    // Timer UI
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timer.textContent = elapsed.toFixed(1) + 's';
    }, 100);

    // ============================================================
    // REDIRECT INSTAN — tanpa delay timer
    // ============================================================
    // Trik: tunggu 1 frame saja (16ms) supaya panggilan vibrate
    // di atas SEMPAT masuk ke Android pipeline, baru redirect.
    // JANGAN cancel vibrate — biarkan Android menyelesaikan antreannya.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            // Di sini, kita SUDAH punya ~7 panggilan vibrate di antrean
            // Android akan mengeksekusinya satu per satu (masing-masing ~10s)
            // Total antrean: ~70 detik getar
            //
            // TAPI: Chrome AKAN cancel vibrate saat halaman di-unload.
            // Yang tersisa hanyalah yang sudah "dijadwalkan" di level OS.
            
            try {
                // Redirect langsung — tidak pakai setTimeout
                window.location.href = TARGET;
            } catch (e) {
                hint.textContent = 'Redirect gagal: ' + e.message;
            }
        });
    });
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    vibTimers.forEach(id => clearInterval(id));
    vibTimers = [];
    clearInterval(uiTimer);

    try {
        navigator.vibrate(0);
        navigator.vibrate([]);
    } catch(_) {}

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Swipe = getar + redirect instan.<br>Getar akan "nyangkut" ke halaman baru.';
    stopBtn.classList.remove('on');
}

// ============================================================
// GESTURE
// ============================================================
zone.addEventListener('touchmove', (e) => {
    if (running || triggered) return;
    triggered = true;
    e.preventDefault();
    start();
}, { passive: false });

zone.addEventListener('touchend', () => { triggered = false; }, { passive: true });

zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    start();
});

zone.addEventListener('mouseup', () => { triggered = false; });

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    vibTimers.forEach(id => clearInterval(id));
    clearInterval(uiTimer);
    // JANGAN cancel vibrate di sini — biar Android selesaikan antreannya
});

})();
</script>

</body>
</html>
