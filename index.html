<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fullscreen & Multi-Download PoC (Instant Android)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 650px;
      margin: 40px auto;
      transition: all 0.3s ease;
    }
    /* Memastikan tampilan penuh dan rapi saat masuk mode fullscreen di Android/Desktop */
    :fullscreen, :-webkit-full-screen {
      background: #ffffff !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #d32f2f;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #1565c0; 
      padding: 10px;
      background: #e3f2fd;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #e8f5e9;
      color: #2e7d32;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #c8e6c9;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Fullscreen & Multi-Download Test (Instant)</h2>
    <p style="margin-bottom: 15px;">Demo pengujian instan murni tanpa delay untuk mode fullscreen Android dan unduhan massal seketika.</p>

    <p>
      <button id="start" type="button">Masuk Fullscreen & Unduh 20 File</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];

    start.addEventListener("click", () => {
      // 1. LANGSUNG MASUK FULLSCREEN (Prioritas Utama seketika saat klik terdeteksi)
      // Menggunakan document.documentElement agar seluruh layar Android tertutup penuh tanpa bug rasio elemen
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { /* Chrome Mobile & Safari iOS */
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) { /* Firefox Mobile */
          docEl.mozRequestFullScreen();
        }
      } catch (err) {
        console.warn(`Gagal masuk fullscreen: ${err.message}`);
      }

      // 2. BERSIHKAN MEMORI SISA
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      status.textContent = "Mode Fullscreen aktif. Menembak 20 file unduhan sekaligus...";

      // 3. PROSES DOWNLOAD INSTAN TANPA DELAY
      // Berjalan secara sinkron murni dalam satu putaran waktu yang sama dengan perintah Fullscreen
      for (let i = 1; i <= 20; i++) {
        const content = `PoC file ${i}\nPengujian instan murni langsung tanpa delay.\n`;
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-instant-${String(i).padStart(2, '0')}.txt`;
        link.textContent = `File ${i}`;
        downloads.appendChild(link);

        // Eksekusi klik download detik itu juga
        link.click();
      }

      status.textContent = "Selesai! 20 perintah unduhan berhasil ditembakkan secara bersamaan.";
    });
  </script>
</body>
</html>
