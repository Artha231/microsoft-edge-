<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Overwrite vs Queue Test</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; cursor: default; }

    .icon {
        font-size: 90px;
        margin-bottom: 12px;
    }
    #zone.active .icon { animation: shake .1s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-12deg) scale(1.2); }
        50%  { transform: rotate(12deg) scale(1.3); }
        100% { transform: rotate(-12deg) scale(1.2); }
    }

    .title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 20px #ff0000; }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 52px;
        font-weight: 900;
        color: #ff2020;
        margin: 14px 0;
        min-height: 60px;
        letter-spacing: 2px;
        text-shadow: 0 0 30px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone:not(.active) .timer { color: #333; text-shadow: none; }

    /* Stats bar */
    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 4px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; }
    .stat .l { font-size: 8px; color: #8b93a1; text-transform: uppercase; margin-top: 2px; }
    .stat.hi .v { color: #ff2020; }
    .stat.ok .v { color: #2ecc71; }
    .stat.wr .v { color: #f1c40f; }
    .stat.cy .v { color: #00ffff; }

    /* Config panel */
    .config {
        position: fixed;
        top: 66px;
        left: 8px;
        right: 8px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 8px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
    }
    .config label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #8b93a1;
    }
    .config input {
        background: #05070a;
        border: 1px solid #2c313a;
        color: #ff2020;
        border-radius: 4px;
        padding: 4px 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
    }

    #stopBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 16px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 25px #ff0000;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }

    /* Log */
    #log {
        position: fixed;
        bottom: 80px;
        left: 8px;
        right: 8px;
        max-height: 100px;
        overflow-y: auto;
        background: #05070a;
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 9.5px;
        line-height: 1.4;
        white-space: pre-wrap;
        z-index: 5;
    }
    #log .i  { color: #79c0ff; }
    #log .ok { color: #3fb950; }
    #log .wr { color: #d29922; }
    #log .er { color: #f85149; }
    #log .hi { color: #d2a8ff; font-weight: 700; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi"> <div class="v" id="s-calls">0</div>  <div class="l">Calls</div></div>
    <div class="stat ok"> <div class="v" id="s-ok">0</div>     <div class="l">OK</div></div>
    <div class="stat wr"> <div class="v" id="s-req">0</div>    <div class="l">Req (s)</div></div>
    <div class="stat cy"> <div class="v" id="s-elapsed">0</div><div class="l">Elapsed</div></div>
</div>

<div class="config">
    <label>INTERVAL (ms)
        <input type="number" id="cfgInterval" value="100" min="10" max="5000">
    </label>
    <label>DURATION (ms)
        <input type="number" id="cfgDuration" value="5000" min="100" max="10000">
    </label>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">KLIK UNTUK TEST</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Setiap 100ms, minta getar 5000ms.<br>
        Kalau menumpuk, harusnya getar bertambah lama terus.
    </div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>

<div id="log">Siap. Klik zona untuk memulai test.</div>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone     = document.getElementById('zone');
const icon     = document.getElementById('icon');
const title    = document.getElementById('title');
const timer    = document.getElementById('timer');
const hint     = document.getElementById('hint');
const stopBtn  = document.getElementById('stopBtn');
const logEl    = document.getElementById('log');
const sCalls   = document.getElementById('s-calls');
const sOk      = document.getElementById('s-ok');
const sReq     = document.getElementById('s-req');
const sElapsed = document.getElementById('s-elapsed');
const cfgInterval = document.getElementById('cfgInterval');
const cfgDuration = document.getElementById('cfgDuration');

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let intervalId = null;
let uiTimer = null;
let calls = 0;
let oks = 0;
let totalRequestedMs = 0;

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 100;
function log(text, cls = '') {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text + '\n';
    logEl.appendChild(span);
    while (logEl.children.length > MAX_LOG) {
        logEl.removeChild(logEl.firstChild);
    }
    logEl.scrollTop = logEl.scrollHeight;
}

// ============================================================
// UPDATE UI
// ============================================================
function updateStats() {
    sCalls.textContent = calls;
    sOk.textContent = oks;
    sReq.textContent = (totalRequestedMs / 1000).toFixed(0);
    if (running) {
        sElapsed.textContent = ((Date.now() - startTime) / 1000).toFixed(0);
    }
}

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = 'Browser tidak mendukung getaran.';
        return;
    }

    const INTERVAL = Math.max(10, parseInt(cfgInterval.value, 10) || 100);
    const DURATION = Math.max(100, parseInt(cfgDuration.value, 10) || 5000);

    running = true;
    startTime = Date.now();
    calls = 0;
    oks = 0;
    totalRequestedMs = 0;

    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'TEST AKTIF';
    stopBtn.classList.add('on');
    hint.innerHTML = `Setiap <b>${INTERVAL}ms</b>, minta getar <b>${DURATION}ms</b>.<br>Amati — kalau menumpuk, getar harusnya makin lama.`;

    logEl.textContent = '';
    log(`▶ TEST dimulai`, 'hi');
    log(`   INTERVAL = ${INTERVAL}ms`, 'i');
    log(`   DURATION = ${DURATION}ms`, 'i');
    log(`   Rasio    = ${(DURATION / INTERVAL).toFixed(1)}x`, 'i');
    log('', '');
    log('📌 Amati getar fisik:', 'wr');
    log('   - Kalau browser QUEUE → getar harusnya makin lama total', 'wr');
    log('   - Kalau browser OVERWRITE → getar konstan, tidak menumpuk', 'wr');
    log('', '');

    // Fire pertama
    fire(DURATION);

    // Loop
    intervalId = setInterval(() => {
        fire(DURATION);
    }, INTERVAL);

    // UI timer
    uiTimer = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000);
        timer.textContent = elapsed.toFixed(1) + 's';
        updateStats();
    }, 100);
}

function fire(duration) {
    if (!running) return;
    calls++;
    totalRequestedMs += duration;

    const ok = navigator.vibrate(duration);
    if (ok) oks++;
    updateStats();

    // Log periodik setiap 10 panggilan
    if (calls % 10 === 0) {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        const requested = (totalRequestedMs / 1000).toFixed(0);
        log(`[${elapsed}s] call#${calls} · req getar total: ${requested}s`, 'i');
    }
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    clearInterval(intervalId);
    clearInterval(uiTimer);
    intervalId = null;
    uiTimer = null;

    navigator.vibrate(0);
    navigator.vibrate([]);

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'KLIK UNTUK TEST';
    stopBtn.classList.remove('on');

    const elapsed = (Date.now() - startTime) / 1000;
    timer.textContent = elapsed.toFixed(1) + 's';

    const requestedSec = totalRequestedMs / 1000;
    const ratio = requestedSec / elapsed;

    log('', '');
    log('════════════════════════════════════', 'hi');
    log('⏹ TEST SELESAI', 'hi');
    log('════════════════════════════════════', 'hi');
    log(`   Durasi nyata     : ${elapsed.toFixed(1)}s`, 'i');
    log(`   Total diminta    : ${requestedSec.toFixed(0)}s`, 'i');
    log(`   Rasio            : ${ratio.toFixed(1)}x`, ratio > 2 ? 'wr' : 'i');
    log(`   Total calls      : ${calls}`, 'i');
    log(`   Calls OK         : ${oks}`, 'i');
    log('', '');
    
    if (ratio > 5) {
        log('📊 ANALISIS:', 'hi');
        log(`   Anda meminta total ${requestedSec.toFixed(0)}s getar`, 'wr');
        log(`   Tapi getar fisik hanya terasa ~${elapsed.toFixed(0)}s`, 'wr');
        log(`   → Browser OVERWRITE, bukan queue`, 'ok');
        log(`   → Tidak ada penumpukan durasi`, 'ok');
        log('', '');
        log('✅ MITOS TERBUKTI: vibrate() tidak menumpuk', 'ok');
        log('   Setiap panggilan baru membatalkan yang lama', 'ok');
    }
    hint.innerHTML = `Selesai. Diminta ${requestedSec.toFixed(0)}s, nyata ${elapsed.toFixed(0)}s.<br>Rasio: ${ratio.toFixed(1)}x → tidak menumpuk.`;
}

// ============================================================
// EVENTS
// ============================================================
zone.addEventListener('click', () => {
    if (!running) start();
});

stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});

window.addEventListener('beforeunload', () => {
    if (intervalId) clearInterval(intervalId);
    if (uiTimer) clearInterval(uiTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

// ============================================================
// INIT
// ============================================================
if (typeof navigator.vibrate !== 'function') {
    hint.textContent = '❌ navigator.vibrate tidak didukung.';
    log('❌ Vibration API tidak tersedia', 'er');
} else {
    log('✅ Vibration API tersedia', 'ok');
    log('', '');
    log('📌 Cara test:', 'hi');
    log('   1. Klik zona untuk mulai', 'i');
    log('   2. Rasakan getarnya selama 15 detik', 'i');
    log('   3. Amati: apakah getar makin kuat? Atau konstan?', 'i');
    log('   4. Lihat "Req (s)" — angka akan terus naik', 'i');
    log('   5. Kalau browser QUEUE, getar fisik harusnya naik juga', 'wr');
    log('   6. Kalau browser OVERWRITE, getar fisik konstan', 'ok');
}

updateStats();

})();
</script>

</body>
</html>
