<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture & Vibration API Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: sans-serif;
            background-color: #ffffff; /* Latar putih penuh */
            color: #000000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .touch-zone {
            width: 100%;
            max-width: 400px;
            height: 200px;
            margin: 20px 0;
            border: 2px dashed #cccccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666666;
            cursor: pointer;
        }
        .btn-stop {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ff3333;
            color: white;
            border: none;
            margin-bottom: 20px;
        }
        #log-output {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            color: #333333;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 13px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h3 style="margin-top: 20px;">Vibration & Gesture Analyzer</h3>
    <p style="color: #666; font-size: 14px; margin-top: 5px; text-align: center;">
        Sentuh, seret, atau lepas jari Anda pada kotak di bawah untuk memeriksa validasi token gestur.
    </p>

    <!-- Area Deteksi Gestur -->
    <div id="touchZone" class="touch-zone">
        INTERAKSI JARI DI SINI
    </div>

    <button id="stopBtn" class="btn-stop">HENTIKAN LOOP GETAR</button>

    <div id="log-output">Menunggu aktivitas sentuhan...</div>

<script>
    const logOutput = document.getElementById('log-output');
    const touchZone = document.getElementById('touchZone');
    const stopBtn = document.getElementById('stopBtn');
    
    let vibrationInterval = null;

    function addLog(message) {
        logOutput.innerHTML += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    // Fungsi loop getar berbasis interval
    function startVibrationSpam() {
        addLog("Memulai perulangan Vibration API...");
        
        vibrationInterval = setInterval(() => {
            if (navigator.vibrate) {
                // Mencoba memicu getaran 5000ms
                const status = navigator.vibrate(5000); 
                
                if (status) {
                    addLog("Sinyal getar berhasil dikirim.");
                } else {
                    addLog("⚠️ Browser menolak perintah getar (Aktivasi tidak valid).");
                    clearInterval(vibrationInterval);
                }
            } else {
                addLog("❌ Browser memblokir total atau tidak mendukung Vibration API.");
                clearInterval(vibrationInterval);
            }
        }, 1000); // Interval 1 detik demi stabilitas pembacaan log haptik
    }

    // Memanfaatkan event 'pointerup' (titik akhir gestur sentuhan) sebagai gerbang aktivasi sah peramban
    touchZone.addEventListener('pointerup', () => {
        if (!vibrationInterval) {
            addLog("💥 Gerakan dilepaskan (Pointerup). Mencoba memicu API...");
            startVibrationSpam();
        }
    }, { once: true });

    // Tombol darurat untuk membersihkan antrean hardware haptik ponsel
    stopBtn.addEventListener('click', () => {
        if (vibrationInterval) {
            clearInterval(vibrationInterval);
            vibrationInterval = null;
        }
        if (navigator.vibrate) {
            navigator.vibrate(0); // Setel ke 0 untuk mematikan paksa semua getaran aktif
        }
        addLog("🛑 Pengujian dihentikan. Seluruh antrean getar direset.");
    });
</script>

</body>
</html>
