<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EXTREME — Vibrate Forever</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        transition: background .1s;
        overflow: hidden;
    }
    #zone.idle   { background: #000; }
    #zone.active {
        background: radial-gradient(circle at center, #4a0000 0%, #000 100%);
        animation: hue 1s infinite alternate;
    }
    @keyframes hue {
        from { filter: hue-rotate(0deg); }
        to   { filter: hue-rotate(20deg); }
    }

    /* Partikel visual */
    .particle {
        position: fixed;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #ff2020;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
    }
    #zone.active .particle {
        animation: fly 1.5s infinite;
    }
    @keyframes fly {
        0%   { opacity: 1; transform: translate(0,0) scale(1); }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    .icon {
        font-size: 100px;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 20px #ff0000);
    }
    #zone.active .icon {
        animation: megaShake .06s infinite;
    }
    @keyframes megaShake {
        0%   { transform: rotate(-20deg) scale(1.4); }
        25%  { transform: rotate(0deg) scale(1.5); }
        50%  { transform: rotate(20deg) scale(1.4); }
        75%  { transform: rotate(0deg) scale(1.5); }
        100% { transform: rotate(-20deg) scale(1.4); }
    }

    .title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 4px;
    }
    #zone.active .title {
        color: #ff2020;
        text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
        animation: flicker .1s infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.85; }
    }

    .hint {
        font-size: 12px;
        color: #8b93a1;
        line-height: 1.5;
        max-width: 340px;
        margin-top: 8px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 8px 0;
        min-height: 64px;
        letter-spacing: 3px;
        text-shadow: 0 0 40px #ff0000;
        font-variant-numeric: tabular-nums;
    }

    /* Stats */
    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 0, 0, 0.92);
        border: 1px solid #4a0000;
        border-radius: 5px;
        padding: 4px 2px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; }
    .stat .l { color: #8b93a1; text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; font-size: 8px; }
    .stat.hi  .v { color: #ff2020; }
    .stat.ok  .v { color: #2ecc71; }
    .stat.err .v { color: #e74c3c; }
    .stat.warn .v { color: #f1c40f; }
    .stat.cy  .v { color: #00ffff; }

    /* Layer indicators */
    .layers {
        position: fixed;
        top: 60px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        z-index: 5;
    }
    .layer {
        background: rgba(20, 0, 0, 0.92);
        border: 1px solid #4a0000;
        border-radius: 4px;
        padding: 3px;
        text-align: center;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        color: #666;
        transition: all .1s;
    }
    .layer.on {
        background: #2a0000;
        border-color: #ff2020;
        color: #ff2020;
        font-weight: 700;
        box-shadow: 0 0 8px #ff2020;
    }

    /* Log */
    #eventLog {
        position: fixed;
        bottom: 8px;
        left: 8px;
        right: 8px;
        max-height: 120px;
        overflow-y: auto;
        background: #000;
        border: 1px solid #4a0000;
        border-radius: 8px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 9.5px;
        line-height: 1.4;
        white-space: pre-wrap;
        z-index: 5;
    }
    #eventLog .i  { color: #79c0ff; }
    #eventLog .ok { color: #3fb950; }
    #eventLog .wr { color: #d29922; }
    #eventLog .er { color: #f85149; }
    #eventLog .hi { color: #ff2020; font-weight: 700; }

    #pulse {
        position: fixed;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 32, 32, 0.5);
        pointer-events: none;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity .1s;
        z-index: 3;
        box-shadow: 0 0 20px #ff2020;
    }
    #pulse.on { opacity: 1; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi">   <div class="v" id="s-call">0</div>     <div class="l">Calls</div></div>
    <div class="stat ok">   <div class="v" id="s-ok">0</div>       <div class="l">OK</div></div>
    <div class="stat err">  <div class="v" id="s-fail">0</div>     <div class="l">Fail</div></div>
    <div class="stat cy">   <div class="v" id="s-hz">0</div>       <div class="l">Hz</div></div>
    <div class="stat warn"> <div class="v" id="s-gap">0</div>      <div class="l">Gap ms</div></div>
</div>

<div class="layers">
    <div class="layer" id="ly1">L1</div>
    <div class="layer" id="ly2">L2</div>
    <div class="layer" id="ly3">L3</div>
    <div class="layer" id="ly4">L4</div>
    <div class="layer" id="ly5">L5</div>
    <div class="layer" id="ly6">WD</div>
</div>

<div id="zone" class="idle">
    <div class="icon" id="icon">💀</div>
    <div class="title" id="title">GESER UNTUK EXTREME</div>
    <div class="timer" id="timer">0.00s</div>
    <div class="hint" id="hint">
        💀 EXTREME MODE: 6-layer anti-gap<br>
        Angkat jari untuk menghentikan.
    </div>
</div>

<div id="pulse"></div>
<div id="eventLog"></div>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone     = document.getElementById('zone');
const icon     = document.getElementById('icon');
const title    = document.getElementById('title');
const timer    = document.getElementById('timer');
const hint     = document.getElementById('hint');
const pulse    = document.getElementById('pulse');
const eventLog = document.getElementById('eventLog');
const sCall    = document.getElementById('s-call');
const sOk      = document.getElementById('s-ok');
const sFail    = document.getElementById('s-fail');
const sHz      = document.getElementById('s-hz');
const sGap     = document.getElementById('s-gap');
const layers   = [
    document.getElementById('ly1'), document.getElementById('ly2'),
    document.getElementById('ly3'), document.getElementById('ly4'),
    document.getElementById('ly5'), document.getElementById('ly6'),
];

// ============================================================
// KONFIGURASI EXTREME
// ============================================================
// Chunk 9900ms = benar-benar di batas Chrome (10000ms).
// 5 layer + 1 watchdog. Setiap layer step 3000ms → tumpukan berat.

const CHUNK      = 9900;    // hampir mentok batas
const STEP       = 3000;    // tiap layer panggil tiap 3 detik
const OFFSETS    = [0, 600, 1200, 1800, 2400];  // 5 layer
const WATCHDOG   = 300;     // cek setiap 300ms
const MAX_GAP    = 1200;    // kalau gap > 1.2s, tembak paksa
const PATTERN_ALT = [9900]; // pattern alternatif

// ============================================================
// STATE
// ============================================================
let active      = false;
let startTime   = 0;
let layerIds    = [];       // array intervalId untuk 5 layer
let layerActive = [false, false, false, false, false];
let watchdogId  = null;
let tickerId    = null;
let callCount   = 0;
let okCount     = 0;
let failCount   = 0;
let lastFireAt  = 0;
let maxGap      = 0;
let recentFires = [];
let lastHiddenAt = 0;
let alternator  = 0;        // untuk ganti-ganti pattern

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 120;
let logLines = 0;
function ts() { return new Date().toTimeString().slice(0,8); }

function log(text, cls = '') {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = `[${ts()}] ${text}\n`;
    eventLog.appendChild(s);
    logLines++;
    while (logLines > MAX_LOG && eventLog.firstChild) {
        eventLog.removeChild(eventLog.firstChild);
        logLines--;
    }
    eventLog.scrollTop = eventLog.scrollHeight;
}

// ============================================================
// VIBRATE WRAPPER
// ============================================================
function vib(pattern) {
    if (typeof navigator.vibrate !== 'function') return false;
    try {
        const r = navigator.vibrate(pattern);
        const now = Date.now();
        const gap = now - lastFireAt;
        if (gap > maxGap && lastFireAt > 0) maxGap = gap;
        lastFireAt = now;
        recentFires.push(now);
        const cutoff = now - 2000;
        recentFires = recentFires.filter(t => t > cutoff);
        return r;
    } catch (_) {
        return false;
    }
}

// ============================================================
// UI
// ============================================================
function updateTimer() {
    if (!active) return;
    const sec = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = sec + 's';
    sGap.textContent = (Date.now() - lastFireAt);
}

function updateStats() {
    sCall.textContent = callCount;
    sOk.textContent   = okCount;
    sFail.textContent = failCount;
    sHz.textContent   = (recentFires.length / 2).toFixed(1);
}

function setLayerUI(idx, on) {
    layerActive[idx] = on;
    if (layers[idx]) {
        if (on) layers[idx].classList.add('on');
        else layers[idx].classList.remove('on');
    }
}

function showPulse(x, y) {
    pulse.style.left = x + 'px';
    pulse.style.top  = y + 'px';
    pulse.classList.add('on');
}
function hidePulse() { pulse.classList.remove('on'); }

// ============================================================
// FIRE — gunakan pattern bergantian untuk menghindari optimasi browser
// ============================================================
function fire(layerIdx, label) {
    if (!active) return;
    // Ganti-ganti pattern: durasi tunggal vs pattern array panjang
    // Chrome mungkin memperlakukan keduanya berbeda.
    let pattern;
    alternator = (alternator + 1) % 3;
    if (alternator === 0) {
        pattern = CHUNK;
    } else if (alternator === 1) {
        pattern = [CHUNK];
    } else {
        // Pattern array dengan segmen besar — Chrome menjumlahkan total
        // dan memotong di 10.000ms. Total di sini = 9900ms jadi aman.
        pattern = [4900, 50, 4950];
    }

    const ok = vib(pattern);
    callCount++;
    if (ok) okCount++; else failCount++;
    updateStats();
    if (!ok) log(`⚠ ${label} FAIL`, 'wr');
}

// ============================================================
// START — 5 layer + watchdog
// ============================================================
function start() {
    if (active) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = 'Vibration API tidak didukung.';
        log('❌ API tidak tersedia', 'er');
        return;
    }

    active = true;
    startTime = Date.now();
    callCount = okCount = failCount = 0;
    maxGap = 0;
    recentFires = [];
    layerIds = [];
    updateStats();

    zone.classList.remove('idle');
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = '💀 EXTREME MODE';

    log('💀💀💀 EXTREME MODE AKTIF 💀💀💀', 'hi');
    log(`Config: chunk=${CHUNK}ms · step=${STEP}ms · watchdog=${WATCHDOG}ms · maxGap=${MAX_GAP}ms`, 'i');
    log('5 layer + 1 watchdog — anti-gap total', 'i');

    // ---- 5 LAYER ----
    OFFSETS.forEach((offset, idx) => {
        setTimeout(() => {
            if (!active) return;
            fire(idx, `L${idx+1}-init`);
            setLayerUI(idx, true);
            const id = setInterval(() => fire(idx, `L${idx+1}`), STEP);
            layerIds.push(id);
        }, offset);
    });

    // ---- WATCHDOG ----
    watchdogId = setInterval(() => {
        if (!active) return;
        const gap = Date.now() - lastFireAt;
        if (gap > MAX_GAP) {
            log(`🐕 WATCHDOG: gap ${gap}ms → paksa fire`, 'wr');
            fire(5, 'WD');
            setLayerUI(5, true);
            setTimeout(() => setLayerUI(5, false), 200);
        }
    }, WATCHDOG);

    // ---- TICKER ----
    updateTimer();
    tickerId = setInterval(updateTimer, 50);

    hint.innerHTML = `💀 EXTREME AKTIF<br>5 layer pumping · watchdog 300ms<br>Angkat jari untuk berhenti.`;

    // ---- Partikel visual ----
    spawnParticles();
}

// ============================================================
// PARTIKEL VISUAL
// ============================================================
let particleInterval = null;
function spawnParticles() {
    particleInterval = setInterval(() => {
        if (!active) return;
        const p = document.createElement('div');
        p.className = 'particle';
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
    }, 80);
}

// ============================================================
// STOP
// ============================================================
function stop(reason = 'manual') {
    if (!active) return;
    active = false;

    layerIds.forEach(clearInterval);
    layerIds = [];
    clearInterval(watchdogId); watchdogId = null;
    clearInterval(tickerId);   tickerId = null;
    clearInterval(particleInterval); particleInterval = null;

    layerActive.forEach((_, idx) => setLayerUI(idx, false));

    // Matikan vibrate dengan semua cara
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}
    try { navigator.vibrate([0]); } catch(_) {}

    zone.classList.remove('active');
    zone.classList.add('idle');
    icon.textContent = '💀';
    title.textContent = 'GESER UNTUK EXTREME';

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = elapsed + 's';
    hint.innerHTML = `Berhenti (${reason}) setelah ${elapsed}s.<br>
        ${callCount} calls · ${okCount} OK · ${failCount} FAIL<br>
        Max gap: ${maxGap}ms`;

    log(`⏹ Stop (${reason}) — ${elapsed}s — ${callCount} calls (${okCount} OK, ${failCount} FAIL) — maxGap=${maxGap}ms`, 'ok');
    updateStats();
}

// ============================================================
// GESTURE
// ============================================================
function onTouchStart(e) {
    const t = e.touches[0];
    if (t) showPulse(t.clientX, t.clientY);
}
function onTouchMove(e) {
    const t = e.touches[0];
    if (!t) return;
    showPulse(t.clientX, t.clientY);
    if (!active) start();
}
function onTouchEnd() {
    hidePulse();
    if (active) stop('angkat jari');
}
function onTouchCancel() {
    hidePulse();
    if (active) stop('touchcancel');
}

zone.addEventListener('touchstart',  onTouchStart,  { passive: false });
zone.addEventListener('touchmove',   onTouchMove,   { passive: false });
zone.addEventListener('touchend',    onTouchEnd,    { passive: false });
zone.addEventListener('touchcancel', onTouchCancel, { passive: false });

// Mouse fallback
zone.addEventListener('mousemove', (e) => {
    if (e.buttons === 0) return;
    showPulse(e.clientX, e.clientY);
    if (!active) start();
});
zone.addEventListener('mouseup', () => {
    hidePulse();
    if (active) stop('mouseup');
});

// ============================================================
// VISIBILITY
// ============================================================
document.addEventListener('visibilitychange', () => {
    const now = Date.now();
    if (document.hidden) {
        lastHiddenAt = now;
        log('👁 HIDDEN', 'hi');
        log(`   active=${active} calls=${callCount} gap=${now - lastFireAt}ms`, 'i');
        try { navigator.vibrate(0); } catch(_) {}
    } else {
        log('👁 VISIBLE kembali', 'hi');
        log(`   hidden ${now - lastHiddenAt}ms`, 'i');
        if (navigator.userActivation) {
            const ua = navigator.userActivation;
            log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
        }
    }
});

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    layerIds.forEach(clearInterval);
    clearInterval(watchdogId);
    clearInterval(tickerId);
    clearInterval(particleInterval);
    try { navigator.vibrate(0); } catch(_) {}
});

window.addEventListener('blur', () => log('💤 blur', 'wr'));
window.addEventListener('focus', () => log('🎯 focus', 'ok'));

// ============================================================
// INIT
// ============================================================
updateStats();
log('=== EXTREME MODE READY ===', 'hi');
if (typeof navigator.vibrate === 'function') {
    log('✅ Vibration API tersedia', 'ok');
    log('💀 Geser jari → 5 layer pumping tanpa henti', 'i');
    log(`Chunk=${CHUNK}ms · Step=${STEP}ms · Watchdog=${WATCHDOG}ms`, 'i');
} else {
    log('❌ Vibration API TIDAK tersedia', 'er');
}

})();
</script>

</body>
</html>
