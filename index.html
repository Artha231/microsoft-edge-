<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Security PoC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      overflow-wrap: anywhere;
    }

    #downloads a {
      display: block;
      margin-top: 12px;
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Browser Security PoC</h1>

    <p>
      Demo pengujian fullscreen dan pembuatan file TXT
      pada browser sendiri.
    </p>

    <label for="count">Jumlah file TXT (1–5)</label>
    <input
      id="count"
      type="number"
      min="1"
      max="5"
      value="3"
    >

    <button id="start" type="button">
      Mulai Pengujian
    </button>

    <button id="exit" type="button">
      Keluar Fullscreen
    </button>

    <div id="status" role="status" aria-live="polite">
      Status: menunggu pengujian.
    </div>

    <div id="downloads"></div>
  </main>

  <script>
    const start = document.getElementById("start");
    const exit = document.getElementById("exit");
    const countInput = document.getElementById("count");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];

    start.addEventListener("click", async () => {
      downloads.replaceChildren();

      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];

      const count = Number(countInput.value);

      if (!Number.isInteger(count) || count < 1 || count > 5) {
        status.textContent = "Masukkan jumlah file antara 1 dan 5.";
        return;
      }

      // Minta fullscreen setelah interaksi pengguna.
      try {
        await document.documentElement.requestFullscreen();
        status.textContent = "Fullscreen aktif. Menyiapkan file TXT...";
      } catch {
        status.textContent =
          "Fullscreen tidak diizinkan. Tetap menyiapkan file TXT...";
      }

      for (let i = 1; i <= count; i++) {
        const blob = new Blob(
          [
            `Browser Security PoC\n`,
            `File nomor: ${i}\n`,
            `Dibuat untuk pengujian lokal.\n`
          ],
          { type: "text/plain;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-${i}.txt`;
        link.textContent = `Unduh poc-${i}.txt`;

        downloads.appendChild(link);
      }

      status.textContent =
        `${count} file TXT siap. Klik tautan masing-masing untuk mengunduh.`;
    });

    exit.addEventListener("click", async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      }

      status.textContent = "Mode fullscreen dinonaktifkan.";
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        status.textContent =
          "Fullscreen tidak aktif. Kamu bisa menjalankan pengujian lagi.";
      }
    });

    window.addEventListener("beforeunload", () => {
      objectUrls.forEach(url => URL.revokeObjectURL(url));
    });
  </script>
</body>
</html>
