<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibration Race Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #fff; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<div style="text-align: center; padding: 20px;">
  <h3>Vibration Race Pipeline Active</h3>
  <p>Mencoba memicu getaran otomatis...</p>
</div>

<script>
(function() {
  // Pola getaran: Bergetar 500ms, Diam 250ms, Bergetar 500ms
  var vibrationPattern =;

  // ===== JALUR 1: RACE CONDITION (Tembakan Masif Tanpa Interaksi) =====
  function triggerVibrate() {
    if ('vibrate' in navigator) {
      try {
        // Mencoba memaksa hardware getar aktif sebelum sandbox browser terkunci sepenuhnya
        navigator.vibrate(vibrationPattern);
      } catch (e) {
        console.log("Vibration blocked or failed in this cycle.");
      }
    }
  }

  // Bombardir instan di awal pemuatan dokumen (Wave 1 sampai Wave 4)
  triggerVibrate();
  
  // Perulangan sangat cepat (setiap 20 milidetik) selama rentang awal pemuatan hlaman
  var raceInterval = setInterval(function() {
    triggerVibrate();
  }, 20);

  // Hentikan bombardir setelah 2 detik agar tidak membuat browser hang / crash
  setTimeout(function() {
    clearInterval(raceInterval);
    console.log("Race interval cleared.");
  }, 2000);


  // ===== JALUR 2: JARING PENGAMAN (Jika Race Gagal, Aktif di Sentuhan/Aktivitas Pertama) =====
  var safetyEvents = ['click', 'touchstart', 'scroll', 'mousemove', 'keydown'];
  
  function triggerOnFirstActivity() {
    triggerVibrate();
    // Bersihkan listener agar tidak bergetar terus-menerus setiap ada gerakan
    safetyEvents.forEach(function(evt) {
      document.removeEventListener(evt, triggerOnFirstActivity);
    });
  }

  safetyEvents.forEach(function(evt) {
    document.addEventListener(evt, triggerOnFirstActivity, { once: true, passive: true });
  });

})();
</script>

</body>
</html>
