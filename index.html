<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibration API Gesture Security Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121214;
            color: #e3e3e3;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .interactive-zone {
            width: 100%;
            height: 150px;
            margin: 20px 0;
            background: #2c3e50;
            border: 2px dashed #3498db;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-stop {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            background-color: #dc3545;
            color: white;
            border: none;
        }
        #status-log {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 12px;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Vibration API Analyzer</h2>
    <p style="color: #aaa; font-size: 14px;">Interaksikan jari Anda pada area di bawah untuk menguji respons gembok keamanan peramban.</p>
    
    <!-- Area untuk menerima interaksi gestur pengguna -->
    <div id="gestureArea" class="interactive-zone">
        KETUK ATAU SWIPE DI SINI
    </div>

    <button id="stopBtn" class="btn-stop">HENTIKAN LOOP</button>

    <h3>Konsol Log Logika:</h3>
    <div id="status-log">Menunggu inisialisasi gestur...</div>
</div>

<script>
    const logBox = document.getElementById('status-log');
    const gestureArea = document.getElementById('gestureArea');
    const stopBtn = document.getElementById('stopBtn');
    
    let spamInterval = null;

    function writeLog(text) {
        logBox.innerHTML += "\n> " + text;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Fungsi untuk memicu getaran berulang sesuai logika instrumen Anda
    function startVibrationSpam() {
        writeLog("Mengeksekusi siklus pengetesan Vibration API...");
        
        // Menggunakan interval intermiten yang aman (misal: tiap 1000ms) untuk stabilitas memori haptik hardware
        spamInterval = setInterval(() => {
            if (navigator.vibrate) {
                const isAllowed = navigator.vibrate(5000); 
                if (!isAllowed) {
                    writeLog("⚠️ Perintah getar ditolak peramban (Aktivasi tidak valid).");
                    clearInterval(spamInterval);
                }
            } else {
                writeLog("❌ Peramban tidak mendukung atau memblokir Vibration API.");
                clearInterval(spamInterval);
            }
        }, 1000);
    }

    // Menggunakan event 'pointerup' (akhir dari sentuhan fisik) sebagai gerbang aktivasi resmi
    gestureArea.addEventListener('pointerup', () => {
        if (!spamInterval) {
            writeLog("💥 Pointerup terdeteksi. Mencoba membuka gembok token...");
            startVibrationSpam();
        }
    }, { once: true });

    // Tombol mitigasi darurat untuk mereset komponen haptik hardware
    stopBtn.addEventListener('click', () => {
        if (spamInterval) {
            clearInterval(spamInterval);
            spamInterval = null;
        }
        if (navigator.vibrate) {
            navigator.vibrate(0); // Mengirimkan instruksi 0 untuk membersihkan antrean hardware
        }
        writeLog("🛑 Pengujian dihentikan secara aman. Seluruh antrean getar direset.");
    });
</script>

</body>
</html>
