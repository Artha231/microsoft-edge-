<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar + Delay Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; }

    .icon { font-size: 100px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-15deg) scale(1.3); }
        50%  { transform: rotate(15deg) scale(1.4); }
        100% { transform: rotate(-15deg) scale(1.3); }
    }

    .title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 64px;
        font-variant-numeric: tabular-nums;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 300px;
    }
    #zone.active .hint { color: #ff6060; }

    /* Config panel — muncul saat idle */
    .config {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        background: rgba(20, 22, 28, 0.96);
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .config label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #8b93a1;
    }
    .config input {
        background: #05070a;
        border: 1px solid #2c313a;
        color: #ff2020;
        border-radius: 4px;
        padding: 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
    }
    .config .full { grid-column: 1 / -1; }
    #zone.active ~ .config { display: none; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        z-index: 10;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>

<div class="config">
    <label>Delay redirect (ms)
        <input type="number" id="cfgDelay" value="8000" min="1000" max="120000" step="1000">
    </label>
    <label>Durasi chunk getar (ms)
        <input type="number" id="cfgChunk" value="9999" min="1000" max="9999" step="500">
    </label>
    <label class="full">URL tujuan
        <input type="text" id="cfgTarget" value="https://google.com">
    </label>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Swipe = fullscreen + getar + redirect.<br>
        Jari boleh dilepas.
    </div>
</div>

<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');
const cfgDelay  = document.getElementById('cfgDelay');
const cfgChunk  = document.getElementById('cfgChunk');
const cfgTarget = document.getElementById('cfgTarget');

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimers = [];
let uiTimer = null;
let redirectTimer = null;
let triggered = false;
let currentDelay = 10000;

// ============================================================
// START
// ============================================================
async function start() {
    if (running) return;
    running = true;
    startTime = performance.now();

    // Baca config
    currentDelay = Math.max(1000, parseInt(cfgDelay.value, 10) || 10000);
    const CHUNK = Math.max(1000, Math.min(9999, parseInt(cfgChunk.value, 10) || 9999));
    const TARGET = (cfgTarget.value || 'https://google.com').trim();

    // Fullscreen
    try {
        await document.documentElement.requestFullscreen();
    } catch(_) {}

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.innerHTML = `Getar <b>${(currentDelay/1000).toFixed(1)}s</b> → redirect ke<br><b>${TARGET}</b>`;
    stopBtn.classList.add('on');

    // Fire pertama
    vibrate(CHUNK);

    // Multi-layer loop
    vibTimers.push(setInterval(() => vibrate(CHUNK), 1500));
    vibTimers.push(setInterval(() => vibrate(CHUNK), 2500));

    // UI timer
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        const remaining = Math.max(0, (currentDelay - (performance.now() - startTime)) / 1000);
        timer.textContent = elapsed.toFixed(1) + 's';
        if (remaining > 0) {
            hint.innerHTML = `Redirect dalam <b style="color:#ff2020;">${remaining.toFixed(1)}s</b><br>ke <b>${TARGET}</b>`;
        }
    }, 100);

    // Redirect setelah delay
    redirectTimer = setTimeout(() => {
        hint.innerHTML = '🚀 Redirect...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECTING';

        // Cancel getar DULU supaya residual minimal
        try {
            navigator.vibrate(0);
            navigator.vibrate([]);
        } catch(_) {}

        // Redirect
        try {
            window.location.href = TARGET;
        } catch (e) {
            hint.textContent = 'Redirect gagal: ' + e.message;
        }
    }, currentDelay);
}

function vibrate(chunk) {
    if (!running) return;
    try {
        navigator.vibrate([chunk, 10, chunk, 10, chunk]);
    } catch(_) {}
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    vibTimers.forEach(id => clearInterval(id));
    vibTimers = [];
    clearInterval(uiTimer);
    clearTimeout(redirectTimer);

    try {
        navigator.vibrate(0);
        navigator.vibrate([]);
    } catch(_) {}

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Swipe = fullscreen + getar + redirect.<br>Jari boleh dilepas.';
    stopBtn.classList.remove('on');
}

// ============================================================
// GESTURE — SWIPE
// ============================================================
zone.addEventListener('touchmove', (e) => {
    if (running || triggered) return;
    triggered = true;
    e.preventDefault();
    start();
}, { passive: false });

zone.addEventListener('touchend', () => {
    triggered = false;
}, { passive: true });

// Mouse fallback
zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    start();
});

zone.addEventListener('mouseup', () => {
    triggered = false;
});

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// AUTO STOP saat tab hidden
// ============================================================
document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    vibTimers.forEach(id => clearInterval(id));
    clearInterval(uiTimer);
    clearTimeout(redirectTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

})();
</script>

</body>
</html>
