
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Security Alert Test</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    body.strobe {
      animation: flash 0.8s infinite alternate;
    }

    @keyframes flash {
      from { background: #111; }
      to { background: #8b0000; }
    }

    .alert-box {
      padding: 28px;
      max-width: 90%;
      background: #222;
      border: 2px solid #555;
      border-radius: 14px;
    }

    h1 {
      color: #ff5252;
      margin-bottom: 16px;
      font-size: 1.7rem;
    }

    p {
      color: #ddd;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    #start { background: #d32f2f; color: white; }
    #stop { background: #eee; color: #111; }
  </style>
</head>

<body>
  <main class="alert-box">
    <h1>SECURITY ALERT TEST</h1>
    <p>Demo pengujian audio, getaran, dan fullscreen perangkat.</p>
    <button id="start">Mulai Tes</button>
    <button id="stop">Hentikan Tes</button>
    <p id="status" aria-live="polite">Siap dimulai.</p>
  </main>

  <script>
    let ctx;
    let oscillator;
    let gain;
    let wakeLock;
    let vibrationTimer;
    let stopTimer;

    const status = document.getElementById("status");

    async function startTest() {
      try {
        // Fullscreen harus dipicu oleh interaksi pengguna.
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }

        // Getaran pada perangkat yang mendukungnya.
        if ("vibrate" in navigator) {
          navigator.vibrate([400, 200, 400, 200]);

          vibrationTimer = setInterval(() => {
            navigator.vibrate([400, 200, 400, 200]);
          }, 1200);
        }

        // Cegah layar tidur jika didukung browser.
        if ("wakeLock" in navigator) {
          try {
            wakeLock = await navigator.wakeLock.request("screen");
          } catch (_) {}
        }

        // Sirene audio.
        ctx = new (
          window.AudioContext || window.webkitAudioContext
        )();

        await ctx.resume();

        oscillator = ctx.createOscillator();
        gain = ctx.createGain();

        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(800, ctx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(
          1200, ctx.currentTime + 0.4
        );

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime + 1.5);
        gain.gain.linearRampToValueAtTime(
          0.001, ctx.currentTime + 2
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 2);

        document.body.classList.add("strobe");
        status.textContent = "Tes aktif.";

        // Demo berlangsung singkat, lalu berhenti otomatis.
        stopTimer = setTimeout(stopTest, 5000);
      } catch (error) {
        status.textContent =
          "Fullscreen atau audio tidak diizinkan browser. Coba mulai lagi.";
      }
    }

    async function stopTest() {
      clearInterval(vibrationTimer);
      clearTimeout(stopTimer);

      if ("vibrate" in navigator) navigator.vibrate(0);

      if (ctx && ctx.state !== "closed") {
        await ctx.close();
      }

      if (wakeLock) {
        await wakeLock.release().catch(() => {});
        wakeLock = null;
      }

      document.body.classList.remove("strobe");

      if (document.fullscreenElement) {
        await document.exitFullscreen().catch(() => {});
      }

      status.textContent = "Tes dihentikan.";
    }

    document.getElementById("start")
      .addEventListener("click", startTest);

    document.getElementById("stop")
      .addEventListener("click", stopTest);
  </script>
</body>
</html>
