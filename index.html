<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrumen Pengujian Standar: Analisis Interaksi & Vibration API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121214;
            color: #e3e3e3;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .btn-action {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        .btn-action:hover { background-color: #0056b3; }
        .btn-stop { background-color: #dc3545; color: white; }
        .btn-stop:hover { background-color: #bd2130; }
        
        #status-log {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 12px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Vibration API Analyzer</h2>
    <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">
        Gunakan tombol di bawah untuk menganalisis bagaimana browser memproses token interaksi dan membatasi durasi haptik.
    </p>
    
    <button id="testBtn" class="btn-action">JALANKAN ANALISIS (Klik 1x)</button>
    <button id="stopBtn" class="btn-action btn-stop">HENTIKAN PENGUJIAN</button>

    <h3>Konsol Log Logika:</h3>
    <div id="status-log">Menunggu inisialisasi pengujian...</div>
</div>

<script>
    const logBox = document.getElementById('status-log');
    const testBtn = document.getElementById('testBtn');
    const stopBtn = document.getElementById('stopBtn');

    let isRunning = false;
    let loopCounter = 0;

    function writeLog(text) {
        logBox.innerHTML += "\n> " + text;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(text);
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Fungsi untuk menguji penanganan durasi ekstrem oleh browser
    function executeVibrationTest() {
        if (navigator.vibrate) {
            // Memasukkan angka durasi ekstrem untuk memverifikasi fitur otomatis pemotongan (truncation) menjadi maksimal 10 detik oleh browser
            const success = navigator.vibrate(999999999);
            return success;
        }
        return false;
    }

    // Alur perulangan asinkron utama
    async function startEvaluationLoop() {
        isRunning = true;
        loopCounter = 0;
        logBox.innerHTML = "";
        writeLog("Aktivasi Terdeteksi: Token interaksi awal berhasil dicatat.");

        while (isRunning) {
            loopCounter++;
            writeLog(`[Siklus #${loopCounter}] Memulai jeda asinkron 6 detik...`);
            
            // Jeda waktu untuk mengevaluasi apakah token aktivasi bersifat sementara (Transient) atau permanen (Sticky)
            await sleep(6000);

            if (!isRunning) break;

            // Memeriksa status aktivasi pengguna jika didukung oleh browser
            if (navigator.userActivation) {
                writeLog(`Siklus #${loopCounter} - Status Transient Activation (isActive): ` + navigator.userActivation.isActive);
            }

            writeLog(`Siklus #${loopCounter} - Mengirimkan permintaan eksekusi Vibration API...`);
            let result = executeVibrationTest();

            if (result) {
                writeLog(`Siklus #${loopCounter} - Status: API merespons dengan sukses (Menggunakan Sticky Activation).`);
            } else {
                writeLog(`Siklus #${loopCounter} - Status: API ditolak atau tidak didukung oleh browser.`);
            }

            // Jeda antar siklus untuk menjaga stabilitas memori peramban
            await sleep(1000);
        }
    }

    // Event Listener untuk memulai pengujian
    testBtn.addEventListener('click', () => {
        if (!isRunning) {
            testBtn.style.pointerEvents = 'none'; // Menonaktifkan tombol sementara agar loop tidak tumpang tindih
            startEvaluationLoop();
        }
    });

    // Event Listener untuk menghentikan pengujian secara aman
    stopBtn.addEventListener('click', () => {
        isRunning = false;
        if (navigator.vibrate) {
            navigator.vibrate(0); // Mengirimkan instruksi 0 untuk mereset dan membersihkan seluruh antrean haptik pada hardware
        }
        writeLog("🛑 Pengujian dihentikan secara aman. Seluruh antrean getar direset.");
        testBtn.style.pointerEvents = 'auto'; // Mengaktifkan kembali tombol utama
    });
</script>

</body>
</html>
