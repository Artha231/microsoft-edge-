<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Click Autoplay Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        .status {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Mencoba Musik Zero Click</h1>
    <p>Halaman ini akan mencoba memutar musik otomatis tanpa interaksi Anda.</p>
    <div id="status-text" class="status">Status: Menunggu halaman dimuat...</div>

    <!-- Audio dimulai dengan atribut 'muted' agar diizinkan berputar oleh browser -->
    <audio id="myAudio" autoplay muted loop>
        <source src="https://soundhelix.com" type="audio/mp3">
        Browser Anda tidak mendukung audio.
    </audio>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const audio = document.getElementById("myAudio");
            const statusText = document.getElementById("status-text");

            // 1. Pastikan audio berputar dalam kondisi Muted (Pasti Diizinkan Browser)
            audio.play().then(() => {
                statusText.innerText = "Status: Musik berputar (Senyap/Muted)...";
                
                // 2. Trik Zero Click: Coba nyalakan suara secara otomatis setelah 2 detik
                setTimeout(() => {
                    audio.muted = false;
                    
                    // Cek apakah browser mengizinkan un-mute tanpa klik
                    if (audio.paused) {
                        statusText.innerText = "Status: Diblokir browser (Butuh klik untuk bersuara).";
                        statusText.style.color = "red";
                    } else {
                        statusText.innerText = "Status: BERHASIL! Musik menyala tanpa klik 🎉";
                        statusText.style.color = "green";
                    }
                }, 2000); // Penundaan 2 detik

            }).catch(error => {
                statusText.innerText = "Status: Autoplay diblokir total oleh browser.";
                statusText.style.color = "red";
                console.log("Autoplay Error:", error);
            });
        });
    </script>

</body>
</html>
