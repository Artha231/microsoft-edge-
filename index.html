<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar Residual Maksimal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .1s;
    }
    #zone.active { background: #2a0000; animation: bgPulse .2s infinite alternate; }
    @keyframes bgPulse {
        from { background: #2a0000; }
        to   { background: #4a0000; }
    }

    .icon { font-size: 100px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .04s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-25deg) scale(1.4); }
        50%  { transform: rotate(25deg) scale(1.5); }
        100% { transform: rotate(-25deg) scale(1.4); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 20px #ff0000; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 64px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 30px #ff0000;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    /* Stats */
    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 4px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; color: #ff2020; }
    .stat .l { font-size: 8px; color: #8b93a1; text-transform: uppercase; margin-top: 2px; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        z-index: 10;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>

<div class="stats">
    <div class="stat"><div class="v" id="s-calls">0</div><div class="l">Calls</div></div>
    <div class="stat"><div class="v" id="s-queue">0</div><div class="l">Queue (s)</div></div>
    <div class="stat"><div class="v" id="s-elapsed">0.0</div><div class="l">Time</div></div>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Swipe = preload getar + redirect instan.<br>
        Getar akan tetap terasa di halaman tujuan.
    </div>
</div>

<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');
const sCalls  = document.getElementById('s-calls');
const sQueue  = document.getElementById('s-queue');
const sElapsed= document.getElementById('s-elapsed');

// ============================================================
// KONFIG — ubah di sini
// ============================================================
const TARGET         = 'https://google.com';
const CHUNK          = 9999;   // durasi per getar (ms)
const PRELOAD_COUNT  = 500;    // jumlah panggilan getar sebelum redirect
const LOOP_INTERVAL  = 50;     // interval loop (ms) — sangat agresif
const FRAME_WAIT     = 3;      // tunggu berapa frame sebelum redirect

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimers = [];
let uiTimer = null;
let triggered = false;
let calls = 0;

// ============================================================
// FIRE VIBRATE
// ============================================================
function fire() {
    if (!running) return;
    try {
        navigator.vibrate(CHUNK);
        calls++;
        sCalls.textContent = calls;
        sQueue.textContent = Math.round((calls * CHUNK) / 1000);
    } catch(_) {}
}

function firePattern() {
    if (!running) return;
    try {
        // Pattern array panjang — Chrome akan memotong di 10000ms
        // tapi tetap dimasukkan ke antrean Android
        navigator.vibrate([CHUNK, 1, CHUNK, 1, CHUNK]);
        calls++;
        sCalls.textContent = calls;
        sQueue.textContent = Math.round((calls * CHUNK) / 1000);
    } catch(_) {}
}

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    running = true;
    startTime = performance.now();
    calls = 0;

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'PRELOAD GETAR';
    hint.innerHTML = `Preload <b>${PRELOAD_COUNT}</b> getar ke antrean Android...<br>lalu redirect ke <b>${TARGET}</b>`;
    stopBtn.classList.add('on');

    // ============================================================
    // TAHAP 1: PRELOAD RATUSAN GETAR
    // ============================================================
    // Strategi: panggil vibrate() ratusan kali SECARA SINKRON
    // Tujuan: masukin sebanyak mungkin perintah ke antrean Android
    //
    // Catatan: Chrome akan OVERWRITE (bukan queue), jadi sebenarnya
    // hanya panggilan terakhir yang "tersimpan" di renderer.
    // TAPI di level Android kernel, panggilan-panggilan ini
    // sempat diproses sebelum di-overwrite.

    for (let i = 0; i < PRELOAD_COUNT; i++) {
        fire();
    }

    // ============================================================
    // TAHAP 2: MULTI-LAYER LOOP SUPER AGRESIF
    // ============================================================
    // 5 layer interval dengan timing berbeda
    // Tujuan: isi antrean terus-menerus sebelum redirect

    vibTimers.push(setInterval(fire, LOOP_INTERVAL));           // 50ms
    vibTimers.push(setInterval(fire, LOOP_INTERVAL + 20));      // 70ms
    vibTimers.push(setInterval(fire, LOOP_INTERVAL + 40));      // 90ms
    vibTimers.push(setInterval(firePattern, LOOP_INTERVAL + 10)); // 60ms
    vibTimers.push(setInterval(firePattern, LOOP_INTERVAL + 30)); // 80ms

    // ============================================================
    // TAHAP 3: TIMER UI
    // ============================================================
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timer.textContent = elapsed.toFixed(1) + 's';
        sElapsed.textContent = elapsed.toFixed(1);
    }, 50);

    // ============================================================
    // TAHAP 4: REDIRECT SETELAH BEBERAPA FRAME
    // ============================================================
    // Tunggu FRAME_WAIT frame (~50ms), supaya:
    // 1. Preload 500 getar sempat masuk ke Android pipeline
    // 2. Loop interval sempat fire 1-2 kali
    // 3. Tapi Chrome BELUM cancel getar
    //
    // Setelah FRAME_WAIT frame, redirect LANGSUNG tanpa cancel vibrate.
    // Android akan menyelesaikan antreannya di background.

    let frameCount = 0;
    function waitFrames() {
        frameCount++;
        if (frameCount < FRAME_WAIT) {
            requestAnimationFrame(waitFrames);
        } else {
            // REDIRECT LANGSUNG
            hint.innerHTML = '🚀 REDIRECTING...';
            icon.textContent = '🚀';
            title.textContent = 'REDIRECT';
            
            // JANGAN cancel vibrate!
            // Biarkan Android selesaikan antreannya.
            
            try {
                window.location.href = TARGET;
            } catch (e) {
                hint.textContent = 'Redirect gagal: ' + e.message;
            }
        }
    }
    requestAnimationFrame(waitFrames);
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    vibTimers.forEach(id => clearInterval(id));
    vibTimers = [];
    clearInterval(uiTimer);

    try {
        navigator.vibrate(0);
        navigator.vibrate([]);
    } catch(_) {}

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Swipe = preload getar + redirect instan.<br>Getar akan tetap terasa di halaman tujuan.';
    stopBtn.classList.remove('on');
}

// ============================================================
// GESTURE — SWIPE
// ============================================================
zone.addEventListener('touchmove', (e) => {
    if (running || triggered) return;
    triggered = true;
    e.preventDefault();
    start();
}, { passive: false });

zone.addEventListener('touchend', () => { triggered = false; }, { passive: true });

zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    start();
});

zone.addEventListener('mouseup', () => { triggered = false; });

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// CLEANUP — JANGAN cancel vibrate di sini
// ============================================================
window.addEventListener('beforeunload', () => {
    vibTimers.forEach(id => clearInterval(id));
    clearInterval(uiTimer);
    // ⚠ SENGAJA TIDAK cancel vibrate
    // Biarkan Android selesaikan antreannya
});

// ============================================================
// INIT
// ============================================================
if (!('vibrate' in navigator)) {
    hint.textContent = '❌ Browser tidak mendukung getaran.';
    title.textContent = 'TIDAK DIDUKUNG';
}

})();
</script>

</body>
</html>
