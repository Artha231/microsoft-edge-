<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Getar (Tanpa Interaksi)</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
    }
    #zone.active { background: #2a0000; }

    .icon { font-size: 110px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .05s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-20deg) scale(1.35); }
        50%  { transform: rotate(20deg) scale(1.45); }
        100% { transform: rotate(-20deg) scale(1.35); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        font-variant-numeric: tabular-nums;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    /* Log untuk lihat apa yang terjadi */
    #log {
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(5, 7, 10, 0.96);
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 8px 12px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        z-index: 100;
    }
    #log .i  { color: #79c0ff; }
    #log .ok { color: #3fb950; }
    #log .wr { color: #d29922; }
    #log .er { color: #f85149; }
    #log .hi { color: #d2a8ff; font-weight: 700; }
</style>
</head>
<body>

<div id="zone">
    <div class="icon" id="icon">🤖</div>
    <div class="title" id="title">AUTO GETAR</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Trigger otomatis tanpa interaksi.<br>
        Lihat log untuk tahu apa yang terjadi.
    </div>
</div>

<div id="log">Memuat...</div>

<script>
(() => {
'use strict';

const zone  = document.getElementById('zone');
const icon  = document.getElementById('icon');
const title = document.getElementById('title');
const timer = document.getElementById('timer');
const hint  = document.getElementById('hint');
const logEl = document.getElementById('log');

const TARGET      = 'https://google.com';
const CHUNK       = 9999;
const DELAY_START = 2000;   // tunggu 2 detik sebelum auto-trigger
const REDIRECT_MS = 3000;

let running = false;
let startTime = 0;
let vibTimer = null;
let uiTimer = null;
let calls = 0;

// ============================================================
// LOG
// ============================================================
function log(text, cls = '') {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text + '\n';
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
}
logEl.textContent = '';

// ============================================================
// CEK USER ACTIVATION
// ============================================================
function checkActivation() {
    if (!navigator.userActivation) {
        log('⚠ navigator.userActivation tidak tersedia', 'wr');
        return null;
    }
    const ua = navigator.userActivation;
    log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
    return ua;
}

// ============================================================
// FIRE GETAR
// ============================================================
function fire() {
    if (!running) return;
    let ok = false;
    try {
        ok = navigator.vibrate(CHUNK);
        calls++;
    } catch(e) {
        log(`❌ vibrate error: ${e.message}`, 'er');
    }
    if (!ok && calls <= 3) {
        log(`❌ vibrate(${CHUNK}) → FALSE (diblokir browser)`, 'er');
    } else if (ok && calls <= 3) {
        log(`✅ vibrate(${CHUNK}) → TRUE`, 'ok');
    }
    return ok;
}

// ============================================================
// AUTO START (tanpa interaksi)
// ============================================================
function autoStart() {
    log('═══════════════════════════════════', 'hi');
    log('🤖 AUTO-TRIGGER (tanpa gesture)', 'hi');
    log('═══════════════════════════════════', 'hi');
    log('', '');
    log('Environment:', 'i');
    log(`   Vibrate API: ${typeof navigator.vibrate === 'function' ? 'ADA' : 'TIDAK'}`,
        typeof navigator.vibrate === 'function' ? 'ok' : 'er');
    checkActivation();
    log('', '');
    log('📌 Mencoba fire vibrate TANPA user gesture...', 'wr');
    log('', '');

    running = true;
    startTime = performance.now();
    calls = 0;

    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'AUTO GETAR AKTIF';
    hint.textContent = 'Mencoba fire tanpa gesture...';

    // === FIRE PERTAMA TANPA GESTURE ===
    const ok1 = fire();
    log(`   Hasil fire #1: ${ok1}`, ok1 ? 'ok' : 'er');
    log('', '');
    log('Expected hasil: FALSE (diblokir browser)', 'wr');
    log('Karena tidak ada user gesture sebelumnya.', 'wr');
    log('', '');

    // === LOOP ===
    vibTimer = setInterval(fire, 50);

    // === TIMER UI ===
    uiTimer = setInterval(() => {
        timer.textContent = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
    }, 50);

    // === REDIRECT ===
    setTimeout(() => {
        log('', '');
        log(`📊 Total calls: ${calls}`, 'i');
        log(`📊 Semua ditolak browser? Cek log di atas.`, 'i');
        log('', '');
        log('🚀 Redirect ke ' + TARGET, 'hi');
        hint.textContent = '🚀 Redirect...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECT';
        try {
            window.location.href = TARGET;
        } catch(e) {
            log('❌ Redirect error: ' + e.message, 'er');
        }
    }, REDIRECT_MS);
}

// ============================================================
// INIT — auto start setelah delay
// ============================================================
log('═══════════════════════════════════', 'hi');
log('🤖 AUTO GETAR TEST', 'hi');
log('═══════════════════════════════════', 'hi');
log('', '');
log('⚠ Kode ini mencoba memicu getar TANPA interaksi.', 'wr');
log('⚠ Expected result: GAGAL (browser blokir).', 'wr');
log('⚠ Ini membuktikan bahwa user gesture WAJIB.', 'wr');
log('', '');
log(`⏱ Auto-start dalam ${DELAY_START/1000} detik...`, 'i');
log('', '');

setTimeout(autoStart, DELAY_START);

})();
</script>

</body>
</html>
