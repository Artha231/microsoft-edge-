<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Blob &amp; ObjectURL (.DEX)</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 {
margin-bottom: 10px;
}
p {
margin-bottom: 15px;
line-height: 1.5;
}
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover {
background: #b71c1c;
}
button:disabled {
background: #9e9e9e;
cursor: not-allowed;
}
#stop-btn {
background: #616161;
margin-top: 8px;
}
#stop-btn:hover {
background: #424242;
}
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#counter {
margin-top: 10px;
font-family: monospace;
font-size: 14px;
text-align: center;
color: #555;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Blob &amp; ObjectURL (.DEX)</h2>
<p>Klik tombol untuk masuk ke layar penuh dan memicu pembuatan berkas Blob ber-ekstensi .dex secara terus-menerus. Menguji deteksi browser terhadap berkas Dalvik Executable yang dibuat runtime via ObjectURL.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate DEX</button>
<button id="stop-btn" type="button" disabled>Stop Proses</button>

<div id="status" role="status">Sistem siap.</div>
<div id="counter">Berkas dipicu: 0</div>
<div id="downloads"></div>
</div>

<script>
var startBtn = document.getElementById("start-btn");
var stopBtn = document.getElementById("stop-btn");
var statusDiv = document.getElementById("status");
var counterDiv = document.getElementById("counter");
var downloadsDiv = document.getElementById("downloads");

var activeUrls = [];
var isProcessing = false;
var totalDipicu = 0;

var speak = function(message) {
if ('speechSynthesis' in window) {
try {
window.speechSynthesis.cancel();
var utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
} catch (e) {
console.warn("TTS gagal:", e);
}
}
};

function buatHeaderDex(id) {
var header = "";
header += "dex\n";
header += "035\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
header += "\u0000\u0000\u0000\u0000";
return header;
}

function buatByteDex(id, jumlah) {
var bytes = new Uint8Array(jumlah);
bytes[0] = 0x64;
bytes[1] = 0x65;
bytes[2] = 0x78;
bytes[3] = 0x0A;
bytes[4] = 0x30;
bytes[5] = 0x33;
bytes[6] = 0x35;
bytes[7] = 0x00;
for (var i = 8; i < jumlah; i++) {
bytes[i] = (i * 13 + id * 7) % 256;
}
return bytes;
}

function prepareMimeBlobAsync(i) {
return new Promise(function(resolve) {
queueMicrotask(function() {
var header = buatHeaderDex(i);
var byteArray = buatByteDex(i, 2048);

var teksInfo = "\n\nSimulasi DEX untuk uji Blob ObjectURL\n" +
"ID: " + i + "\n" +
"Waktu: " + new Date().toISOString() + "\n" +
"Header: dex\\n035\\x00\n" +
"Ukuran: " + byteArray.length + " byte\n" +
"Ini BUKAN file DEX asli.\n";

var blob = new Blob(
[header, byteArray, teksInfo],
{ type: "application/x-dex" }
);

var url = URL.createObjectURL(blob);
resolve({ id: i, url: url });
});
});
}

function triggerInstantDownload(fileData) {
var link = document.createElement("a");
link.href = fileData.url;
link.download = "simulasi-classes-" + String(fileData.id).padStart(3, '0') + ".dex";
link.textContent = "DEX #" + fileData.id + " (.dex)";
link.style.display = "none";
downloadsDiv.appendChild(link);
link.click();
}

function updateCounter() {
counterDiv.textContent = "Berkas dipicu: " + totalDipicu;
}

function processLoop(counter) {
if (!isProcessing) return;

prepareMimeBlobAsync(counter).then(function(fileData) {
if (!isProcessing) return;

activeUrls.push(fileData.url);
triggerInstantDownload(fileData);

totalDipicu++;
updateCounter();

statusDiv.textContent = "Proses berjalan: DEX ke-" + counter + " dikirim";

if (counter % 10 === 0) {
speak("Proses mencapai " + counter + " berkas DEX.");
}

setTimeout(function() {
processLoop(counter + 1);
}, 0);
});
}

startBtn.addEventListener("click", function() {
if (isProcessing) return;

activeUrls.forEach(function(url) { URL.revokeObjectURL(url); });
activeUrls = [];
downloadsDiv.replaceChildren();
totalDipicu = 0;
updateCounter();

speak("Mengaktifkan mode layar penuh.");

var root = document.documentElement;
try {
if (root.requestFullscreen) {
root.requestFullscreen();
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {
root.mozRequestFullScreen();
}
statusDiv.textContent = "Mengunci layar penuh...";
} catch (err) {
console.warn("Fullscreen tidak didukung atau ditolak:", err);
}

setTimeout(function() {
isProcessing = true;
startBtn.disabled = true;
stopBtn.disabled = false;
speak("Proses pembuatan berkas DEX dimulai.");
processLoop(1);
}, 300);
});

stopBtn.addEventListener("click", function() {
isProcessing = false;
startBtn.disabled = false;
stopBtn.disabled = true;
statusDiv.textContent = "Proses dihentikan. Total berkas DEX: " + totalDipicu;
speak("Proses dihentikan.");
});
</script>
</body>
</html>
