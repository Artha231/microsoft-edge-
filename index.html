<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ekspor Berkas Terkontrol</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f8; }
        .panel { background: #fff; padding: 24px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Sistem Simulasi Ekspor Berkas</h2>
    <p>Simulasi pengunduhan dokumen massal yang aman bagi performa memori browser.</p>
    <button id="start-btn">Mulai Unduh Terkontrol (Maks 3 File)</button>
    <div id="status">Status: Siap.</div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");

// Batasan agar tidak menyebabkan Denial of Service (DoS) pada memori
const MAX_FILES = 3; 
const FILE_SIZE = 5000000; // Ukuran diperkecil ke 5MB untuk simulasi yang aman

const generateAndDownload = (id) => {
    return new Promise((resolve) => {
        // Menggunakan setTimeout untuk memberikan jeda antar proses agar UI tetap responsif
        setTimeout(() => {
            const buffer = new Uint8Array(FILE_SIZE).fill(65); // Mengisi data dummy
            const blob = new Blob([buffer], { type: "application/octet-stream" });
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = `data-eksport-${id}.dat`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // KRITIKAL: Revoke URL segera setelah unduhan dipicu untuk membebaskan memori RAM
            setTimeout(() => {
                URL.revokeObjectURL(blobUrl);
            }, 1000);

            statusDiv.textContent = `Status: Berhasil mengunduh berkas ke-${id}`;
            resolve();
        }, 1000); // Jeda 1 detik antar berkas agar antrean unduhan browser teratur
    });
};

startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    statusDiv.textContent = "Status: Memproses...";

    for (let i = 1; i <= MAX_FILES; i++) {
        await generateAndDownload(i);
    }

    statusDiv.textContent = "Status: Semua unduhan selesai secara aman.";
    startBtn.disabled = false;
});
</script>

</body>
</html>
