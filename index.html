<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframe Download PoC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
      background: #f4f6f8;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1769e0;
      color: white;
    }

    #status {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Iframe Download PoC</h2>
    <p>
      Demo pengujian unduhan beberapa file TXT
      menggunakan iframe pada browser sendiri.
    </p>

    <label>
      Jumlah file:
      <input id="count" type="number"
             min="1" max="5" value="3">
    </label>

    <p>
      <button id="start">Mulai Pengujian</button>
    </p>

    <div id="frames" hidden></div>
    <p id="status">Menunggu pengujian.</p>
  </div>

  <script>
    const start = document.getElementById("start");
    const frames = document.getElementById("frames");
    const status = document.getElementById("status");

    start.addEventListener("click", () => {
      frames.replaceChildren();

      const count = Math.min(
        5,
        Math.max(1,
          Number(document.getElementById("count").value) || 1
        )
      );

      for (let i = 1; i <= count; i++) {
        const blob = new Blob(
          [`PoC file ${i}\nGenerated for browser testing.`],
          { type: "text/plain" }
        );

        const url = URL.createObjectURL(blob);
        const iframe = document.createElement("iframe");

        iframe.hidden = true;
        iframe.src = url;
        frames.appendChild(iframe);

        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-${i}.txt`;
        link.textContent = `Unduh poc-${i}.txt`;
        link.style.display = "block";
        link.style.marginTop = "8px";
        frames.appendChild(link);
      }

      status.textContent =
        `${count} file TXT disiapkan. ` +
        "Klik tautan untuk mengunduh masing-masing file.";
    });
  </script>
</body>
</html>
