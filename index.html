<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Batasan Fitur Keamanan Unduhan Browser</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            text-align: center;
            background-color: #121212;
            color: #fff;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background-color: #d83b01; /* Mengubah warna menjadi oranye/merah sebagai penanda uji berkas eksekutabel */
            color: white;
        }
        button:hover {
            background-color: #b83202;
        }
    </style>
</head>
<body>

    <h2>Simulasi Generator Berkas Blob (.EXE)</h2>
    <p>Gunakan tombol di bawah untuk menguji respons keamanan browser terhadap unduhan file eksekutabel tiruan.</p>
    <button id="btnUnduh">Mulai Unduhan .EXE</button>

    <script>
    document.getElementById('btnUnduh').addEventListener('click', function() {
        // 1. Konten teks tiruan (bukan biner EXE asli)
        const dataMentah = `Simulasi payload eksekutabel. File ini bukan format PE asli.`;

        // 2. Mengubah tipe Blob menjadi octet-stream (tipe biner generik)
        // agar browser memperlakukannya sebagai unduhan mentah, bukan halaman web.
        const fileBlob = new Blob([dataMentah], { type: 'application/octet-stream' });
        const objekURL = URL.createObjectURL(fileBlob);
        
        // 3. Proses unduhan samaran dengan ekstensi .exe
        const jangkar = document.createElement('a');
        jangkar.href = objekURL;
        
        // Mengubah ekstensi akhir menjadi .exe sesuai permintaan
        jangkar.download = 'test-file-1.txt.      (1).exe'; 
        
        document.body.appendChild(jangkar);
        jangkar.click();
        
        // 4. Pembersihan dokumen
        document.body.removeChild(jangkar);
        URL.revokeObjectURL(objekURL);
    });
    </script>
</body>
</html>
