<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Autoplay HTML5 Audio</title>
</head>
<body>
    <h3>Uji Coba Autoplay Audio Elemen</h3>
    <p>Lihat F12 Console untuk memantau apakah proteksi browser aktif.</p>

    <script>
        // Membuat elemen audio di memori tanpa interaksi pengguna
        const audioPalsu = new Audio('https://soundhelix.com');

        // Menguji Race Condition dengan jeda waktu asinkronus mikro saat dokumen dimuat
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Mencoba memutar audio otomatis via micro-task...");
            
            setTimeout(() => {
                audioPalsu.play()
                    .then(() => {
                        // Tanda Kerentanan: Jika teks ini muncul dan suara terdengar tanpa klik
                        console.log("🔴 Kerentanan Terdeteksi: Browser mengizinkan autoplay audio tanpa interaksi!");
                    })
                    .catch((error) => {
                        // Kondisi Aman: Browser modern yang aman akan masuk ke blok catch ini
                        console.warn("🟢 Browser Aman: Autoplay diblokir secara otomatis.", error.message);
                    });
            }, 0); // Jeda 0ms untuk melempar eksekusi ke akhir antrean event loop
        });
    </script>
</body>
</html>
