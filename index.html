
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture & Vibration Analyzer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      padding: 24px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #showPopupBtn {
      background: #2563eb;
      color: white;
    }

    #closePopup {
      background: #2563eb;
      color: white;
    }

    #stopBtn {
      background: #dc2626;
      color: white;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* Popup */
    #popup {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .popup-content {
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 16px;
      background: white;
      text-align: center;
      box-shadow: 0 12px 40px #00000030;
    }

    .popup-content h3 {
      margin-bottom: 12px;
    }

    .popup-content p {
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Gesture & Vibration Analyzer</h2>

    <p>
      Lakukan gesture pada halaman ini untuk melihat popup.
      Tekan tombol pada popup untuk menguji getaran perangkat.
    </p>

    <button id="showPopupBtn">Tampilkan Notifikasi</button>
    <button id="stopBtn">Stop Getaran</button>

    <div id="status" role="status" aria-live="polite">
      Status: menunggu gesture
    </div>
  </main>

  <div id="popup" role="dialog"
       aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-content">
      <h3 id="popupTitle">Pemberitahuan</h3>

      <p>
        Tekan tombol di bawah untuk memulai pengujian getaran.
      </p>

      <button id="closePopup">Tutup & Uji Getaran</button>
    </div>
  </div>

  <script>
    const popup = document.getElementById("popup");
    const closePopup = document.getElementById("closePopup");
    const showPopupBtn = document.getElementById("showPopupBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");

    let vibrationTimer = null;
    let popupShown = false;

    function showPopup() {
      if (popupShown) return;

      popupShown = true;
      popup.style.display = "flex";
      status.textContent = "Status: popup ditampilkan";
    }

    function startVibration() {
      if (typeof navigator.vibrate !== "function") {
        status.textContent =
          "Vibration API tidak didukung browser atau perangkat ini.";
        return;
      }

      // Hentikan timer lama tanpa menonaktifkan tombol.
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      navigator.vibrate(0);

      // Getar 1 detik, jeda 300 milidetik.
      const pattern = [1000, 300];

      navigator.vibrate(pattern);

      vibrationTimer = setInterval(() => {
        navigator.vibrate(pattern);
      }, 1300);

      status.textContent =
        "Status: getaran berulang aktif";
    }

    function stopVibration() {
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      if (typeof navigator.vibrate === "function") {
        navigator.vibrate(0);
      }

      status.textContent = "Status: getaran berhenti";
    }

    // Gesture memunculkan popup.
    document.addEventListener("pointerup", showPopup, {
      once: true
    });

    // Tombol manual untuk menampilkan popup.
    showPopupBtn.addEventListener("click", showPopup);

    // Klik popup memulai getaran.
    closePopup.addEventListener("click", () => {
      popup.style.display = "none";
      startVibration();
    });

    // Tombol Stop selalu dapat digunakan.
    stopBtn.addEventListener("click", stopVibration);

    // Bersihkan getaran saat halaman ditinggalkan.
    window.addEventListener("pagehide", stopVibration);
  </script>
</body>
</html>
