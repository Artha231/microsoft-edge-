<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksploitasi Autoplay Zero-Gestur</title>
</head>
<body>

    <h1>Eksploitasi Sistem Suara Berlapis</h1>
    <p>Memuat eksperimen audio otomatis tanpa interaksi...</p>
    <div id="debug-log" style="font-family: monospace; padding: 10px; background: #eee; border-radius: 5px;"></div>

    <!-- TRIK 1: Sandbox Umpan Iframe Lintas-Otoritas -->
    <iframe src="about:blank" allow="autoplay; encrypted-media" id="ghost-iframe" style="display:none"></iframe>

    <!-- TRIK 2: Simulasi Input Hantu untuk Mengelabui Deteksi Autofill Browser -->
    <form id="ghost-form" style="position: absolute; left: -9999px;">
        <input type="text" name="username" autocomplete="username" value="user_test">
        <input type="password" name="password" autocomplete="current-password" value="pass_test">
    </form>

    <!-- Elemen Audio Utama -->
    <audio id="coreMusic" loop style="display:none;">
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <script>
        const audio = document.getElementById("coreMusic");
        const logger = document.getElementById("debug-log");
        let audioCtx;

        function log(msg) {
            logger.innerHTML += `> ${msg}<br>`;
        }

        window.addEventListener("DOMContentLoaded", () => {
            log("Memulai simulasi bypass keamanan...");

            // Langkah A: Putar senyap seketika demi mengamankan alur memori browser
            audio.muted = true;
            audio.play().then(() => {
                log("Audio dasar berjalan di latar belakang (Muted).");

                // Langkah B: Trigger rangkaian manipulasi asinkron secepat 50 milidetik
                setTimeout(() => {
                    try {
                        // Inisialisasi AudioContext dengan fallback standar
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        
                        // TRIK 3: Pancing fokus elemen hantu demi mensimulasikan "User Interaction"
                        const inputHantu = document.querySelector("#ghost-form input");
                        inputHantu.focus();
                        inputHantu.blur();

                        // Langkah C: Lepaskan status senyap pada audio utama
                        audio.muted = false;

                        // Langkah D: Paksa bangunkan AudioContext yang diblokir oleh sandbox
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume().then(() => {
                                log("💥 BYPASS SUKSES: AudioContext aktif tanpa gestur fisik!");
                            });
                        }
                    } catch (e) {
                        log("Kegagalan pada rantai asinkron: " + e.message);
                    }
                }, 50);

            }).catch(err => {
                log("Kegagalan kritis level 1: " + err.name);
            });
        });

        // INTEGRASI BACKGROUND TAB (Kode Anda yang dipertahankan & diselaraskan)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                log("Tab masuk ke Background.");
                audio.volume = 0.3; // Tetap menyala di latar belakang, volume mengecil
            } else {
                log("Tab kembali ke Foreground.");
                audio.volume = 1.0; // Volume kembali normal
                // Jaga agar AudioContext tetap terjaga dari pembatasan browser
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        });
    </script>
</body>
</html>
