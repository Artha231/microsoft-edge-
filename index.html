<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRUTAL — Non-Stop Vibrate Test</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0000;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        transition: background .15s;
    }
    #zone.idle   { background: #0a0000; }
    #zone.active {
        background: #2a0000;
        animation: bgPulse .3s infinite alternate;
    }
    @keyframes bgPulse {
        from { background: #2a0000; }
        to   { background: #4a0000; }
    }

    .icon {
        font-size: 80px;
        margin-bottom: 8px;
        transition: transform .1s;
    }
    #zone.active .icon {
        animation: shake .08s infinite;
    }
    @keyframes shake {
        0%   { transform: rotate(-15deg) scale(1.3); }
        50%  { transform: rotate(15deg) scale(1.4); }
        100% { transform: rotate(-15deg) scale(1.3); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        margin-bottom: 4px;
        letter-spacing: 2px;
    }
    #zone.active .title {
        color: #ff2020;
        text-shadow: 0 0 20px #ff0000;
    }

    .hint {
        font-size: 12px;
        color: #8b93a1;
        line-height: 1.5;
        max-width: 340px;
        margin-top: 8px;
    }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 52px;
        font-weight: 900;
        color: #ff2020;
        margin: 8px 0;
        min-height: 60px;
        letter-spacing: 2px;
        text-shadow: 0 0 30px #ff0000;
        font-variant-numeric: tabular-nums;
    }

    /* Stats */
    .stats {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 0, 0, 0.9);
        border: 1px solid #4a0000;
        border-radius: 6px;
        padding: 5px;
        text-align: center;
    }
    .stat .v { font-size: 15px; font-weight: 900; }
    .stat .l { color: #8b93a1; text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; font-size: 9px; }
    .stat.hi  .v { color: #ff2020; }
    .stat.ok  .v { color: #2ecc71; }
    .stat.err .v { color: #e74c3c; }
    .stat.warn .v { color: #f1c40f; }

    /* Log */
    #eventLog {
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-height: 140px;
        overflow-y: auto;
        background: #000;
        border: 1px solid #4a0000;
        border-radius: 8px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.45;
        white-space: pre-wrap;
        z-index: 5;
    }
    #eventLog .i  { color: #79c0ff; }
    #eventLog .ok { color: #3fb950; }
    #eventLog .wr { color: #d29922; }
    #eventLog .er { color: #f85149; }
    #eventLog .hi { color: #ff2020; font-weight: 700; }

    /* Pulse */
    #pulse {
        position: fixed;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 32, 32, 0.4);
        pointer-events: none;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity .1s;
        z-index: 3;
    }
    #pulse.on { opacity: 1; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi">   <div class="v" id="s-call">0</div> <div class="l">Calls</div></div>
    <div class="stat ok">   <div class="v" id="s-ok">0</div>   <div class="l">OK</div></div>
    <div class="stat err">  <div class="v" id="s-fail">0</div> <div class="l">Fail</div></div>
    <div class="stat warn"> <div class="v" id="s-hz">0</div>   <div class="l">Hz</div></div>
</div>

<div id="zone" class="idle">
    <div class="icon" id="icon">💀</div>
    <div class="title" id="title">GESER UNTUK BRUTAL</div>
    <div class="timer" id="timer"></div>
    <div class="hint" id="hint">
        Getar akan non-stop tanpa jeda.<br>
        Angkat jari untuk menghentikan.
    </div>
</div>

<div id="pulse"></div>
<div id="eventLog"></div>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone     = document.getElementById('zone');
const icon     = document.getElementById('icon');
const title    = document.getElementById('title');
const timer    = document.getElementById('timer');
const hint     = document.getElementById('hint');
const pulse    = document.getElementById('pulse');
const eventLog = document.getElementById('eventLog');
const sCall    = document.getElementById('s-call');
const sOk      = document.getElementById('s-ok');
const sFail    = document.getElementById('s-fail');
const sHz      = document.getElementById('s-hz');

// ============================================================
// KONFIGURASI BRUTAL
// ============================================================
// Strategi: 3 layer paralel, masing-masing memanggil vibrate() dengan
// chunk 9000ms dan interval pendek yang saling menutupi.
// Tidak ada gap > 500ms di antara dua panggilan berurutan.

const CHUNK        = 9000;   // di bawah batas 10000ms
const LAYER1_DELAY = 0;      // mulai langsung
const LAYER1_STEP  = 5000;   // 5 detik — overlap 4 detik
const LAYER2_DELAY = 1500;   // offset 1.5 detik
const LAYER2_STEP  = 5000;
const LAYER3_DELAY = 3000;   // offset 3 detik
const LAYER3_STEP  = 5000;
const WATCHDOG     = 800;    // cek tiap 800ms
const MAX_GAP      = 2000;   // jika gap > 2s → re-fire paksa

// ============================================================
// STATE
// ============================================================
let active      = false;
let startTime   = 0;
let layer1Id    = null;
let layer2Id    = null;
let layer3Id    = null;
let watchdogId  = null;
let tickerId    = null;
let callCount   = 0;
let okCount     = 0;
let failCount   = 0;
let lastFireAt  = 0;
let recentFires = [];
let lastHiddenAt = 0;

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 150;
let logLines = 0;
function ts() { return new Date().toTimeString().slice(0,8); }

function log(text, cls = '') {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = `[${ts()}] ${text}\n`;
    eventLog.appendChild(s);
    logLines++;
    while (logLines > MAX_LOG && eventLog.firstChild) {
        eventLog.removeChild(eventLog.firstChild);
        logLines--;
    }
    eventLog.scrollTop = eventLog.scrollHeight;
}

// ============================================================
// VIBRATE WRAPPER
// ============================================================
function vib(pattern) {
    if (typeof navigator.vibrate !== 'function') return false;
    try {
        const r = navigator.vibrate(pattern);
        lastFireAt = Date.now();
        recentFires.push(lastFireAt);
        const cutoff = Date.now() - 2000;
        recentFires = recentFires.filter(t => t > cutoff);
        return r;
    } catch (_) {
        return false;
    }
}

// ============================================================
// UI
// ============================================================
function updateTimer() {
    if (!active) return;
    const sec = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = sec + 's';
}

function updateStats() {
    sCall.textContent = callCount;
    sOk.textContent   = okCount;
    sFail.textContent = failCount;
    sHz.textContent   = (recentFires.length / 2).toFixed(1);
}

function showPulse(x, y) {
    pulse.style.left = x + 'px';
    pulse.style.top  = y + 'px';
    pulse.classList.add('on');
}
function hidePulse() { pulse.classList.remove('on'); }

// ============================================================
// FIRE
// ============================================================
function fire(layer) {
    if (!active) return;
    const ok = vib(CHUNK);
    callCount++;
    if (ok) okCount++; else failCount++;
    updateStats();
    if (!ok) log(`⚠ fire(${layer}) FAIL`, 'wr');
}

// ============================================================
// START — brutal 3 layer
// ============================================================
function start() {
    if (active) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = 'Vibration API tidak didukung.';
        log('❌ API tidak tersedia', 'er');
        return;
    }

    active = true;
    startTime = Date.now();
    callCount = okCount = failCount = 0;
    recentFires = [];
    updateStats();

    zone.classList.remove('idle');
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'BRUTAL MODE';

    log('💀 BRUTAL MODE AKTIF', 'hi');
    log(`Layer1: step ${LAYER1_STEP}ms | Layer2: offset ${LAYER2_DELAY}ms step ${LAYER2_STEP}ms | Layer3: offset ${LAYER3_DELAY}ms step ${LAYER3_STEP}ms`, 'i');

    // ---- Layer 1 ----
    fire('L1-init');
    layer1Id = setInterval(() => fire('L1'), LAYER1_STEP);

    // ---- Layer 2 (offset) ----
    setTimeout(() => {
        if (!active) return;
        fire('L2-init');
        layer2Id = setInterval(() => fire('L2'), LAYER2_STEP);
    }, LAYER2_DELAY);

    // ---- Layer 3 (offset) ----
    setTimeout(() => {
        if (!active) return;
        fire('L3-init');
        layer3Id = setInterval(() => fire('L3'), LAYER3_STEP);
    }, LAYER3_DELAY);

    // ---- Watchdog ----
    watchdogId = setInterval(() => {
        if (!active) return;
        const gap = Date.now() - lastFireAt;
        if (gap > MAX_GAP) {
            log(`🐕 Watchdog: gap ${gap}ms → re-fire paksa`, 'wr');
            fire('watchdog');
        }
    }, WATCHDOG);

    // ---- Ticker ----
    updateTimer();
    tickerId = setInterval(updateTimer, 50);

    hint.innerHTML = `💀 NON-STOP AKTIF<br>Angkat jari untuk berhenti.`;
}

// ============================================================
// STOP
// ============================================================
function stop(reason = 'manual') {
    if (!active) return;
    active = false;

    clearInterval(layer1Id);   layer1Id = null;
    clearInterval(layer2Id);   layer2Id = null;
    clearInterval(layer3Id);   layer3Id = null;
    clearInterval(watchdogId); watchdogId = null;
    clearInterval(tickerId);   tickerId = null;

    // Matikan vibrate dengan semua cara yang mungkin
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}

    zone.classList.remove('active');
    zone.classList.add('idle');
    icon.textContent = '💀';
    title.textContent = 'GESER UNTUK BRUTAL';

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = elapsed + 's';
    hint.innerHTML = `Berhenti (${reason}) setelah ${elapsed}s.<br>
        ${callCount} calls · ${okCount} OK · ${failCount} FAIL.<br>
        Geser lagi untuk memulai.`;

    log(`⏹ Stop (${reason}) — ${elapsed}s — ${callCount} calls, ${okCount} OK, ${failCount} FAIL`, 'ok');
}

// ============================================================
// GESTURE
// ============================================================
function onTouchStart(e) {
    const t = e.touches[0];
    if (t) showPulse(t.clientX, t.clientY);
}
function onTouchMove(e) {
    const t = e.touches[0];
    if (!t) return;
    showPulse(t.clientX, t.clientY);
    if (!active) start();
}
function onTouchEnd() {
    hidePulse();
    if (active) stop('angkat jari');
}
function onTouchCancel() {
    hidePulse();
    if (active) stop('touchcancel');
}

zone.addEventListener('touchstart',  onTouchStart,  { passive: false });
zone.addEventListener('touchmove',   onTouchMove,   { passive: false });
zone.addEventListener('touchend',    onTouchEnd,    { passive: false });
zone.addEventListener('touchcancel', onTouchCancel, { passive: false });

// Mouse fallback
zone.addEventListener('mousemove', (e) => {
    if (e.buttons === 0) return;
    showPulse(e.clientX, e.clientY);
    if (!active) start();
});
zone.addEventListener('mouseup', () => {
    hidePulse();
    if (active) stop('mouseup');
});

// ============================================================
// VISIBILITY (tab switch test)
// ============================================================
document.addEventListener('visibilitychange', () => {
    const now = Date.now();
    if (document.hidden) {
        lastHiddenAt = now;
        log('👁 HIDDEN — getar seharusnya berhenti', 'hi');
        log(`   active=${active}, calls=${callCount}, gap=${now - lastFireAt}ms`, 'i');
        try { navigator.vibrate(0); } catch(_) {}
    } else {
        log('👁 VISIBLE kembali', 'hi');
        log(`   durasi hidden=${now - lastHiddenAt}ms`, 'i');
        if (navigator.userActivation) {
            const ua = navigator.userActivation;
            log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
        }
        if (typeof navigator.vibrate === 'function') {
            const t = vib([30]);
            log(`   test vibrate([30]) → ${t ? 'OK' : 'FAIL'}`, t ? 'ok' : 'er');
            try { navigator.vibrate(0); } catch(_) {}
        }
    }
});

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    clearInterval(layer1Id);
    clearInterval(layer2Id);
    clearInterval(layer3Id);
    clearInterval(watchdogId);
    clearInterval(tickerId);
    try { navigator.vibrate(0); } catch(_) {}
});

window.addEventListener('blur', () => {
    log('💤 window blur', 'wr');
});
window.addEventListener('focus', () => {
    log('🎯 window focus', 'ok');
});

// ============================================================
// INIT
// ============================================================
updateStats();
log('=== BRUTAL MODE READY ===', 'hi');
if (typeof navigator.vibrate === 'function') {
    log('✅ Vibration API tersedia', 'ok');
    log('Geser jari → getar NON-STOP tanpa jeda', 'i');
} else {
    log('❌ Vibration API TIDAK tersedia', 'er');
}
log(`Konfigurasi: chunk=${CHUNK}ms · step=5000ms · watchdog=${WATCHDOG}ms`, 'i');

})();
</script>

</body>
</html>
