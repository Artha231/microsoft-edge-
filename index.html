<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iframe Download PoC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }

    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1769e0;
      color: #fff;
    }

    input {
      padding: 8px;
      width: 80px;
    }

    #status {
      margin-top: 16px;
    }

    #downloads a {
      display: block;
      margin-top: 12px;
    }

    iframe {
      width: 100%;
      height: 100px;
      border: 1px solid #ddd;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>Iframe Download PoC (Batas 20 File)</h2>

    <p>
      Demo pembuatan file TXT dan pengujian iframe
      di browser dengan batas maksimal 20 file.
    </p>

    <!-- Mengubah nilai max menjadi 20 dan default value menjadi 20 -->
    <label for="count">Jumlah file (1–20):</label>
    <input
      id="count"
      type="number"
      min="1"
      max="20"
      value="20"
    >

    <p>
      <button id="start" type="button">
        Buat File TXT
      </button>
    </p>

    <p id="status" role="status">
      Siap menjalankan pengujian.
    </p>

    <div id="downloads"></div>
    <div id="preview"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const countInput = document.getElementById("count");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");
    const preview = document.getElementById("preview");

    let objectUrls = [];

    start.addEventListener("click", () => {
      // Bersihkan hasil pengujian sebelumnya.
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();
      preview.replaceChildren();

      const count = Number(countInput.value);

      // Mengubah validasi agar menerima rentang 1 sampai 20
      if (!Number.isInteger(count) || count < 1 || count > 20) {
        status.textContent = "Masukkan jumlah file dari 1 sampai 20.";
        return;
      }

      for (let i = 1; i <= count; i++) {
        const content =
          `PoC file ${i}\n` +
          `Dibuat untuk pengujian browser.\n`;

        const blob = new Blob(
          [content],
          { type: "text/plain;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        // Tautan unduhan.
        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-${i}.txt`;
        link.textContent = `Unduh poc-${i}.txt`;
        downloads.appendChild(link);

        // Pratinjau iframe, bukan pemicu unduhan.
        const iframe = document.createElement("iframe");
        iframe.title = `Pratinjau file ${i}`;
        iframe.src = url;
        preview.appendChild(iframe);
      }

      status.textContent =
        `${count} file TXT berhasil disiapkan. ` +
        "Klik setiap tautan untuk mengunduh.";
    });
  </script>
</body>
</html>
