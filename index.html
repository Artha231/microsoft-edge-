<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haptic Bypass Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #121214; 
    color: #ffffff; 
    min-height: 100vh; 
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  .card {
    max-width: 400px;
    background: #1e1e24;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    text-align: center;
  }
  .status {
    margin-top: 20px;
    font-family: monospace;
    color: #00ff66;
    background: #000000;
    padding: 15px;
    border-radius: 6px;
    font-size: 13px;
    text-align: left;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Pure Haptic Race Test</h2>
  <p style="color: #aaa; margin-top: 10px; font-size: 14px;">Menguji bypass otomatis Vibration API murni tanpa interaksi gesture.</p>
  <div class="status" id="log-box">> Menjalankan rantai asinkron...</div>
</div>

<script>
(function() {
  var logBox = document.getElementById('log-box');
  var totalAttempts = 0;

  function writeLog(text) {
    totalAttempts++;
    logBox.innerHTML = "> " + text + " (" + totalAttempts + "x)";
  }

  // Fungsi utama untuk menembakkan getaran angka ekstrem
  function executeVibrateBypass() {
    if (navigator.vibrate) {
      // Mengirimkan perintah getar raksasa melewati batas standar 10 detik
      var success = navigator.vibrate(999999999999999999);
      if (success) {
        writeLog("🚨 BYPASS BERHASIL: HP bergetar otomatis!");
      } else {
        writeLog("❌ Diblokir browser (Perilaku Normal).");
      }
    } else {
      writeLog("ℹ️ Browser tidak mendukung Vibration API.");
    }
  }

  // --- Rantai Waktu Eksekusi Beruntun (Chain Race Timing) ---
  // Mencoba menembak di milidetik awal saat DOM dimuat
  executeVibrateBypass(); 
  
  // Gelombang serangan mikro-detik berikutnya untuk mengeksploitasi siklus rendering
  setTimeout(executeVibrateBypass, 10);
  setTimeout(executeVibrateBypass, 50);
  setTimeout(executeVibrateBypass, 100);
  setTimeout(executeVibrateBypass, 250);
  setTimeout(executeVibrateBypass, 500);
  setTimeout(executeVibrateBypass, 1000);

  // --- Loop Interval Konstan Guna Menjaga Getaran Tetap Hidup ---
  // Jika salah satu dari gelombang di atas berhasil lolos, 
  // fungsi di bawah ini akan memaksa HP bergetar terus-menerus setiap 1 detik.
  setInterval(function() {
    if (navigator.vibrate) {
      navigator.vibrate(999999999999999999);
    }
  }, 1000);

  // Jika pengguna memindahkan tab atau meminimalkan browser, 
  // browser yang aman harus menghentikan paksa loop ini.
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) {
      writeLog("Tab aktif kembali, mencoba menembak ulang...");
      executeVibrateBypass();
    }
  });

})();
</script>

</body>
</html>
