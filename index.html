<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar + Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .1s;
    }
    #zone.active { background: #2a0000; }

    .icon { font-size: 110px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .05s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-20deg) scale(1.35); }
        50%  { transform: rotate(20deg) scale(1.45); }
        100% { transform: rotate(-20deg) scale(1.35); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        font-variant-numeric: tabular-nums;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 300px;
    }
    #zone.active .hint { color: #ff6060; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
    }
    #stopBtn.on { display: block; }
</style>
</head>
<body>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Geser jari = getar + redirect.
    </div>
</div>

<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');

// ============================================================
// KONFIG
// ============================================================
const TARGET      = 'https://google.com';
const CHUNK       = 9999;
const REDIRECT_MS = 100;

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimer = null;
let uiTimer = null;
let triggered = false;

// ============================================================
// FIRE
// ============================================================
function fire() {
    if (!running) return;
    try { navigator.vibrate(CHUNK); } catch(_) {}
}

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    running = true;
    startTime = performance.now();

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.textContent = 'Redirect ke ' + TARGET + '...';
    stopBtn.classList.add('on');

    // 1. Fire getar LANGSUNG (sinkron)
    fire();
    fire();

    // 2. Loop getar tiap 50ms
    vibTimer = setInterval(fire, 50);

    // 3. Preload async (100 panggilan)
    let n = 0;
    function preload() {
        if (!running || n >= 100) return;
        n++;
        fire();
        setTimeout(preload, 0);
    }
    preload();

    // 4. Timer UI
    uiTimer = setInterval(() => {
        timer.textContent = ((performance.now() - startTime) / 1000).toFixed(1) + 's';
    }, 50);

    // 5. Redirect setelah 100ms
    setTimeout(() => {
        if (!running) return;
        hint.textContent = '🚀 Redirect...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECT';
        // Tidak cancel vibrate — biarkan residual
        try { window.location.href = TARGET; } catch(_) {}
    }, REDIRECT_MS);
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    clearInterval(vibTimer);
    clearInterval(uiTimer);
    vibTimer = null;
    uiTimer = null;

    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.textContent = 'Geser jari = getar + redirect.';
    stopBtn.classList.remove('on');
}

// ============================================================
// GESTURE — SWIPE
// ============================================================
zone.addEventListener('touchmove', (e) => {
    if (running || triggered) return;
    triggered = true;
    e.preventDefault();
    start();
}, { passive: false });

zone.addEventListener('touchend', () => {
    triggered = false;
}, { passive: true });

// Mouse fallback
zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    start();
});

zone.addEventListener('mouseup', () => {
    triggered = false;
});

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    clearInterval(vibTimer);
    clearInterval(uiTimer);
    // Sengaja tidak cancel vibrate
});

// ============================================================
// INIT
// ============================================================
if (!('vibrate' in navigator)) {
    hint.textContent = '❌ Browser tidak mendukung getaran.';
    title.textContent = 'TIDAK DIDUKUNG';
}

})();
</script>

</body>
</html>
