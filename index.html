<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fullscreen Test</title>

  <!-- Meta Tag Wajib Fullscreen Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .status {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 6px;
      background: #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Android Fullscreen Check</h2>
    <div id="status" class="status">Mengecek mode PWA...</div>
  </div>

  <script>
    // Register SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    // Deteksi apakah sedang dibuka lewat aplikasi hasil "Add to Home Screen"
    window.addEventListener('load', () => {
      const isPWA = window.matchMedia('(display-mode: standalone)').matches ||
                    window.matchMedia('(display-mode: fullscreen)').matches ||
                    window.navigator.standalone;

      const status = document.getElementById('status');
      if (isPWA) {
        status.textContent = "BERHASIL: Buka dalam mode Fullscreen PWA!";
        status.style.background = "#065f46";
      } else {
        status.textContent = "Gagal: Kamu masih membuka link ini dari TAB BROWSER biasa. Tekan Titik Tiga (⋮) -> Pilih 'Instal Aplikasi' / 'Tambahkan ke Layar Utama', lalu buka dari ICON baru yang muncul di Home Screen Android.";
        status.style.background = "#991b1b";
      }
    });
  </script>
</body>
</html>
