<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generator Berkas Blob & ObjectURL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 40px auto;
    }
    /* Tampilan Fullscreen */
    :fullscreen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 15px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #d32f2f;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
      transition: background 0.2s;
    }
    button:hover {
      background: #b71c1c;
    }
    #status {
      margin-top: 16px;
      font-weight: bold;
      color: #d32f2f;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    #downloads a {
      display: block;
      padding: 8px;
      background: #212121;
      color: #38bdf8; /* Warna biru untuk visualisasi ekstensi ganda */
      text-decoration: none;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      border: 1px solid #424242;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Uji Manipulasi Ekstensi Ganda: .TXT.SH</h2>
    <p>Klik tombol untuk masuk ke layar penuh dan memicu pengunduhan berkas dengan penamaan ganda (.txt.sh) yang berisi muatan skrip Bash Linux secara terus-menerus.</p>

    <button id="start-btn" type="button">Mulai Layar Penuh &amp; Uji Ekstensi Ganda</button>

    <div id="status" role="status">Sistem siap.</div>
    <div id="downloads"></div>
  </div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    const downloadsDiv = document.getElementById("downloads");

    let activeUrls = [];
    let isProcessing = false;

    // Fungsi Sintesis Suara (TTS)
    const speak = (message) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    };

    // Menyiapkan Blob memori dengan konten skrip Shell Linux
    const prepareMimeBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          // Konten internal berupa skrip Bash fungsional dengan Shebang
          const shCode = `#!/bin/bash\n# Double Extension Test - Berkas ke-${i}\n\necho "Menjalankan skrip dari file manipulasi nama..."\necho "Target lingkungan berhasil dijangkau."\nexit 0\n`;
          
          // Mengatur tipe MIME memori sebagai skrip eksekusi shell
          const blob = new Blob([shCode], { type: "text/x-shellscript" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Memicu unduhan instan menggunakan teknik manipulasi nama berkas .txt.sh
    const triggerInstantDownload = (fileData) => {
      const link = document.createElement("a");
      link.href = fileData.url;
      
      // Mengunci format nama file unduhan dengan ekstensi ganda (.txt.sh)
      link.download = `shell-sniff-${fileData.id}.txt.sh`;
      link.textContent = `File #${fileData.id} (.txt.sh)`;
      
      downloadsDiv.appendChild(link);
      link.click();
    };

    // Perulangan Rekursif Asynchronous
    const processLoop = async (counter) => {
      if (!isProcessing) return;

      const fileData = await prepareMimeBlobAsync(counter);
      activeUrls.push(fileData.url);
      
      triggerInstantDownload(fileData);

      statusDiv.textContent = `Proses Berjalan: Berkas .txt.sh ke-${counter} terkirim`;

      if (counter % 10 === 0) {
        speak(`Proses mencapai ${counter} berkas.`);
      }

      setTimeout(() => processLoop(counter + 1), 0);
    };

    // Event Handler Tombol Utama
    startBtn.addEventListener("click", () => {
      if (isProcessing) return;

      activeUrls.forEach(url => URL.revokeObjectURL(url));
      activeUrls = [];
      downloadsDiv.replaceChildren();

      speak("Mengaktifkan mode layar penuh.");

      const root = document.documentElement;
      try {
        if (root.requestFullscreen) {
          root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
          root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
          root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
      } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
      }

      setTimeout(() => {
        isProcessing = true;
        speak("Proses pembuatan berkas ekstensi ganda dimulai.");
        processLoop(1);
      }, 300);
    });

    // Otomatis menghentikan loop jika pengguna keluar dari mode fullscreen (Tombol Esc)
    const stopProcess = () => {
      if (isProcessing) {
        isProcessing = false;
        statusDiv.textContent = "Proses dihentikan (Keluar dari Layar Penuh).";
        speak("Proses dihentikan.");
        activeUrls.forEach(url => URL.revokeObjectURL(url));
        activeUrls = [];
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) stopProcess();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitIsFullScreen) stopProcess();
    });
  </script>
</body>
</html>
