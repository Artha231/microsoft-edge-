<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Critical Alert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* Efek Strobo Visual Merah-Hitam Agresif */
        .emergency-strobe {
            animation: strobeEffect 0.3s infinite alternate;
        }

        @keyframes strobeEffect {
            0% { background-color: #000; }
            100% { background-color: #ff0000; }
        }

        .alert-box {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="alert-box">
        <h1>CRITICAL SECURITY ALERT</h1>
        <p>Interactive Security Testing Protocol Active. Tap anywhere to acknowledge.</p>
    </div>

    <script>
    (function() {
        var triggered = false;
        var wakeLock = null;

        // ===== 1. FITUR GETAR (VIBRATION API) =====
        function triggerHardwareVibration() {
            if ('vibrate' in navigator) {
                // Pola: Getar 500ms, Diam 250ms, Getar 500ms, Diam 250ms (Diulang-ulang)
                navigator.vibrate([500, 250, 500, 250, 500, 250, 1000, 500]);
            }
        }

        // ===== 2. FITUR LAYAR PENUH (FULLSCREEN API) =====
        function requestImmersiveMode() {
            var docElm = document.documentElement;
            try {
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen();
                } else if (docElm.mozRequestFullScreen) { /* Firefox */
                    docElm.mozRequestFullScreen();
                } else if (docElm.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                    docElm.webkitRequestFullscreen();
                } else if (docElm.msRequestFullscreen) { /* IE/Edge */
                    docElm.msRequestFullscreen();
                }
            } catch(e) {}
        }

        // ===== 3. FITUR WAKE LOCK (MENCEGAH LAYAR MATI) =====
        async function requestScreenWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active.');
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            }
        }

        // ===== 4. FITUR EFEK STROBO VISUAL =====
        function triggerVisualStrobe() {
            document.body.classList.add('emergency-strobe');
        }

        // ===== EKSEKUSI GABUNGAN PADA GESTUR PENGGUNA =====
        function triggerAllFeatures() {
            if (triggered) return;
            triggered = true;

            // Jalankan seluruh interaksi fisik dan visual secara serentak
            requestImmersiveMode();
            triggerHardwareVibration();
            triggerVisualStrobe();
            requestScreenWakeLock();
        }

        // Mencegah interaksi klik kanan
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Tangkap interaksi pertama pengguna untuk mengeksekusi fitur terlindungi
        document.addEventListener('click', triggerAllFeatures, { once: true });
        document.addEventListener('touchstart', triggerAllFeatures, { once: true });
        document.addEventListener('keydown', triggerAllFeatures, { once: true });

        // Backup Wake Lock jika tab berpindah dan kembali aktif
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestScreenWakeLock();
            }
        });

    })();
    </script>
</body>
</html>
