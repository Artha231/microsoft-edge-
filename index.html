```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fullscreen PoC</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      padding: 24px;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fullscreen PoC</h1>
    <p id="status">Mencoba mengaktifkan fullscreen...</p>

    <button id="enter" hidden>
      Aktifkan Fullscreen
    </button>
  </main>

  <script>
    const status = document.getElementById("status");
    const enter = document.getElementById("enter");

    async function requestFullscreen() {
      try {
        await document.documentElement.requestFullscreen();
        status.textContent = "Fullscreen aktif.";
        enter.hidden = true;
      } catch {
        status.textContent =
          "Browser memerlukan interaksi untuk fullscreen.";
        enter.hidden = false;
      }
    }

    // Mencoba otomatis ketika halaman dibuka.
    window.addEventListener("load", requestFullscreen);

    // Fallback jika browser menolak permintaan otomatis.
    enter.addEventListener("click", requestFullscreen);
  </script>
</body>
</html>
