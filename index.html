<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Android Fullscreen PWA</title>
  
  <!-- File Manifest & Meta khusus Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
    .status {
      padding: 0.8rem;
      border-radius: 8px;
      background: #065f46;
      margin-top: 1rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Mode App Fullscreen</h1>
    <p>Website ini berjalan otomatis tanpa alamat URL bar di Android.</p>
    <div id="display-mode" class="status">Memeriksa mode tampilan...</div>
  </div>

  <script>
    // Registrasi Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker terdaftar'))
        .catch(err => console.error('SW error:', err));
    }

    // Cek apakah dibuka lewat Web / Standalone App
    window.addEventListener('DOMContentLoaded', () => {
      const statusEl = document.getElementById('display-mode');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

      if (isStandalone) {
        statusEl.textContent = "Status: Berjalan dalam mode Fullscreen PWA!";
      } else {
        statusEl.textContent = "Buka menu Chrome (⋮) -> pilih 'Tambahkan ke Layar Utama' untuk menguji Fullscreen otomatis.";
        statusEl.style.background = "#854d0e";
      }
    });
  </script>
</body>
</html>
