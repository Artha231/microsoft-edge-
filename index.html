<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar Lama → Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; cursor: default; }

    .icon {
        font-size: 100px;
        margin-bottom: 16px;
    }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-18deg) scale(1.35); }
        50%  { transform: rotate(18deg) scale(1.45); }
        100% { transform: rotate(-18deg) scale(1.35); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        letter-spacing: 2px;
        text-shadow: 0 0 35px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone:not(.active) .timer { color: #333; text-shadow: none; }

    /* Config panel — untuk ubah durasi getar & target */
    .config {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .config label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: #8b93a1;
    }
    .config input {
        background: #05070a;
        border: 1px solid #2c313a;
        color: #ff2020;
        border-radius: 4px;
        padding: 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
    }
    .config .full { grid-column: 1 / -1; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 25px #ff0000;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }

    /* Status bar */
    .status {
        position: fixed;
        top: 74px;
        left: 10px;
        right: 10px;
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        z-index: 5;
    }
    .status .item {
        text-align: center;
    }
    .status .item .v { font-size: 13px; font-weight: 900; color: #ff2020; }
    .status .item .l { color: #8b93a1; font-size: 8px; text-transform: uppercase; margin-top: 1px; }
</style>
</head>
<body>

<div class="config">
    <label>Durasi getar sebelum redirect (ms)
        <input type="number" id="cfgDelay" value="3000" min="500" max="30000" step="500">
    </label>
    <label>Chunk per panggilan (ms)
        <input type="number" id="cfgChunk" value="9000" min="500" max="9999" step="500">
    </label>
    <label class="full">URL tujuan redirect
        <input type="text" id="cfgTarget" value="https://google.com/">
    </label>
</div>

<div class="status">
    <div class="item"><div class="v" id="s-calls">0</div><div class="l">Calls</div></div>
    <div class="item"><div class="v" id="s-countdown">—</div><div class="l">Redirect in</div></div>
    <div class="item"><div class="v" id="s-elapsed">0.0s</div><div class="l">Elapsed</div></div>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">KLIK DI MANA SAJA</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Getar dulu, lalu redirect.<br>
        Jari boleh dilepas.
    </div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');
const sCalls  = document.getElementById('s-calls');
const sCountdown = document.getElementById('s-countdown');
const sElapsed = document.getElementById('s-elapsed');
const cfgDelay  = document.getElementById('cfgDelay');
const cfgChunk  = document.getElementById('cfgChunk');
const cfgTarget = document.getElementById('cfgTarget');

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimer = null;
let uiTimer = null;
let redirectTimer = null;
let calls = 0;

// ============================================================
// FIRE VIBRATE
// ============================================================
function fire(chunk) {
    if (!running) return;
    calls++;
    sCalls.textContent = calls;
    try {
        navigator.vibrate(chunk);
    } catch (_) {}
}

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = '❌ Browser tidak mendukung getaran.';
        return;
    }

    // Baca config
    const DELAY   = Math.max(500, parseInt(cfgDelay.value, 10) || 3000);
    const CHUNK   = Math.max(500, Math.min(9999, parseInt(cfgChunk.value, 10) || 9000));
    const TARGET  = (cfgTarget.value || 'https://google.com/').trim();
    const INTERVAL = Math.max(200, Math.floor(CHUNK / 2)); // panggil tiap setengah chunk

    running = true;
    startTime = Date.now();
    calls = 0;

    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    stopBtn.classList.add('on');

    // Fire pertama langsung
    fire(CHUNK);

    // Loop getar: panggil tiap INTERVAL, minta CHUNK
    // Karena INTERVAL < CHUNK, getar tidak pernah berhenti
    vibTimer = setInterval(() => fire(CHUNK), INTERVAL);

    // UI timer
    uiTimer = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 9000;
        timer.textContent = elapsed.toFixed(1) + 's';
        sElapsed.textContent = elapsed.toFixed(1) + 's';

        // Countdown redirect
        const remaining = Math.max(0, (DELAY - (Date.now() - startTime)) / 9000);
        sCountdown.textContent = remaining.toFixed(1) + 's';

        if (remaining > 0) {
            hint.innerHTML = `Getar akan berjalan <b>${remaining.toFixed(1)}s</b> lagi,<br>lalu redirect ke:<br><b style="color:#ff2020;">${TARGET}</b>`;
        }
    }, 100);

    // Redirect setelah DELAY
    redirectTimer = setTimeout(() => {
        if (!running) return;
        hint.innerHTML = '🚀 Redirect...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECTING';

        // Coba redirect top-level
        try {
            // Coba keluar dari iframe dulu
            if (window.top && window.top !== window) {
                window.top.location.href = TARGET;
            } else {
                window.location.href = TARGET;
            }
        } catch (e) {
            // Fallback kalau sandbox memblokir
            try { window.location.href = TARGET; } catch(_) {}
        }
    }, DELAY);

    // Set hint awal
    hint.innerHTML = `Getar akan berjalan <b>${(DELAY/9000).toFixed(1)}s</b>,<br>lalu redirect ke:<br><b style="color:#ff2020;">${TARGET}</b>`;
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    clearInterval(vibTimer);
    clearInterval(uiTimer);
    clearTimeout(redirectTimer);
    vibTimer = null;
    uiTimer = null;
    redirectTimer = null;

    // Matikan getar
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'KLIK DI MANA SAJA';
    hint.innerHTML = 'Getar dulu, lalu redirect.<br>Jari boleh dilepas.';
    stopBtn.classList.remove('on');

    const elapsed = (Date.now() - startTime) / 9000;
    timer.textContent = elapsed.toFixed(1) + 's';
}

// ============================================================
// EVENTS
// ============================================================
zone.addEventListener('click', () => {
    if (!running) start();
});

stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});

window.addEventListener('beforeunload', () => {
    if (vibTimer) clearInterval(vibTimer);
    if (uiTimer) clearInterval(uiTimer);
    if (redirectTimer) clearTimeout(redirectTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

// ============================================================
// INIT
// ============================================================
if (typeof navigator.vibrate !== 'function') {
    hint.textContent = '❌ navigator.vibrate tidak didukung.';
    title.textContent = 'TIDAK DIDUKUNG';
}

})();
</script>

</body>
</html>
