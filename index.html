<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fullscreen & Multi-Download PoC</title>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }
    button {
      padding: 14px 20px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #d32f2f;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }
    #status { margin-top: 16px; font-weight: bold; color: #555; }
    #downloads a { display: block; margin-top: 12px; }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Fullscreen & Multi-Download Test</h2>
    <p>Demo pengujian perilaku browser saat memicu mode fullscreen dan unduhan massal dalam satu interaksi.</p>

    <p>
      <button id="start" type="button">Masuk Fullscreen & Unduh 20 File</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");
    const mainPanel = document.getElementById("main-panel");

    let objectUrls = [];

    start.addEventListener("click", () => {
      // 1. Pemicu Mode Fullscreen
      // Karena dipicu oleh klik nyata (User Gesture), browser umumnya mengizinkan halaman masuk fullscreen
      if (mainPanel.requestFullscreen) {
        mainPanel.requestFullscreen().catch(err => {
          console.log(`Gagal masuk fullscreen: ${err.message}`);
        });
      } else if (mainPanel.webkitRequestFullscreen) { /* Safari */
        mainPanel.webkitRequestFullscreen();
      }

      // Bersihkan sisa objek memori sebelumnya
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      status.textContent = "Memproses mode fullscreen dan mengunduh 20 file...";

      // 2. Pemicu Unduhan Massal (20 File)
      for (let i = 1; i <= 20; i++) {
        const content = `PoC file ${i}\nPengujian kombinasi fitur browser.\n`;
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);

        const link = document.createElement("a");
        link.href = url;
        link.download = `poc-kombinasi-${i}.txt`;
        link.textContent = `Tautan file ${i}`;
        downloads.appendChild(link);

        // Eksekusi klik otomatis per file
        link.click();
      }

      status.textContent = "Kombinasi perintah berhasil dieksekusi. Periksa respons pertahanan browser.";
    });
  </script>
</body>
</html>
