<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture & Vibration Analyzer (Stress Test)</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 150vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      font-weight: bold;
    }

    #popup {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgb(0 0 0 / 55%);
    }

    .popup-content {
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 16px;
      background: white;
      text-align: center;
    }

    .popup-content h3 {
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #d32f2f; /* Mengubah warna menjadi merah sebagai penanda stress-test */
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Gesture & Vibration Analyzer</h2>

    <p>
      Geser halaman ke atas atau ke bawah untuk menampilkan
      notifikasi pengujian ekstrem.
    </p>

    <div id="status" role="status" aria-live="polite">
      Status: menunggu gesture
    </div>
  </main>

  <div id="popup" role="dialog"
       aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-content">
      <h3 id="popupTitle">Pengujian Getaran Ekstrem</h3>

      <p>
        Gerakan geser terdeteksi. Tekan tombol untuk menjalankan
        pengujian banjir antrean perangkat keras (Vibration Flooding).
      </p>

      <button id="closePopup">Mulai Stress Test Getaran</button>
    </div>
  </div>

  <script>
    const popup = document.getElementById("popup");
    const closePopup = document.getElementById("closePopup");
    const status = document.getElementById("status");

    let popupShown = false;
    let vibrationTimer = null;

    function showPopup() {
      if (popupShown) return;

      popupShown = true;
      popup.style.style.display = "flex";
      status.textContent = "Status: gesture terdeteksi";
    }

    // Popup muncul saat halaman digulir.
    window.addEventListener("scroll", showPopup, {
      once: true,
      passive: true
    });

    // Deteksi geseran jari pada perangkat sentuh.
    window.addEventListener("touchmove", showPopup, {
      once: true,
      passive: true
    });

    closePopup.addEventListener("click", () => {
      popup.style.display = "none";

      if (typeof navigator.vibrate !== "function") {
        status.textContent =
          "Browser atau perangkat tidak mendukung Vibration API.";
        return;
      }

      // Bersihkan timer sebelumnya jika ada.
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      status.textContent = "Status: Menjalankan pengujian banjir antrean hardware (1ms)...";

      // Eksekusi flooding antrean getaran setiap 1 milidetik
      vibrationTimer = setInterval(() => {
        try {
          // Melakukan reset getaran aktif dan menimpa dengan instruksi durasi panjang (10 detik)
          // Pola ini berulang secepat mungkin untuk menguji batas ketahanan proses IPC browser.
          navigator.vibrate(0); 
          navigator.vibrate(10000); 
        } catch (e) {
          status.textContent = "Status: Error terdeteksi pada eksekusi API.";
          clearInterval(vibrationTimer);
        }
      }, 1);
    });

    // Pengaman: Bersihkan timer dan matikan hardware getar jika pengguna memindahkan tab/menutup browser.
    window.addEventListener("pagehide", () => {
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      if (typeof navigator.vibrate === "function") {
        navigator.vibrate(0);
      }
    });
  </script>
</body>
</html>
