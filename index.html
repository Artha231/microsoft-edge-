<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Test Residual Vibrate</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 8px;
    }
    h1 { font-size: 16px; margin-bottom: 4px; }
    .sub { font-size: 11px; color: #8b93a1; line-height: 1.5; margin-bottom: 8px; }

    .test-btn {
        padding: 14px 12px;
        font-size: 13px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
        text-align: left;
        font-family: inherit;
        transition: transform .05s;
    }
    .test-btn:active { transform: scale(0.98); }
    .test-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .test-btn .name { display: block; font-size: 13px; font-weight: 700; }
    .test-btn .desc { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; font-weight: 400; }

    .t1 { background: #2563eb; }
    .t2 { background: #7c3aed; }
    .t3 { background: #dc2626; }
    .t4 { background: #ea580c; }
    .t5 { background: #059669; }

    #log {
        flex: 1;
        overflow-y: auto;
        background: #05070a;
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 10px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }
    #log .i  { color: #79c0ff; }
    #log .ok { color: #3fb950; }
    #log .wr { color: #d29922; }
    #log .er { color: #f85149; }
    #log .hi { color: #d2a8ff; font-weight: 700; }
    #log .dim { color: #6b7280; }

    #stopAll {
        padding: 12px;
        background: #374151;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="app">
    <h1>🧪 Test Residual Vibrate</h1>
    <div class="sub">
        Pilih test, lalu <b>rasakan getar</b> setelah redirect.<br>
        Ukur berapa detik getar terasa setelah redirect.
    </div>

    <button class="test-btn t1" onclick="test1()">
        <span class="name">Test 1: Basic Redirect</span>
        <span class="desc">vibrate(9999) → redirect instan</span>
    </button>

    <button class="test-btn t2" onclick="test2()">
        <span class="name">Test 2: Cancel Explicit</span>
        <span class="desc">vibrate(9999) + vibrate(0) → redirect</span>
    </button>

    <button class="test-btn t3" onclick="test3()">
        <span class="name">Test 3: Preload 100x</span>
        <span class="desc">100× vibrate(9999) sinkron → redirect</span>
    </button>

    <button class="test-btn t4" onclick="test4()">
        <span class="name">Test 4: Delayed Redirect</span>
        <span class="desc">vibrate(9999) → tunggu 3s → redirect</span>
    </button>

    <button class="test-btn t5" onclick="test5()">
        <span class="name">Test 5: about:blank</span>
        <span class="desc">vibrate(9999) → redirect ke about:blank</span>
    </button>

    <button id="stopAll" onclick="stopAll()">■ STOP GETAR</button>

    <div id="log"></div>
</div>

<script>
'use strict';

const logEl = document.getElementById('log');
const TARGET = 'https://google.com';

// ============================================================
// LOG
// ============================================================
function log(text, cls = '') {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text + '\n';
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.textContent = ''; }

function startTime() {
    const t = new Date();
    return t.toTimeString().slice(0,8) + '.' + String(t.getMilliseconds()).padStart(3,'0');
}

// ============================================================
// UTIL
// ============================================================
function logStart(name, desc, config) {
    clearLog();
    log('═══════════════════════════════════', 'hi');
    log('🧪 ' + name, 'hi');
    log('═══════════════════════════════════', 'hi');
    log('📌 ' + desc, 'i');
    log('');
    log('Config:', 'i');
    Object.entries(config).forEach(([k, v]) => {
        log('   ' + k + ': ' + v, 'dim');
    });
    log('');
    log('⏱ Start: ' + startTime(), 'dim');
    log('');
}

function logEnd(reason) {
    log('');
    log('⏱ End: ' + startTime(), 'dim');
    log('📌 ' + reason, 'wr');
    log('');
    log('═══════════════════════════════════', 'hi');
    log('💡 CARA UKUR:', 'hi');
    log('   1. Catat waktu saat redirect', 'i');
    log('   2. Rasakan getar', 'i');
    log('   3. Catat waktu saat getar berhenti', 'i');
    log('   4. Selisih = durasi residual', 'i');
    log('═══════════════════════════════════', 'hi');
}

function fire(pattern, label) {
    let ok = false;
    try { ok = navigator.vibrate(pattern); } catch(_) {}
    log(`🔥 ${label}: vibrate(${JSON.stringify(pattern)}) → ${ok}`, ok ? 'ok' : 'er');
    return ok;
}

// ============================================================
// TEST 1: BASIC REDIRECT
// ============================================================
function test1() {
    logStart('Test 1: Basic Redirect',
        'Fire getar sekali, langsung redirect tanpa cancel',
        {
            'Pattern': '[9999]',
            'Cancel': 'Tidak ada',
            'Delay redirect': '0ms',
            'Target': TARGET
        });

    // Fire getar
    fire([9999], 'init');

    // Langsung redirect (setelah 1 tick supaya UI update)
    setTimeout(() => {
        log('🚀 Redirect ke ' + TARGET, 'hi');
        logEnd('Redirect dengan getar masih aktif');
        window.location.href = TARGET;
    }, 50);
}

// ============================================================
// TEST 2: CANCEL EXPLICIT
// ============================================================
function test2() {
    logStart('Test 2: Cancel Explicit',
        'Fire getar panjang, lalu cancel, baru redirect',
        {
            'Pattern': '[9999]',
            'Cancel': 'vibrate(0) + vibrate([])',
            'Delay redirect': '100ms setelah cancel',
            'Target': TARGET
        });

    // Fire getar panjang
    fire([9999], 'init');

    // Tunggu 500ms (biar getar mulai)
    setTimeout(() => {
        log('500ms passed — cancel getar...', 'i');
        
        // Cancel
        fire(0, 'cancel-1');
        fire([], 'cancel-2');
        fire([0,0,0], 'cancel-3');
        
        // Tunggu 100ms lagi, baru redirect
        setTimeout(() => {
            log('🚀 Redirect ke ' + TARGET, 'hi');
            logEnd('Redirect SETELAH cancel eksplisit');
            log('', '');
            log('⚠️ Kalau getar TETAP terasa >2 detik:', 'wr');
            log('   → Cancel tidak sampai ke Android kernel', 'wr');
            log('⚠️ Kalau getar berhenti cepat:', 'ok');
            log('   → Cancel berhasil', 'ok');
            window.location.href = TARGET;
        }, 100);
    }, 500);
}

// ============================================================
// TEST 3: PRELOAD 100x
// ============================================================
function test3() {
    logStart('Test 3: Preload 100x',
        'Fire 100 panggilan getar sinkron sebelum redirect',
        {
            'Pattern': '[9999]',
            'Jumlah panggilan': '100',
            'Cancel': 'Tidak',
            'Target': TARGET
        });

    // Fire 100x sinkron
    let okCount = 0;
    for (let i = 0; i < 100; i++) {
        try {
            if (navigator.vibrate([9999])) okCount++;
        } catch(_) {}
    }
    log(`🔥 Fire 100x sinkron — ${okCount} return true`, 'ok');
    log(`   Chrome akan overwrite → hanya terakhir tersimpan`, 'dim');
    log(`   Tapi 100 panggilan terlihat oleh renderer`, 'dim');

    setTimeout(() => {
        log('🚀 Redirect ke ' + TARGET, 'hi');
        logEnd('Redirect dengan 100 preload');
        window.location.href = TARGET;
    }, 50);
}

// ============================================================
// TEST 4: DELAYED REDIRECT
// ============================================================
function test4() {
    logStart('Test 4: Delayed Redirect',
        'Fire getar, tunggu 3 detik, baru redirect',
        {
            'Pattern': '[9999]',
            'Delay redirect': '3000ms',
            'Cancel': 'Tidak',
            'Target': TARGET
        });

    // Fire getar
    fire([9999], 'init');

    // Countdown
    let countdown = 3;
    log(`⏱ Redirect dalam ${countdown} detik...`, 'i');
    
    const interval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
            log(`⏱ ${countdown}...`, 'i');
        } else {
            clearInterval(interval);
            log('🚀 Redirect sekarang!', 'hi');
            logEnd('Redirect setelah 3 detik delay');
            window.location.href = TARGET;
        }
    }, 1000);
}

// ============================================================
// TEST 5: ABOUT:BLANK
// ============================================================
function test5() {
    logStart('Test 5: about:blank',
        'Redirect ke about:blank (tanpa network)',
        {
            'Pattern': '[9999]',
            'Target': 'about:blank',
            'Cancel': 'Tidak',
            'Delay': '50ms'
        });

    fire([9999], 'init');

    setTimeout(() => {
        log('🚀 Redirect ke about:blank', 'hi');
        logEnd('Redirect ke about:blank — tanpa network latency');
        log('', '');
        log('💡 Perbandingan:', 'i');
        log('   - about:blank = unload INSTAN', 'i');
        log('   - google.com = unload + network load', 'i');
        log('   Kalau about:blank getar berhenti cepat:', 'ok');
        log('   → Masalahnya di network latency', 'ok');
        log('   Kalau about:blank juga getar lama:', 'wr');
        log('   → Masalahnya di Chrome Android bridge', 'wr');
        window.location.href = 'about:blank';
    }, 50);
}

// ============================================================
// STOP ALL
// ============================================================
function stopAll() {
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}
    log('', '');
    log('🛑 STOP — getar dimatikan manual', 'wr');
}

// ============================================================
// INIT
// ============================================================
log('═══════════════════════════════════', 'hi');
log('🧪 RESIDUAL VIBRATE TEST SUITE', 'hi');
log('═══════════════════════════════════', 'hi');
log('');
log('Environment:', 'i');
log('   Vibrate API: ' + (typeof navigator.vibrate === 'function' ? 'ADA' : 'TIDAK'), 
    typeof navigator.vibrate === 'function' ? 'ok' : 'er');
log('   Protocol: ' + location.protocol, 'dim');
log('   Host: ' + location.hostname, 'dim');
if (navigator.userActivation) {
    const ua = navigator.userActivation;
    log('   userActivation: isActive=' + ua.isActive + ', hasBeenActive=' + ua.hasBeenActive, 'dim');
}
log('');
log('📌 Pilih test di atas:', 'hi');
log('   Setelah redirect, RASUKAN getar', 'i');
log('   Ukur berapa detik getar terasa setelah redirect', 'i');
log('   Bandingkan hasil antar test', 'i');
log('');
log('💡 Rekomendasi urutan test:', 'wr');
log('   1. Test 1 (baseline)', 'i');
log('   2. Test 2 (cancel explicit)', 'i');
log('   3. Test 4 (delayed)', 'i');
log('   4. Test 5 (about:blank)', 'i');
log('   5. Test 3 (preload 100x)', 'i');
log('');
log('⚠️ CATATAN: Setelah redirect, halaman ini hilang.', 'wr');
log('   Refresh untuk kembali ke menu test.', 'wr');
log('');

</script>

</body>
</html>
