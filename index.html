<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap → Getar Lama</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        cursor: pointer;
        transition: background .3s;
    }
    #zone.idle    { background: #0d0f14; }
    #zone.active  { background: #1a0f0f; }
    #zone .icon   { font-size: 64px; margin-bottom: 16px; transition: transform .3s; }
    #zone.active .icon { transform: scale(1.15); }
    #zone .title  { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    #zone .hint   { font-size: 14px; color: #8b93a1; line-height: 1.6; max-width: 300px; }
    #zone.active .hint { color: #f87171; }
    #zone .timer  {
        font-family: ui-monospace, monospace;
        font-size: 40px;
        font-weight: 700;
        color: #f87171;
        margin: 16px 0;
        min-height: 48px;
    }
</style>
</head>
<body>

<div id="zone" class="idle">
    <div class="icon">👆</div>
    <div class="title">Tap di mana saja</div>
    <div class="timer" id="timer"></div>
    <div class="hint" id="hint">
        Sekali tap → getar panjang tanpa batas.<br>
        Tap lagi untuk menghentikan.
    </div>
</div>

<script>
(() => {
'use strict';

const zone  = document.getElementById('zone');
const timer = document.getElementById('timer');
const hint  = document.getElementById('hint');

// ---- Konfigurasi ----
const CHUNK_MS   = 8000;   // < 10.000 ms (batas Chrome)
const OVERLAP_MS = 500;    // overlap agar tidak ada gap
const INTERVAL   = CHUNK_MS - OVERLAP_MS;  // 7500 ms

// ---- State ----
let active = false;
let intervalId = null;
let startTime = 0;
let tickerId = null;
let callCount = 0;

// ---- Update tampilan ----
function updateTimer() {
    if (!active) return;
    const sec = ((Date.now() - startTime) / 1000).toFixed(1);
    timer.textContent = `${sec}s`;
}

function updateHint() {
    hint.innerHTML = active
        ? `Aktif — panggilan ke-${callCount}<br>Tap di mana saja untuk HENTIKAN.`
        : `Sekali tap → getar panjang tanpa batas.<br>Tap lagi untuk menghentikan.`;
}

// ---- Vibrate wrapper ----
function vib(pattern) {
    if (typeof navigator.vibrate !== 'function') return false;
    try { return navigator.vibrate(pattern); }
    catch (_) { return false; }
}

// ---- Start ----
function start() {
    if (active) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = 'Perangkat/browser tidak mendukung Vibration API.';
        return;
    }

    active = true;
    startTime = Date.now();
    callCount = 0;

    zone.classList.remove('idle');
    zone.classList.add('active');
    zone.querySelector('.icon').textContent = '📳';

    // Chunk loop
    const fire = () => {
        if (!active) return;
        vib(CHUNK_MS);
        callCount++;
        updateHint();
    };

    fire(); // langsung panggil
    intervalId = setInterval(fire, INTERVAL);

    // Ticker untuk timer
    updateTimer();
    tickerId = setInterval(updateTimer, 100);

    updateHint();
}

// ---- Stop ----
function stop() {
    if (!active) return;
    active = false;

    clearInterval(intervalId); intervalId = null;
    clearInterval(tickerId);   tickerId = null;

    // WAJIB: matikan getar
    vib(0);

    zone.classList.remove('active');
    zone.classList.add('idle');
    zone.querySelector('.icon').textContent = '👆';

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    timer.textContent = `${elapsed}s`;
    hint.innerHTML = `Berhenti setelah ${elapsed}s (${callCount} panggilan).<br>Tap untuk mulai lagi.`;
}

// ---- Toggle on tap ----
zone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (active) stop();
    else start();
});

// ---- Safety: matikan saat tab disembunyikan atau ditutup ----
document.addEventListener('visibilitychange', () => {
    if (document.hidden && active) stop();
});
window.addEventListener('beforeunload', () => {
    if (intervalId) clearInterval(intervalId);
    if (tickerId)   clearInterval(tickerId);
    vib(0);
});
window.addEventListener('blur', () => {
    if (active) stop();
});

})();
</script>

</body>
</html>
