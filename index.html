<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Vibrate Policy Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #121214;
    color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px;
    min-height: 100vh;
  }
  h2 { margin-bottom: 16px; font-size: 18px; }
  .test-block {
    background: #1e1e24;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #2c313a;
  }
  .test-block h3 {
    font-size: 13px;
    color: #8b93a1;
    margin-bottom: 8px;
    font-family: monospace;
  }
  iframe {
    width: 100%;
    height: 160px;
    border: 1px solid #2c313a;
    border-radius: 8px;
    background: #0d0f14;
  }
  .result {
    margin-top: 8px;
    font-family: monospace;
    font-size: 11px;
    color: #00ff66;
    background: #05070a;
    padding: 8px;
    border-radius: 6px;
    white-space: pre-wrap;
    min-height: 40px;
  }
  .no-allow iframe {
    border-color: #dc2626;
  }
  .with-allow iframe {
    border-color: #16a34a;
  }
</style>
</head>
<body>

<h2>🧪 Iframe Vibrate Policy Test</h2>

<!-- Test 1: Without allow="vibrate" -->
<div class="test-block no-allow">
  <h3>Test A: iframe tanpa allow="vibrate" (cross-origin)</h3>
  <iframe id="if-noallow" 
          src="https://example.com"
          sandbox="allow-scripts allow-same-origin allow-forms">
  </iframe>
  <div class="result" id="log-a">Menunggu...</div>
</div>

<!-- Test 2: With allow="vibrate" -->
<div class="test-block with-allow">
  <h3>Test B: iframe dengan allow="vibrate" (cross-origin)</h3>
  <iframe id="if-allow" 
          src="https://example.com"
          allow="vibrate"
          sandbox="allow-scripts allow-same-origin allow-forms">
  </iframe>
  <div class="result" id="log-b">Menunggu...</div>
</div>

<!-- Test 3: Same-origin iframe via srcdoc -->
<div class="test-block with-allow">
  <h3>Test C: iframe same-origin (srcdoc) + allow="vibrate"</h3>
  <iframe id="if-same" 
          srcdoc="<html><body style='background:#0d0f14;color:#e6e8eb;font-family:monospace;padding:10px;'>
            <button id='vibBtn' style='padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:6px;'>Tap & Vibrate</button>
            <div id='log' style='margin-top:8px;font-size:10px;color:#00ff66;'>idle</div>
            <script>
              const log = document.getElementById('log');
              function tryVib(label) {
                if (typeof navigator.vibrate !== 'function') {
                  log.textContent = label + ': API tidak ada';
                  return;
                }
                const ok = navigator.vibrate([80, 40, 80]);
                log.textContent = label + ': ' + (ok ? 'OK' : 'FAIL');
              }
              // Coba sebelum gesture
              window.addEventListener('load', () => tryVib('load'));
              document.getElementById('vibBtn').addEventListener('click', () => tryVib('click'));
              setTimeout(() => tryVib('after-2s'), 2000);
            <\/script>
          <\/body><\/html>"
          allow="vibrate">
  </iframe>
  <div class="result" id="log-c">Menunggu...</div>
</div>

<script>
// Test A: Tanpa allow="vibrate"
// Kita tidak bisa inject script ke cross-origin iframe, jadi kita hanya
// bisa memantau apakah iframe memuat dan console error terkait vibrate.
// Untuk tujuan demonstrasi, kita buat iframe srcdoc sebagai pengganti.

const ifA = document.getElementById('if-noallow');
const ifB = document.getElementById('if-allow');
const ifC = document.getElementById('if-same');
const logA = document.getElementById('log-a');
const logB = document.getElementById('log-b');
const logC = document.getElementById('log-c');

// Ganti Test A dengan srcdoc (same-origin simulation tanpa allow)
ifA.srcdoc = `<html><body style="background:#0d0f14;color:#e6e8eb;font-family:monospace;padding:10px;">
<button id="vibBtn" style="padding:8px 16px;background:#dc2626;color:white;border:none;border-radius:6px;">Tap (no allow)</button>
<div id="log" style="margin-top:8px;font-size:10px;color:#00ff66;">idle</div>
<script>
const log = document.getElementById('log');
function tryVib(label) {
  if (typeof navigator.vibrate !== 'function') {
    log.textContent = label + ': API tidak ada';
    return;
  }
  const ok = navigator.vibrate([80, 40, 80]);
  log.textContent = label + ': ' + (ok ? 'OK' : 'FAIL');
  parent.postMessage({test:'A', label, ok}, '*');
}
window.addEventListener('load', () => tryVib('load'));
document.getElementById('vibBtn').addEventListener('click', () => tryVib('click'));
setTimeout(() => tryVib('after-2s'), 2000);
<\/script></body></html>`;

// Test B: Dengan allow="vibrate"
ifB.srcdoc = `<html><body style="background:#0d0f14;color:#e6e8eb;font-family:monospace;padding:10px;">
<button id="vibBtn" style="padding:8px 16px;background:#16a34a;color:white;border:none;border-radius:6px;">Tap (allow)</button>
<div id="log" style="margin-top:8px;font-size:10px;color:#00ff66;">idle</div>
<script>
const log = document.getElementById('log');
function tryVib(label) {
  if (typeof navigator.vibrate !== 'function') {
    log.textContent = label + ': API tidak ada';
    return;
  }
  const ok = navigator.vibrate([80, 40, 80]);
  log.textContent = label + ': ' + (ok ? 'OK' : 'FAIL');
  parent.postMessage({test:'B', label, ok}, '*');
}
window.addEventListener('load', () => tryVib('load'));
document.getElementById('vibBtn').addEventListener('click', () => tryVib('click'));
setTimeout(() => tryVib('after-2s'), 2000);
<\/script></body></html>`;

// Kumpulkan hasil dari iframe
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.test) return;
  const logEl = d.test === 'A' ? logA : (d.test === 'B' ? logB : logC);
  const line = `[${d.label}] vibrate=${d.ok ? 'OK' : 'FAIL'}\n`;
  logEl.textContent += line;
  console.log(`Test ${d.test}:`, d);
});

// Untuk Test C, kita tidak bisa akses langsung, jadi hanya info umum
logC.textContent = 'Lihat hasil di dalam iframe di atas.\nPerhatikan perilaku load vs click.';

// Info umum tentang cross-origin restriction
console.log(`Cross-origin iframe vibrate policy:
- Default: BLOCKED
- With allow="vibrate": allowed AFTER user gesture
- Same-origin: typically allowed after gesture, may vary by Chrome version`);
</script>

</body>
</html>
