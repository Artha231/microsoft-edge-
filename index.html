```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Interaction Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            background: #fff;
            font-family: Arial, sans-serif;
        }

        #popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 24px;
        }

        .dialog {
            width: 100%;
            max-width: 340px;
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 32px #0002;
            text-align: center;
        }

        .dialog h3 {
            margin-bottom: 12px;
        }

        .dialog p {
            margin-bottom: 20px;
            line-height: 1.5;
            color: #555;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #222;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="popup" role="dialog"
         aria-modal="true"
         aria-labelledby="popupTitle">
        <div class="dialog">
            <h3 id="popupTitle">Pengujian Gestur</h3>
            <p id="popupMessage">
                Aktivitas pointer terdeteksi.
                Ini adalah demonstrasi interaksi.
            </p>
            <button id="closePopup">Tutup</button>
        </div>
    </div>

    <script>
        const popup = document.getElementById("popup");
        const message = document.getElementById("popupMessage");
        const closePopup = document.getElementById("closePopup");

        let popupShown = false;

        function showPopup(source) {
            if (popupShown) return;

            popupShown = true;
            message.textContent =
                "Event " + source +
                " terdeteksi. Ini adalah pengujian interaksi gestur.";

            popup.style.display = "flex";
        }

        window.addEventListener("pointermove", (event) => {
            if (event.pointerType === "touch") {
                showPopup("pointermove");
            }
        }, { passive: true });

        window.addEventListener("scroll", () => {
            showPopup("scroll");
        }, { passive: true });

        closePopup.addEventListener("click", () => {
            popup.style.display = "none";
        });
    </script>

</body>
</html>
```
