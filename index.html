<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengujian Unduhan Multi-Berkas</title>
  <style>
    body { font-family: sans-serif; display: grid; place-items: center; height: 100vh; background: #0f172a; color: #fff; }
    .btn { padding: 12px 24px; background: #0284c7; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <button id="downloadBtn" class="btn">Unduh Semua Berkas (3 File)</button>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', () => {
      // Daftar berkas simulasi yang akan diunduh
      const daftarBerkas = [
        { nama: "dokumen_1.txt", isi: "Isi berkas pertama" },
        { nama: "dokumen_2.txt", isi: "Isi berkas kedua" },
        { nama: "dokumen_3.txt", isi: "Isi berkas ketiga" }
      ];

      daftarBerkas.forEach((berkas, index) => {
        // Memberikan sedikit jeda waktu (delay) agar antrean proses di peramban lebih stabil
        setTimeout(() => {
          const blob = new Blob([berkas.isi], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = berkas.nama;
          
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          
          // Mengosongkan memori URL Blob setelah digunakan
          URL.revokeObjectURL(a.href);
        }, index * 200); // Jeda 200 milidetik antar berkas
      });
    });
  </script>
</body>
</html>
