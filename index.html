
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture & Vibration Analyzer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 150vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #popup {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgb(0 0 0 / 55%);
    }

    .popup-content {
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 16px;
      background: white;
      text-align: center;
    }

    .popup-content h3 {
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Gesture & Vibration Analyzer</h2>

    <p>
      Geser halaman ke atas atau ke bawah untuk menampilkan
      notifikasi pengujian.
    </p>

    <div id="status" role="status" aria-live="polite">
      Status: menunggu gesture
    </div>
  </main>

  <div id="popup" role="dialog"
       aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-content">
      <h3 id="popupTitle">Pengujian Getaran</h3>

      <p>
        Gerakan geser terdeteksi. Tekan tombol untuk menguji
        dukungan getaran perangkat.
      </p>

      <button id="closePopup">Tutup & Uji Getaran</button>
    </div>
  </div>

  <script>
    const popup = document.getElementById("popup");
    const closePopup = document.getElementById("closePopup");
    const status = document.getElementById("status");

    let popupShown = false;

    function showPopup() {
      if (popupShown) return;

      popupShown = true;
      popup.style.display = "flex";
      status.textContent = "Status: gesture terdeteksi";
    }

    // Tampilkan popup saat halaman benar-benar digulir.
    window.addEventListener("scroll", showPopup, {
      once: true,
      passive: true
    });

    // Deteksi gerakan jari pada perangkat layar sentuh.
    window.addEventListener("touchmove", showPopup, {
      once: true,
      passive: true
    });

    closePopup.addEventListener("click", () => {
      popup.style.display = "none";

      if (typeof navigator.vibrate !== "function") {
        status.textContent =
          "Browser atau perangkat tidak mendukung Vibration API.";
        return;
      }

      try {
        // Bersihkan permintaan getaran sebelumnya.
        navigator.vibrate(0);

        // Minta satu getaran berdurasi 10 detik.
        const success = navigator.vibrate(99999999999999999999999999999999999999); // 10 detik (tidak pernah berhenti)

        status.textContent = success
          ? "Status: permintaan getaran dikirim."
          : "Permintaan getaran tidak diterima browser.";
      } catch (error) {
        status.textContent =
          "Pengujian gagal: " + error.message;
      }
    });
  </script>
</body>
</html>
