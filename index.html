<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zero-Click Intent (Direct)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
.panel { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 100%; border: 1px solid #333; }
h1 { font-size: 28px; color: #ff4444; margin-bottom: 15px; text-shadow: 0 0 10px #ff4444; }
p { font-size: 15px; color: #aaa; margin-bottom: 25px; line-height: 1.6; }
#status { margin-top: 20px; font-weight: bold; color: #ff9800; font-size: 14px; font-family: monospace; background: #111; padding: 10px; border-radius: 6px; }
.log { background: #000; color: #0f0; padding: 10px; border-radius: 6px; font-family: monospace; text-align: left; margin-top: 15px; height: 150px; overflow-y: auto; font-size: 12px; }
</style>
</head>

<body>
<div class="panel" id="main-panel">
    <h1>Zero-Click Intent (Direct)</h1>
    <p>Mengarahkan Anda ke profil Instagram secara otomatis saat halaman dimuat.</p>
    
    <div id="status" role="status">Memuat halaman...</div>
    <div class="log" id="log">Log akan muncul di sini...</div>
</div>

<script>
    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");

    function log(msg) {
        logDiv.innerHTML += "<br>> " + msg;
        console.log(msg);
    }

    // FUNGSI ZERO-CLICK: Langsung eksekusi saat DOM siap
    window.addEventListener("DOMContentLoaded", () => {
        statusDiv.textContent = "Memicu Intent Instagram...";
        
        try {
            // URL Intent Spoofing (Mengarah ke profil Instagram)
            // Ganti 'theonly_w4gur1' dengan username target
            const instagramIntent = "intent://instagram.com/_u/theonly_w4gur1/#Intent;scheme=https;package=com.instagram.android;category=android.intent.category.BROWSABLE;end";
            
            log("Memicu Intent: " + instagramIntent);
            
            // Eksekusi navigasi secara instan
            window.location.href = instagramIntent;
            
            statusDiv.textContent = "Intent dipicu. Cek apakah Instagram terbuka.";
            statusDiv.style.color = "#4CAF50";
        } catch (e) {
            log("Gagal memicu Intent: " + e.message);
            statusDiv.textContent = "Gagal: " + e.message;
            statusDiv.style.color = "#f00";
        }
    });
</script>
</body>
</html>
