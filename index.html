<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>vibrate(9999) Loop</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        cursor: pointer;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; cursor: default; }

    .icon {
        font-size: 100px;
        margin-bottom: 14px;
    }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-20deg) scale(1.35); }
        50%  { transform: rotate(20deg) scale(1.45); }
        100% { transform: rotate(-20deg) scale(1.35); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        letter-spacing: 2px;
        text-shadow: 0 0 35px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone:not(.active) .timer { color: #333; text-shadow: none; }

    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 22, 28, 0.94);
        border: 1px solid #2c313a;
        border-radius: 6px;
        padding: 6px 4px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; }
    .stat .l { font-size: 8px; color: #8b93a1; text-transform: uppercase; margin-top: 2px; }
    .stat.hi .v { color: #ff2020; }
    .stat.ok .v { color: #2ecc71; }
    .stat.wr .v { color: #f1c40f; }
    .stat.cy .v { color: #00ffff; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        box-shadow: 0 0 25px #ff0000;
    }
    #stopBtn.on { display: block; }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi"> <div class="v" id="s-calls">0</div>     <div class="l">Calls</div></div>
    <div class="stat ok"> <div class="v" id="s-ok">0</div>        <div class="l">OK</div></div>
    <div class="stat wr"> <div class="v" id="s-req">0</div>       <div class="l">Req (s)</div></div>
    <div class="stat cy"> <div class="v" id="s-elapsed">0</div>   <div class="l">Elapsed</div></div>
</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">KLIK UNTUK MULAI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Setiap 500ms panggil <b>vibrate(9999)</b>.<br>
        Kalau menumpuk, harusnya getar makin lama.
    </div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>

<script>
(() => {
'use strict';

// ============================================================
// KONFIGURASI
// ============================================================
const INTERVAL_MS = 500;    // panggil tiap 500ms
const DURATION_MS = 9999;   // durasi tiap panggilan (maks sebelum truncate)

// ============================================================
// DOM
// ============================================================
const zone     = document.getElementById('zone');
const icon     = document.getElementById('icon');
const title    = document.getElementById('title');
const timer    = document.getElementById('timer');
const hint     = document.getElementById('hint');
const stopBtn  = document.getElementById('stopBtn');
const sCalls   = document.getElementById('s-calls');
const sOk      = document.getElementById('s-ok');
const sReq     = document.getElementById('s-req');
const sElapsed = document.getElementById('s-elapsed');

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let intervalId = null;
let uiTimer = null;
let calls = 0;
let oks = 0;

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    if (typeof navigator.vibrate !== 'function') {
        hint.textContent = '❌ Browser tidak mendukung getaran.';
        return;
    }

    running = true;
    startTime = Date.now();
    calls = 0;
    oks = 0;

    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'vibrate(9999) LOOP';
    hint.innerHTML = `Setiap <b>${INTERVAL_MS}ms</b> panggil <b>vibrate(${DURATION_MS})</b>.<br>Amati getar fisik — apakah makin lama?`;
    stopBtn.classList.add('on');

    // Panggil pertama
    fire();

    // Loop
    intervalId = setInterval(fire, INTERVAL_MS);

    // Update UI
    uiTimer = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        timer.textContent = elapsed.toFixed(1) + 's';
        sElapsed.textContent = elapsed.toFixed(0);
    }, 100);
}

// ============================================================
// FIRE
// ============================================================
function fire() {
    if (!running) return;
    calls++;
    const ok = navigator.vibrate(DURATION_MS);
    if (ok) oks++;

    sCalls.textContent = calls;
    sOk.textContent = oks;
    sReq.textContent = Math.round((calls * DURATION_MS) / 1000);
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;

    clearInterval(intervalId);
    clearInterval(uiTimer);
    intervalId = null;
    uiTimer = null;

    // Matikan getar
    navigator.vibrate(0);
    navigator.vibrate([]);

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'KLIK UNTUK MULAI';
    stopBtn.classList.remove('on');

    const elapsed = (Date.now() - startTime) / 1000;
    const requested = (calls * DURATION_MS) / 1000;
    const ratio = requested / elapsed;

    timer.textContent = elapsed.toFixed(1) + 's';
    hint.innerHTML = `Selesai: ${elapsed.toFixed(1)}s nyata.<br>Diminta: ${requested.toFixed(0)}s. Rasio: ${ratio.toFixed(0)}x.`;

    sElapsed.textContent = elapsed.toFixed(0);
    sReq.textContent = Math.round(requested);

    // Log hasil
    console.log('═══════════════════════════════════');
    console.log('📊 HASIL TEST vibrate(9999) LOOP');
    console.log('═══════════════════════════════════');
    console.log('Durasi nyata    :', elapsed.toFixed(1), 's');
    console.log('Total calls     :', calls);
    console.log('Calls OK        :', oks);
    console.log('Total diminta   :', requested.toFixed(0), 's');
    console.log('Rasio           :', ratio.toFixed(1), 'x');
    console.log('');
    if (ratio > 5) {
        console.log('✅ BUKTI: Browser OVERWRITE, tidak queue');
        console.log('   Getar fisik hanya ~' + elapsed.toFixed(0) + 's');
        console.log('   Meskipun total diminta ' + requested.toFixed(0) + 's');
    } else {
        console.log('⚠ Rasio rendah — mungkin getar tidak sempat overwrite');
    }
}

// ============================================================
// EVENTS
// ============================================================
zone.addEventListener('click', () => {
    if (!running) start();
});

stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});

window.addEventListener('beforeunload', () => {
    if (intervalId) clearInterval(intervalId);
    if (uiTimer) clearInterval(uiTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

// ============================================================
// INIT
// ============================================================
if (typeof navigator.vibrate !== 'function') {
    hint.textContent = '❌ navigator.vibrate tidak didukung.';
    title.textContent = 'TIDAK DIDUKUNG';
}

})();
</script>

</body>
</html>
