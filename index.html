<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Valid MIME Sniffing Browser</title>
</head>
<body>
    <h2>Uji Celah Keamanan MIME Sniffing</h2>
    <p>Jika Anda mengeklik tombol di bawah dan tab baru terbuka langsung mengeksekusi alert XSS, maka browser mengalami Mime Sniffing Vulnerability.</p>
    
    <button id="test-btn">Buka Blob text/plain di Tab Baru</button>

    <script>
        document.getElementById("test-btn").addEventListener("click", () => {
            // 1. Definisikan kode HTML/JS di dalam string teks biasa
            const payloadText = "<!DOCTYPE html><html><body><script>alert('VALID BUG: Browser merender text/plain sebagai HTML!');<\/script></body></html>";
            
            // 2. Buat Blob MURNI dengan type text/plain
            const blob = new Blob([payloadText], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            
            // 3. Buka URL Blob tersebut langsung di tab baru (Bukan diunduh)
            window.open(url, "_blank");
        });
    </script>
</body>
</html>
