```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-Click Fullscreen Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font: 16px Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fullscreen PoC</h1>
    <p id="status">Mencoba fullscreen otomatis...</p>
  </main>

  <script>
    window.addEventListener("load", async () => {
      const status = document.getElementById("status");

      try {
        await document.documentElement.requestFullscreen();
        status.textContent = "Fullscreen berhasil.";
      } catch (error) {
        status.textContent =
          `Browser menolak fullscreen otomatis (${error.name}).`;
        console.info("Fullscreen ditolak:", error);
      }
    });
  </script>
</body>
</html>
