<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar + Redirect Google</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .1s;
    }
    #zone.active { background: #2a0000; animation: bgPulse .15s infinite alternate; }
    @keyframes bgPulse {
        from { background: #2a0000; }
        to   { background: #4a0000; }
    }

    .icon { font-size: 110px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .04s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-25deg) scale(1.4); }
        50%  { transform: rotate(25deg) scale(1.5); }
        100% { transform: rotate(-25deg) scale(1.4); }
    }

    .title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; text-shadow: 0 0 25px #ff0000; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 60px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 68px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 35px #ff0000;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .hint { color: #ff6060; }

    #gestureDot {
        position: fixed;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 32, 32, 0.4);
        pointer-events: none;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity .1s;
        z-index: 50;
        box-shadow: 0 0 25px #ff2020;
    }
    #gestureDot.on { opacity: 1; }

    /* Console overlay untuk lihat log di HP */
    #console {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        max-height: 30vh;
        overflow-y: auto;
        background: rgba(5, 7, 10, 0.95);
        border: 1px solid #2c313a;
        border-radius: 8px;
        padding: 8px 10px;
        font-family: ui-monospace, monospace;
        font-size: 9.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        z-index: 100;
    }
    #console .i  { color: #79c0ff; }
    #console .ok { color: #3fb950; }
    #console .wr { color: #d29922; }
    #console .er { color: #f85149; }
    #console .hi { color: #d2a8ff; font-weight: 700; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        z-index: 10;
    }
    #stopBtn.on { display: block; }
</style>
</head>
<body>

<div id="console">Memuat...</div>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Geser jari = getar + redirect Google.<br>
        Getar akan tetap terasa setelah redirect.
    </div>
</div>

<div id="gestureDot"></div>
<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');
const gestureDot = document.getElementById('gestureDot');
const consoleEl = document.getElementById('console');

// ============================================================
// KONFIG
// ============================================================
const TARGET      = 'https://google.com';
const CHUNK       = 9999;
const REDIRECT_MS = 500;   // delay sebelum redirect (ms)
const PRELOAD     = 100;   // preload getar

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 50;
function log(text, cls = '') {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text + '\n';
    consoleEl.appendChild(span);
    while (consoleEl.children.length > MAX_LOG) consoleEl.removeChild(consoleEl.firstChild);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let calls = 0;
let okCount = 0;
let vibTimer = null;
let uiTimer = null;
let triggered = false;

// ============================================================
// FIRE VIBRATE
// ============================================================
function fire(label) {
    if (!running) return;
    let ok = false;
    try {
        ok = navigator.vibrate(CHUNK);
    } catch(e) { ok = false; }
    calls++;
    if (ok) okCount++;
    if (label && calls <= 5) {
        log(`   ${label}: vibrate(${CHUNK}) → ${ok}`, ok ? 'ok' : 'er');
    }
    return ok;
}

// ============================================================
// START
// ============================================================
function start() {
    if (running) return;
    running = true;
    startTime = performance.now();
    calls = 0;
    okCount = 0;

    consoleEl.textContent = '';
    log('═══════════════════════════════════', 'hi');
    log('▶ START — Getar + Redirect Google', 'hi');
    log('═══════════════════════════════════', 'hi');
    log('', '');
    log('Environment:', 'i');
    log(`   Protocol: ${location.protocol}`, 'i');
    log(`   Vibrate API: ${typeof navigator.vibrate === 'function' ? 'ADA' : 'TIDAK'}`, 
        typeof navigator.vibrate === 'function' ? 'ok' : 'er');
    if (navigator.userActivation) {
        const ua = navigator.userActivation;
        log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
    }
    log('', '');
    log(`📌 Target: ${TARGET}`, 'i');
    log(`📌 Delay: ${REDIRECT_MS}ms`, 'i');
    log(`📌 Chunk: ${CHUNK}ms`, 'i');
    log('', '');

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.innerHTML = `Getar + redirect ke <b>Google</b><br>dalam <b>${REDIRECT_MS}ms</b>...`;
    stopBtn.classList.add('on');

    // ============================================================
    // 1. FIRE LANGSUNG (sinkron)
    // ============================================================
    log('1️⃣ Fire langsung...', 'i');
    fire('init-1');
    fire('init-2');
    fire('init-3');

    // ============================================================
    // 2. LOOP INTERVAL
    // ============================================================
    log('2️⃣ Loop interval 50ms...', 'i');
    vibTimer = setInterval(() => fire('loop'), 50);

    // ============================================================
    // 3. ASYNC PRELOAD
    // ============================================================
    log(`3️⃣ Preload ${PRELOAD} calls...`, 'i');
    let n = 0;
    function preload() {
        if (!running || n >= PRELOAD) return;
        n++;
        fire('preload');
        setTimeout(preload, 0);
    }
    preload();

    // ============================================================
    // 4. TIMER UI
    // ============================================================
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timer.textContent = elapsed.toFixed(1) + 's';
    }, 50);

    // ============================================================
    // 5. REDIRECT SETELAH 500ms
    // ============================================================
    setTimeout(() => {
        if (!running) return;
        
        log('', '');
        log('═══════════════════════════════════', 'hi');
        log('5️⃣ REDIRECT', 'hi');
        log('═══════════════════════════════════', 'hi');
        log(`   Total calls: ${calls} | OK: ${okCount}`, 'i');
        log(`   userActivation:`, 'i');
        if (navigator.userActivation) {
            const ua = navigator.userActivation;
            log(`     isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
        }
        log('', '');
        log('🚀 Redirect ke ' + TARGET, 'hi');
        log('⚠ TIDAK cancel vibrate', 'wr');
        log('⚠ Biarkan Android selesaikan antreannya', 'wr');
        log('', '');
        log('📌 Setelah Google load:', 'i');
        log('   - Amati apakah getar masih terasa', 'i');
        log('   - Getar residual 500-800ms = normal', 'i');
        log('   - Getar >2 detik = kemungkinan HP bagus', 'i');

        hint.innerHTML = '🚀 REDIRECTING...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECT';

        // Fire ekstra sebelum redirect
        for (let i = 0; i < 20; i++) {
            try { navigator.vibrate(CHUNK); } catch(_) {}
        }

        // Redirect
        try {
            window.location.href = TARGET;
        } catch(e) {
            log('❌ Redirect gagal: ' + e.message, 'er');
            try { window.location.assign(TARGET); } catch(_) {}
        }

    }, REDIRECT_MS);
}

// ============================================================
// STOP
// ============================================================
function stop() {
    if (!running) return;
    running = false;
    clearInterval(vibTimer);
    clearInterval(uiTimer);
    vibTimer = null;
    uiTimer = null;
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}
    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Geser jari = getar + redirect Google.<br>Getar akan tetap terasa setelah redirect.';
    stopBtn.classList.remove('on');
    log('⏹ STOPPED', 'wr');
}

// ============================================================
// GESTURE — SWIPE
// ============================================================
zone.addEventListener('touchstart', (e) => {
    if (running) return;
    const t = e.touches[0];
    if (t) {
        gestureDot.style.left = t.clientX + 'px';
        gestureDot.style.top = t.clientY + 'px';
        gestureDot.classList.add('on');
    }
}, { passive: false });

zone.addEventListener('touchmove', (e) => {
    if (running) return;
    const t = e.touches[0];
    if (t) {
        gestureDot.style.left = t.clientX + 'px';
        gestureDot.style.top = t.clientY + 'px';
    }
    if (!triggered) {
        triggered = true;
        e.preventDefault();
        gestureDot.classList.remove('on');
        start();
    }
}, { passive: false });

zone.addEventListener('touchend', () => {
    gestureDot.classList.remove('on');
    triggered = false;
}, { passive: true });

zone.addEventListener('touchcancel', () => {
    gestureDot.classList.remove('on');
    triggered = false;
}, { passive: true });

// Mouse fallback
zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    gestureDot.classList.remove('on');
    start();
});

zone.addEventListener('mouseup', () => { triggered = false; });

// ============================================================
// STOP BUTTON
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    clearInterval(vibTimer);
    clearInterval(uiTimer);
    // ⚠ SENGAJA TIDAK cancel vibrate
});

// ============================================================
// INIT
// ============================================================
if (!('vibrate' in navigator)) {
    log('❌ navigator.vibrate tidak tersedia', 'er');
    hint.textContent = '❌ Browser tidak mendukung getaran.';
    title.textContent = 'TIDAK DIDUKUNG';
} else {
    log('✅ navigator.vibrate tersedia', 'ok');
    log('📌 Geser jari untuk mulai', 'i');
    log('', '');
    log('Script akan:', 'hi');
    log('  1. Fire getar 100+ kali', 'i');
    log('  2. Redirect ke Google setelah 500ms', 'i');
    log('  3. Biarkan Android selesaikan antrean', 'i');
    log('  4. Getar residual terasa ~500-800ms di Google', 'wr');
}

})();
</script>

</body>
</html>
