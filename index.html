```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Gesture & Vibration Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: white;
            color: black;
            padding: 20px;
        }

        h3, p {
            text-align: center;
            margin-bottom: 12px;
        }

        .touch-zone {
            width: 100%;
            max-width: 400px;
            height: 200px;
            margin: 20px auto;
            border: 2px dashed #aaa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #555;
            touch-action: pan-y;
        }

        #log-output {
            width: 100%;
            max-width: 400px;
            height: 200px;
            margin: auto;
            padding: 12px;
            overflow-y: auto;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font: 13px monospace;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .spacer {
            height: 1000px;
            padding-top: 30px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>
    <h3>Gesture & Vibration Analyzer</h3>

    <p style="font-size:14px;color:#666">
        Gerakkan jari di area pengujian atau gulir halaman.
    </p>

    <div id="touchZone" class="touch-zone">
        GERAKKAN JARI DI SINI
    </div>

    <div id="log-output" aria-live="polite">
Menunggu pointermove atau scroll...
    </div>

    <div class="spacer">
        Gulir halaman untuk menguji event scroll.
    </div>

<script>
    const touchZone = document.getElementById("touchZone");
    const logOutput = document.getElementById("log-output");

    let lastVibration = 0;
    let lastMoveLog = 0;

    function addLog(message) {
        const line = document.createElement("div");
        line.textContent = "> " + message;
        logOutput.appendChild(line);

        // Batasi jumlah baris log.
        while (logOutput.children.length > 50) {
            logOutput.removeChild(logOutput.firstChild);
        }

        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function tryVibration(source) {
        const now = Date.now();

        // Batasi percobaan maksimal sekali setiap 2 detik.
        if (now - lastVibration < 2000) return;

        lastVibration = now;

        if (typeof navigator.vibrate !== "function") {
            addLog(source + ": Vibration API tidak didukung.");
            return;
        }

        const result = navigator.vibrate(150);

        addLog(
            source + ": " +
            (result
                ? "Permintaan getaran dikirim."
                : "Permintaan getaran ditolak.")
        );
    }

    touchZone.addEventListener("pointermove", (event) => {
        const now = Date.now();

        // Hindari menulis log pada setiap frame gerakan.
        if (now - lastMoveLog > 500) {
            lastMoveLog = now;
            addLog("pointermove terdeteksi: " + event.pointerType);
        }

        tryVibration("pointermove");
    });

    window.addEventListener("scroll", () => {
        addLog("Event scroll terdeteksi.");
        tryVibration("scroll");
    }, { passive: true });
</script>
</body>
</html>
