<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Getar + Redirect</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: #0d0f14;
        color: #fff;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
        touch-action: none;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: #0d0f14;
        transition: background .15s;
    }
    #zone.active { background: #2a0000; }

    .icon { font-size: 100px; margin-bottom: 16px; }
    #zone.active .icon { animation: shake .06s infinite; }
    @keyframes shake {
        0%   { transform: rotate(-15deg) scale(1.3); }
        50%  { transform: rotate(15deg) scale(1.4); }
        100% { transform: rotate(-15deg) scale(1.3); }
    }

    .title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 10px;
    }
    #zone.active .title { color: #ff2020; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 56px;
        font-weight: 900;
        color: #ff2020;
        margin: 16px 0;
        min-height: 64px;
        font-variant-numeric: tabular-nums;
    }

    .hint {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 300px;
    }
    #zone.active .hint { color: #ff6060; }

    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
    }
    #stopBtn.on { display: block; }
</style>
</head>
<body>

<div id="zone">
    <div class="icon" id="icon">👆</div>
    <div class="title" id="title">GESER JARI</div>
    <div class="timer" id="timer">0.0s</div>
    <div class="hint" id="hint">
        Swipe = fullscreen + getar + redirect.<br>
        Jari boleh dilepas.
    </div>
</div>

<button id="stopBtn">■ STOP</button>

<script>
(() => {
'use strict';

const zone    = document.getElementById('zone');
const icon    = document.getElementById('icon');
const title   = document.getElementById('title');
const timer   = document.getElementById('timer');
const hint    = document.getElementById('hint');
const stopBtn = document.getElementById('stopBtn');

// ============================================================
// KONFIG — ubah di sini
// ============================================================
const DELAY  = 9000;                      // getar sebelum redirect (ms)
const CHUNK  = 999999999999999999999999999999999999999999999;                      // durasi tiap getar
const TARGET = 'https://google.com';      // URL tujuan

// ============================================================
// STATE
// ============================================================
let running = false;
let startTime = 0;
let vibTimers = [];
let uiTimer = null;
let redirectTimer = null;
let triggered = false;


async function start() {
    if (running) return;
    running = true;
    startTime = performance.now();

    // Fullscreen
    try {
        await document.documentElement.requestFullscreen();
    } catch(_) {}

    // UI
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = 'GETAR AKTIF';
    hint.innerHTML = `Getar ${(DELAY/9000).toFixed(1)}s → redirect ke<br><b>${TARGET}</b>`;
    stopBtn.classList.add('on');

    // Fire getar pertama
    vibrate();

    // Multi-layer loop
    vibTimers.push(setInterval(vibrate, 1500));
    vibTimers.push(setInterval(vibrate, 2500));

    // Update timer
    uiTimer = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        const remaining = Math.max(0, (DELAY - (performance.now() - startTime)) / 1000);
        timer.textContent = elapsed.toFixed(1) + 's';
        if (remaining > 0) {
            hint.innerHTML = `Redirect dalam <b>${remaining.toFixed(1)}s</b>`;
        }
    }, 100);

    // Redirect
    redirectTimer = setTimeout(() => {
        hint.innerHTML = '🚀 Redirect...';
        icon.textContent = '🚀';
        title.textContent = 'REDIRECTING';
        window.location.href = TARGET;
    }, DELAY);
}

function vibrate() {
    if (!running) return;
    try {
        navigator.vibrate([CHUNK, 10, CHUNK, 10, CHUNK]);
    } catch(_) {}
}


function stop() {
    if (!running) return;
    running = false;

    vibTimers.forEach(id => clearInterval(id));
    vibTimers = [];
    clearInterval(uiTimer);
    clearTimeout(redirectTimer);

    try {
        navigator.vibrate(0);
        navigator.vibrate([]);
    } catch(_) {}

    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }

    zone.classList.remove('active');
    icon.textContent = '👆';
    title.textContent = 'GESER JARI';
    timer.textContent = '0.0s';
    hint.innerHTML = 'Swipe = fullscreen + getar + redirect.<br>Jari boleh dilepas.';
    stopBtn.classList.remove('on');
}


zone.addEventListener('touchmove', (e) => {
    if (running || triggered) return;
    triggered = true;
    e.preventDefault();
    start();
}, { passive: false });

zone.addEventListener('touchend', () => {
    triggered = false;
}, { passive: true });

// Mouse fallback (desktop)
zone.addEventListener('mousemove', (e) => {
    if (running || triggered) return;
    if (e.buttons === 0) return;
    triggered = true;
    start();
});

zone.addEventListener('mouseup', () => {
    triggered = false;
});


stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stop();
});
stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    stop();
}, { passive: false });


document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
});


window.addEventListener('beforeunload', () => {
    vibTimers.forEach(id => clearInterval(id));
    clearInterval(uiTimer);
    clearTimeout(redirectTimer);
    try { navigator.vibrate(0); } catch(_) {}
});

})();
</script>

</body>
</html>
