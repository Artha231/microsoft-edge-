<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Autoplay Tanpa Gesture</title>
</head>
<body>

    <h1>Pemutar Suara Otomatis</h1>
    <p>Status: <span id="status">Memeriksa...</span></p>

    <!-- Siapkan file audio yang ingin diputar -->
    <audio id="audioKu" src="notifikasi.mp3" loop></audio>

    <script>
        const audio = document.getElementById('audioKu');
        const statusText = document.getElementById('status');

        function cobaPutarOtomatis() {
            // Memaksa audio berputar langsung saat skrip dimuat
            audio.play()
                .then(() => {
                    // Jika berhasil (Berkat flags command-line atau MEI tinggi)
                    statusText.innerText = "SUKSES! Audio berputar instan tanpa interaksi manusia.";
                    statusText.style.color = "green";
                })
                .catch((error) => {
                    // Jika gagal karena diblokir oleh browser normal
                    statusText.innerText = "GAGAL: Diblokir oleh Autoplay Policy browser.";
                    statusText.style.color = "red";
                    console.log("Detail Error:", error.message);
                });
        }

        // Jalankan fungsi langsung saat halaman terbuka
        window.addEventListener('DOMContentLoaded', cobaPutarOtomatis);
    </script>

</body>
</html>
