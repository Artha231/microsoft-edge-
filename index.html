<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLICK & FORGET — Vibrate Forever</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        transition: background .15s;
    }
    #zone.idle {
        background: #000;
        cursor: pointer;
    }
    #zone.active {
        background: radial-gradient(circle at center, #5a0000 0%, #000 100%);
    }

    .icon {
        font-size: 110px;
        margin-bottom: 12px;
        filter: drop-shadow(0 0 25px #ff0000);
        transition: transform .1s;
    }
    #zone.active .icon {
        animation: megaShake .06s infinite;
    }
    @keyframes megaShake {
        0%   { transform: rotate(-22deg) scale(1.4); }
        25%  { transform: rotate(0deg) scale(1.55); }
        50%  { transform: rotate(22deg) scale(1.4); }
        75%  { transform: rotate(0deg) scale(1.55); }
        100% { transform: rotate(-22deg) scale(1.4); }
    }

    .title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 6px;
    }
    #zone.idle .title { color: #e6e8eb; }
    #zone.active .title {
        color: #ff2020;
        text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
        animation: flicker .12s infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.82; }
    }

    .subtitle {
        font-size: 14px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .subtitle { color: #ff7070; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 64px;
        font-weight: 900;
        color: #ff2020;
        margin: 14px 0;
        min-height: 72px;
        letter-spacing: 3px;
        text-shadow: 0 0 40px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone.idle .timer { color: #333; text-shadow: none; }

    /* Tombol STOP (hanya muncul saat aktif) */
    #stopBtn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        max-width: calc(100% - 40px);
        padding: 18px;
        background: #dc2626;
        color: white;
        border: 3px solid #ff4040;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        cursor: pointer;
        display: none;
        z-index: 10;
        box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000 inset;
        animation: btnPulse .6s infinite alternate;
    }
    #stopBtn.on { display: block; }
    @keyframes btnPulse {
        from { box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000 inset; }
        to   { box-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000 inset; }
    }
    #stopBtn:active { transform: translateX(-50%) scale(0.96); }

    /* Stats */
    .stats {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 0, 0, 0.92);
        border: 1px solid #4a0000;
        border-radius: 5px;
        padding: 4px 2px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; }
    .stat .l { color: #8b93a1; text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; font-size: 8px; }
    .stat.hi  .v { color: #ff2020; }
    .stat.ok  .v { color: #2ecc71; }
    .stat.err .v { color: #e74c3c; }
    .stat.warn .v { color: #f1c40f; }
    .stat.cy  .v { color: #00ffff; }

    /* Layer indicators */
    .layers {
        position: fixed;
        top: 58px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        z-index: 5;
    }
    .layer {
        background: rgba(20, 0, 0, 0.92);
        border: 1px solid #4a0000;
        border-radius: 4px;
        padding: 3px;
        text-align: center;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        color: #666;
        transition: all .1s;
    }
    .layer.on {
        background: #2a0000;
        border-color: #ff2020;
        color: #ff2020;
        font-weight: 700;
        box-shadow: 0 0 8px #ff2020;
    }

    /* Log */
    #eventLog {
        position: fixed;
        bottom: 110px;
        left: 8px;
        right: 8px;
        max-height: 100px;
        overflow-y: auto;
        background: #000;
        border: 1px solid #4a0000;
        border-radius: 8px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 9.5px;
        line-height: 1.4;
        white-space: pre-wrap;
        z-index: 5;
    }
    #eventLog .i  { color: #79c0ff; }
    #eventLog .ok { color: #3fb950; }
    #eventLog .wr { color: #d29922; }
    #eventLog .er { color: #f85149; }
    #eventLog .hi { color: #ff2020; font-weight: 700; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi">   <div class="v" id="s-call">0</div>     <div class="l">Calls</div></div>
    <div class="stat ok">   <div class="v" id="s-ok">0</div>       <div class="l">OK</div></div>
    <div class="stat err">  <div class="v" id="s-fail">0</div>     <div class="l">Fail</div></div>
    <div class="stat cy">   <div class="v" id="s-hz">0</div>       <div class="l">Hz</div></div>
    <div class="stat warn"> <div class="v" id="s-gap">0</div>      <div class="l">Gap ms</div></div>
</div>

<div class="layers">
    <div class="layer" id="ly1">L1</div>
    <div class="layer" id="ly2">L2</div>
    <div class="layer" id="ly3">L3</div>
    <div class="layer" id="ly4">L4</div>
    <div class="layer" id="ly5">L5</div>
    <div class="layer" id="ly6">L6</div>
    <div class="layer" id="ly7">WD</div>
</div>

<div id="zone" class="idle">
    <div class="icon" id="icon">💀</div>
    <div class="title" id="title">KLIK UNTUK MULAI</div>
    <div class="timer" id="timer">0.00s</div>
    <div class="subtitle" id="subtitle">
        Satu klik = getar tanpa henti.<br>
        Jari bisa langsung dilepas. Getar tetap jalan.<br>
        <b style="color:#ff2020;">Tekan STOP untuk menghentikan.</b>
    </div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>
<div id="eventLog"></div>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone     = document.getElementById('zone');
const icon     = document.getElementById('icon');
const title    = document.getElementById('title');
const timer    = document.getElementById('timer');
const subtitle = document.getElementById('subtitle');
const stopBtn  = document.getElementById('stopBtn');
const eventLog = document.getElementById('eventLog');
const sCall    = document.getElementById('s-call');
const sOk      = document.getElementById('s-ok');
const sFail    = document.getElementById('s-fail');
const sHz      = document.getElementById('s-hz');
const sGap     = document.getElementById('s-gap');
const layers   = [
    document.getElementById('ly1'), document.getElementById('ly2'),
    document.getElementById('ly3'), document.getElementById('ly4'),
    document.getElementById('ly5'), document.getElementById('ly6'),
    document.getElementById('ly7'),
];

// ============================================================
// KONFIGURASI — MAX BRUTAL
// ============================================================
// Setelah klik, tidak ada dependency pada jari lagi.
// Semua layer berjalan independen dengan timer.
// Getar hanya berhenti kalau STOP ditekan manual, atau tab hidden.

const CHUNK    = 9900;     // hampir mentok batas Chrome (10000ms)
const STEP     = 2500;     // tiap layer panggil tiap 2.5 detik
const OFFSETS  = [0, 400, 800, 1200, 1600, 2000];  // 6 layer dengan offset
const WATCHDOG = 250;      // cek tiap 250ms
const MAX_GAP  = 1000;     // kalau gap > 1s, tembak paksa
const STOP_GUARD = 500;    // stop guard interval

// ============================================================
// STATE
// ============================================================
let active       = false;
let startTime    = 0;
let layerIds     = [];
let watchdogId   = null;
let tickerId     = null;
let stopGuardId  = null;
let callCount    = 0;
let okCount      = 0;
let failCount    = 0;
let lastFireAt   = 0;
let maxGap       = 0;
let recentFires  = [];
let lastHiddenAt = 0;
let alternator   = 0;
let stopRequested = false;

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 100;
let logLines = 0;
function ts() { return new Date().toTimeString().slice(0,8); }

function log(text, cls = '') {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = `[${ts()}] ${text}\n`;
    eventLog.appendChild(s);
    logLines++;
    while (logLines > MAX_LOG && eventLog.firstChild) {
        eventLog.removeChild(eventLog.firstChild);
        logLines--;
    }
    eventLog.scrollTop = eventLog.scrollHeight;
}

// ============================================================
// VIBRATE WRAPPER
// ============================================================
function vib(pattern) {
    if (typeof navigator.vibrate !== 'function') return false;
    try {
        const r = navigator.vibrate(pattern);
        const now = Date.now();
        const gap = now - lastFireAt;
        if (gap > maxGap && lastFireAt > 0) maxGap = gap;
        lastFireAt = now;
        recentFires.push(now);
        const cutoff = now - 2000;
        recentFires = recentFires.filter(t => t > cutoff);
        return r;
    } catch (_) {
        return false;
    }
}

// ============================================================
// UI
// ============================================================
function updateTimer() {
    if (!active) return;
    const sec = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = sec + 's';
    sGap.textContent = (Date.now() - lastFireAt);
}

function updateStats() {
    sCall.textContent = callCount;
    sOk.textContent   = okCount;
    sFail.textContent = failCount;
    sHz.textContent   = (recentFires.length / 2).toFixed(1);
}

function setLayerUI(idx, on) {
    if (layers[idx]) {
        if (on) layers[idx].classList.add('on');
        else layers[idx].classList.remove('on');
    }
}

function clearAllLayerUI() {
    layers.forEach(l => l.classList.remove('on'));
}

// ============================================================
// FIRE — dengan pattern bergantian
// ============================================================
function fire(label) {
    if (!active || stopRequested) return;

    let pattern;
    alternator = (alternator + 1) % 4;
    if (alternator === 0)      pattern = CHUNK;
    else if (alternator === 1) pattern = [CHUNK];
    else if (alternator === 2) pattern = [4900, 50, 4950];
    else                       pattern = [3300, 30, 3300, 30, 3240];

    const ok = vib(pattern);
    callCount++;
    if (ok) okCount++; else failCount++;
    updateStats();
    if (!ok) log(`⚠ ${label} FAIL`, 'wr');
}

// ============================================================
// START — 6 layer + watchdog + stop guard
// ============================================================
function start() {
    if (active) return;
    if (typeof navigator.vibrate !== 'function') {
        subtitle.textContent = 'Vibration API tidak didukung.';
        log('❌ API tidak tersedia', 'er');
        return;
    }

    active = true;
    stopRequested = false;
    startTime = Date.now();
    callCount = okCount = failCount = 0;
    maxGap = 0;
    recentFires = [];
    layerIds = [];
    updateStats();

    zone.classList.remove('idle');
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = '💀 GETAR AKTIF';
    stopBtn.classList.add('on');

    log('💀💀💀 CLICK & FORGET AKTIF 💀💀💀', 'hi');
    log(`Chunk=${CHUNK}ms · Step=${STEP}ms · 6 layer + watchdog`, 'i');
    log('Jari boleh dilepas. Getar tetap jalan.', 'ok');

    // ---- 6 LAYER ----
    OFFSETS.forEach((offset, idx) => {
        setTimeout(() => {
            if (!active || stopRequested) return;
            fire(`L${idx+1}-init`);
            setLayerUI(idx, true);
            const id = setInterval(() => fire(`L${idx+1}`), STEP);
            layerIds.push(id);
        }, offset);
    });

    // ---- WATCHDOG 250ms ----
    watchdogId = setInterval(() => {
        if (!active || stopRequested) return;
        const gap = Date.now() - lastFireAt;
        if (gap > MAX_GAP) {
            fire('WD');
            setLayerUI(6, true);
            setTimeout(() => setLayerUI(6, false), 150);
        }
    }, WATCHDOG);

    // ---- TICKER ----
    updateTimer();
    tickerId = setInterval(updateTimer, 50);

    // ---- STOP GUARD ----
    // Setiap 500ms, pastikan tidak ada timer yang tersisa berjalan
    // ketika stopRequested = true.
    stopGuardId = setInterval(() => {
        if (stopRequested && active) {
            // Paksa cleanup
            hardStop('guard');
        }
    }, STOP_GUARD);

    subtitle.innerHTML = `💀 EXTREME FOREVER<br>6 layer pumping · jari boleh dilepas<br><b style="color:#ff2020;">STOP untuk menghentikan.</b>`;
}

// ============================================================
// HARD STOP — paksa matikan semuanya
// ============================================================
function hardStop(reason = 'manual') {
    // Kalau sudah tidak aktif dan tidak ada timer, keluar
    if (!active && layerIds.length === 0 && !watchdogId) return;

    active = false;
    stopRequested = true;

    // Bersihkan semua interval
    layerIds.forEach(id => clearInterval(id));
    layerIds = [];
    clearInterval(watchdogId);   watchdogId = null;
    clearInterval(tickerId);     tickerId = null;
    clearInterval(stopGuardId);  stopGuardId = null;

    clearAllLayerUI();

    // Triple-tap vibrate(0) untuk memastikan motor benar-benar mati
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}
    try { navigator.vibrate([0, 0, 0]); } catch(_) {}

    // UI kembali ke idle
    zone.classList.remove('active');
    zone.classList.add('idle');
    icon.textContent = '💀';
    title.textContent = 'KLIK UNTUK MULAI';
    stopBtn.classList.remove('on');

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = elapsed + 's';
    subtitle.innerHTML = `Berhenti (${reason}) setelah ${elapsed}s.<br>
        ${callCount} calls · ${okCount} OK · ${failCount} FAIL<br>
        <b>Klik di mana saja untuk mulai lagi.</b>`;

    log(`⏹ HARD STOP (${reason}) — ${elapsed}s — ${callCount} calls (${okCount} OK, ${failCount} FAIL) — maxGap=${maxGap}ms`, 'ok');
    updateStats();
}

// ============================================================
// EVENT: KLIK / TAP untuk start
// ============================================================
zone.addEventListener('click', (e) => {
    if (!active) {
        start();
    }
    // Klik saat aktif sengaja diabaikan — hanya STOP yang bisa menghentikan.
});

// Support touch untuk response lebih cepat
zone.addEventListener('touchstart', (e) => {
    if (!active) {
        e.preventDefault();
        start();
    }
}, { passive: false });

// Mouse fallback (desktop)
zone.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !active) {
        start();
    }
});

// ============================================================
// TOMBOL STOP
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    log('🛑 Tombol STOP ditekan', 'hi');
    hardStop('user');
});

stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    log('🛑 Tombol STOP ditekan (touch)', 'hi');
    hardStop('user');
}, { passive: false });

// ============================================================
// VISIBILITY — tetap auto-stop saat tab hidden
// ============================================================
document.addEventListener('visibilitychange', () => {
    const now = Date.now();
    if (document.hidden) {
        lastHiddenAt = now;
        log('👁 HIDDEN — hard stop otomatis', 'hi');
        log(`   active=${active} calls=${callCount} gap=${now - lastFireAt}ms`, 'i');
        hardStop('hidden');
    } else {
        log('👁 VISIBLE kembali', 'hi');
        log(`   hidden ${now - lastHiddenAt}ms`, 'i');
        if (navigator.userActivation) {
            const ua = navigator.userActivation;
            log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
        }
    }
});

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    layerIds.forEach(id => clearInterval(id));
    clearInterval(watchdogId);
    clearInterval(tickerId);
    clearInterval(stopGuardId);
    try { navigator.vibrate(0); } catch(_) {}
});

window.addEventListener('blur', () => log('💤 blur', 'wr'));
window.addEventListener('focus', () => log('🎯 focus', 'ok'));

// ============================================================
// INIT
// ============================================================
updateStats();
log('=== CLICK & FORGET READY ===', 'hi');
if (typeof navigator.vibrate === 'function') {
    log('✅ Vibration API tersedia', 'ok');
    log('💀 KLIK di mana saja untuk memulai', 'i');
    log(`Chunk=${CHUNK}ms · Step=${STEP}ms · 6 layers + WD`, 'i');
    log('Getar tidak akan berhenti sampai STOP ditekan.', 'hi');
} else {
    log('❌ Vibration API TIDAK tersedia', 'er');
}

})();
</script>

</body>
</html>
