<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Web Audio API Autoplay</title>
</head>
<body>
    <h3>Uji Coba Web Audio API State</h3>
    <p>Periksa konsol untuk melihat status sinkronisasi AudioContext.</p>

    <script>
        // Inisialisasi AudioContext di luar interaksi user
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log("Status Awal AudioContext:", audioCtx.state); // Biasanya langsung "suspended"

        // Simulasi looping agresif untuk mencoba memaksa status "running" 
        // memanfaatkan celah sinkronisasi state (State Desynchronization)
        let hitungPercobaan = 0;
        
        function cobaPaksaResume() {
            if (audioCtx.state === 'suspended' && hitungPercobaan < 5) {
                hitungPercobaan++;
                
                // Mencoba me-resume paksa
                audioCtx.resume().then(() => {
                    if (audioCtx.state === 'running') {
                        console.log("🔴 Kerentanan Terdeteksi: AudioContext dipaksa berjalan tanpa User Gesture!");
                    }
                }).catch(err => {
                    console.log("Blokade aktif pada percobaan ke-" + hitungPercobaan);
                });

                // Lakukan perulangan cepat pada frame berikutnya
                requestAnimationFrame(cobaPaksaResume);
            } else if (audioCtx.state === 'suspended') {
                console.log("🟢 Browser Aman: Perlindungan berlapis berhasil menahan AudioContext tetap suspended.");
            }
        }

        // Jalankan pengujian otomatis
        cobaPaksaResume();
    </script>
</body>
</html>
