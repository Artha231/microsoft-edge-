<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generator Berkas Blob & ObjectURL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }
    .panel {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 40px auto;
    }
    /* Tampilan Fullscreen */
    :fullscreen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    :-webkit-full-screen {
      background: #111111 !important;
      color: #00ff00 !important;
      padding: 20px !important;
      overflow-y: auto !important;
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 15px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #d32f2f;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
      transition: background 0.2s;
    }
    button:hover {
      background: #b71c1c;
    }
    #status {
      margin-top: 16px;
      font-weight: bold;
      color: #d32f2f;
      padding: 12px;
      background: #ffebee;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #ffcdd2;
    }
    #downloads {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    #downloads a {
      display: block;
      padding: 8px;
      background: #212121;
      color: #38bdf8; /* Mengubah warna visual tautan menjadi biru khas Python */
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      border: 1px solid #424242;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="panel" id="main-panel">
    <h2>Generator Berkas Blob Python (.PY)</h2>
    <p>Klik tombol untuk masuk ke layar penuh dan memicu pembuatan berkas Blob berisi skrip Python ber-ekstensi .py secara terus-menerus (Uji MIME Sniffing).</p>

    <button id="start-btn" type="button">Mulai Layar Penuh &amp; Generate Python</button>

    <div id="status" role="status">Sistem siap.</div>
    <div id="downloads"></div>
  </div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    const downloadsDiv = document.getElementById("downloads");

    let activeUrls = [];
    let isProcessing = false;

    // Fungsi Sintesis Suara (TTS)
    const speak = (message) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    };

    // Mengubah fungsi pembuat data untuk menghasilkan kode skrip Python (.py)
    const prepareMimeBlobAsync = (i) => {
      return new Promise((resolve) => {
        queueMicrotask(() => {
          // Isi payload diubah menjadi sintaks pemrograman Python yang valid
          const pythonCode = `import sys\nimport os\n\ndef main():\n    print("Test Vulnerability - File Ke-${i}")\n    print("System OS:", sys.platform)\n\nif __name__ == "__main__":\n    main()`;
          
          // Menyetel tipe konten sebagai teks Python (text/x-python) di internal memori Blob
          const blob = new Blob([pythonCode], { type: "text/x-python" });
          const url = URL.createObjectURL(blob);
          resolve({ id: i, url: url });
        });
      });
    };

    // Bagian pemicu unduhan memaksa ekstensi nama file menjadi skrip Python (.py)
    const triggerInstantDownload = (fileData) => {
      const link = document.createElement("a");
      link.href = fileData.url;
      
      // Mengunci nama unduhan visual sebagai file Python (.py)
      link.download = `test-file-${fileData.id}.py`;
      link.textContent = `Script #${fileData.id} (.py)`;
      
      downloadsDiv.appendChild(link);
      link.click();
    };

    // Perulangan Rekursif Asynchronous
    const processLoop = async (counter) => {
      if (!isProcessing) return;

      // Hasilkan Blob Python dan URL objeknya
      const fileData = await prepareMimeBlobAsync(counter);
      activeUrls.push(fileData.url);
      
      // Picu unduhan file .py secara beruntun
      triggerInstantDownload(fileData);

      statusDiv.textContent = `Proses Berjalan: Berkas ke-${counter} dikirim`;

      if (counter % 10 === 0) {
        speak(`Proses mencapai ${counter} berkas.`);
      }

      // Memberi celah udara kecil ke event loop browser
      setTimeout(() => processLoop(counter + 1), 0);
    };

    // Event Handler Tombol Utama
    startBtn.addEventListener("click", () => {
      if (isProcessing) return;

      // Bersihkan alokasi memori objek URL sebelumnya demi menjaga stabilitas RAM
      activeUrls.forEach(url => URL.revokeObjectURL(url));
      activeUrls = [];
      downloadsDiv.replaceChildren();

      speak("Mengaktifkan mode layar penuh.");

      // Permintaan Mode Fullscreen
      const root = document.documentElement;
      try {
        if (root.requestFullscreen) {
          root.requestFullscreen();
        } else if (root.webkitRequestFullscreen) {
          root.webkitRequestFullscreen();
        } else if (root.mozRequestFullScreen) {
          root.mozRequestFullScreen();
        }
        statusDiv.textContent = "Mengunci layar penuh...";
      } catch (err) {
        console.warn("Fullscreen tidak didukung atau ditolak:", err);
      }

      // Jalankan proses siklus download setelah jeda singkat
      setTimeout(() => {
        isProcessing = true;
        speak("Proses pembuatan berkas Python dimulai.");
        processLoop(1);
      }, 300);
    });

    // Otomatis menghentikan loop jika pengguna menekan tombol ESC untuk keluar dari fullscreen
    const stopProcess = () => {
      if (isProcessing) {
        isProcessing = false;
        statusDiv.textContent = "Proses dihentikan (Keluar dari Layar Penuh).";
        speak("Proses dihentikan.");
        activeUrls.forEach(url => URL.revokeObjectURL(url));
        activeUrls = [];
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) stopProcess();
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitIsFullScreen) stopProcess();
    });
  </script>
</body>
</html>
