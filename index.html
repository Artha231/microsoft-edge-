
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture & Vibration Analyzer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 25px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      color: #fff;
      background: #2563eb;
    }

    #stopBtn {
      color: #fff;
      background: #dc2626;
    }

    button:active {
      opacity: 0.8;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 12px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Gesture & Vibration Analyzer</h2>

    <p>
      Tes fitur getaran perangkat dengan pola berulang.
      Getaran dimulai setelah tombol ditekan.
    </p>

    <button id="startBtn">Mulai Getaran</button>
    <button id="stopBtn">Stop Getaran</button>

    <div id="status" role="status" aria-live="polite">
      Status: berhenti
    </div>

    <div class="note">
      Dukungan getaran bergantung pada perangkat dan browser.
    </div>
  </main>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusText = document.getElementById("status");

    let vibrationTimer = null;

    // Pola: getar 1 detik, jeda 300 milidetik.
    const vibrationPattern = [1000, 300];

    function stopVibration() {
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      if (typeof navigator.vibrate === "function") {
        navigator.vibrate(0);
      }

      statusText.textContent = "Status: getaran berhenti";
      startBtn.disabled = false;
    }

    function startVibration() {
      if (typeof navigator.vibrate !== "function") {
        statusText.textContent =
          "Vibration API tidak didukung browser atau perangkat ini.";
        return;
      }

      // Bersihkan timer sebelumnya agar tidak bertumpuk.
      if (vibrationTimer !== null) {
        clearInterval(vibrationTimer);
        vibrationTimer = null;
      }

      navigator.vibrate(0);

      // Mulai pola getaran.
      navigator.vibrate(vibrationPattern);

      // Ulangi pola sampai tombol Stop ditekan.
      vibrationTimer = setInterval(() => {
        navigator.vibrate(vibrationPattern);
      }, 1300);

      statusText.textContent =
        "Status: getaran aktif. Tekan Stop Getaran untuk berhenti.";

      startBtn.disabled = true;
    }

    startBtn.addEventListener("click", startVibration);
    stopBtn.addEventListener("click", stopVibration);

    // Hentikan getaran saat halaman ditinggalkan.
    window.addEventListener("pagehide", stopVibration);
  </script>
</body>
</html>
