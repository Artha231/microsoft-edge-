<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; min-height: 100vh; }
  iframe, audio, video, embed, object { display: none; }
</style>
</head>
<body>

<!-- PERBAIKAN: Menggunakan Base64 Video MP4 Kosong Asli (1x1 piksel senyap) -->
<video id="loopBypass" autoplay muted loop playsinline style="display:none;">
  <source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAzphbW9vdgYAbG12aGQAAAAA0zVfVNM1X1QAAAEgAAAAtwABAAEAAV9VAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAACNnRyYWsAAABsdGtoZAAAAAPTMV9V0zVfVAAAAAEAAAAAAAC3AAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAQAAAitkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAxtZGlhdGgAAAAA0zVfVNM1X1QAAAEgAAAAt1YVxAAAAAAALW1kYmQAAAAAAAAAAAAAAAQAAAAhYmtoZAAAAAEAAAAAAAAAAAAAAAEAAAAAZGF0YQAAAAE=" type="video/mp4">
</video>

<iframe src="data:text/html,<script>var a=new Audio();a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';a.loop=true;a.volume=0.001;a.play().catch(function(){});</script>" allow="autoplay" style="display:none"></iframe>

<iframe src="data:text/html,<script>var c=new (AudioContext||webkitAudioContext)();var o=c.createOscillator();o.frequency.value=40;o.type='sine';var g=c.createGain();g.gain.value=0.001;o.connect(g);g.connect(c.destination);o.start();</script>" allow="autoplay" style="display:none"></iframe>

<audio id="silent1" preload="auto" loop style="display:none">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>

<audio id="silent2" preload="auto" loop style="display:none">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script>
(function() {
  var unlocked = false;
  var played = false;
  var loopMedia = document.getElementById('loopBypass');

  // ===== MAIN AUDIO: Alert sound + TTS =====
  function playMainAudio() {
    if (played) return;
    played = true;
    
    // Eksekusi Unmute Video Loop
    try {
      if (loopMedia) {
        loopMedia.muted = false;
        loopMedia.play().catch(function(){});
      }
    } catch(e) {}
    
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var sr = ctx.sampleRate;
      var dur = 3.5;
      var buf = ctx.createBuffer(1, sr * dur, sr);
      var d = buf.getChannelData(0);
      
      for (var i = 0; i < d.length; i++) {
        var t = i / sr;
        var freq = 880 + (Math.floor(t * 4) % 2) * 440 + Math.floor(t * 2) % 2 * 220;
        var env = Math.max(0, 1 - (t / dur));
        var pulse = (Math.sin(2 * Math.PI * 6 * t) > 0) ? 1 : 0.3;
        d[i] = Math.sin(2 * Math.PI * freq * t) * 0.35 * env * pulse;
      }
      
      var src = ctx.createBufferSource();
      src.buffer = buf;
      
      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;
      filter.Q.value = 1.5;
      
      var gain = ctx.createGain();
      gain.gain.value = 0.7;
      
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start();
      
      src.onended = function() {
        startTTS();
      };
      
      setTimeout(startTTS, 4000);
      
    } catch(e) {
      startTTS();
    }
  }

  // ===== RACE: Coba unlock via semua methods SERENTAK =====
  function raceUnlock() {
    try {
      if (loopMedia && loopMedia.muted) {
        loopMedia.muted = false;
        // Penambahan catch block wajib untuk menghindari Uncaught DOMException Error di konsol
        loopMedia.play().then(function() {
          unlocked = true;
          playMainAudio(); 
        }).catch(function() {
          loopMedia.muted = true; 
        });
      }
    } catch(e) {}

    // Method 1: WebAudio oscillator
    try {
      var ctx1 = new (window.AudioContext || window.webkitAudioContext)();
      var osc1 = ctx1.createOscillator();
      osc1.frequency.value = 30;
      var g1 = ctx1.createGain();
      g1.gain.value = 0.001;
      osc1.connect(g1);
      g1.connect(ctx1.destination);
      osc1.start();
      if (ctx1.state === 'running') unlocked = true;
      if (ctx1.state === 'suspended') ctx1.resume().then(function(){unlocked=true;});
    } catch(e) {}

    // Method 2: HTMLAudio elements (silent)
    try {
      var a1 = document.getElementById('silent1');
      a1.volume = 0.001;
      a1.play().then(function(){unlocked=true;}).catch(function(){});
    } catch(e) {}
    
    try {
      var a2 = document.getElementById('silent2');
      a2.volume = 0.001;
      a2.play().then(function(){unlocked=true;}).catch(function(){});
    } catch(e) {}

    // Method 3: New Audio() instances
    for (var i = 0; i < 2; i++) {
      try {
        var audio = new Audio();
        audio.volume = 0.001;
        audio.play().then(function(){unlocked=true;}).catch(function(){});
      } catch(e) {}
    }

    // Method 4: Speech Synthesis
    try {
      var u = new SpeechSynthesisUtterance("Hello, world!");
      if (voices.length > 0) {
        var ev = voices.find(function(v){return v.lang.startsWith('en');});
        if (ev) u.voice = ev;
      }
      
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  // ===== EXECUTION PIPELINE =====
  raceUnlock();
  setTimeout(raceUnlock, 50);
  setTimeout(raceUnlock, 150);
  
  setTimeout(function() {
    for (var i = 0; i < 2; i++) {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume().catch(function(){});
      } catch(e) {}
    }
    playMainAudio();
  }, 200);
  
  setTimeout(function() { if (!played) playMainAudio(); }, 500);
  setTimeout(function() { if (!played) playMainAudio(); }, 1000);
  
  // EVENT INTERAKSI ALAMI (Jaring Pengaman Terakhir)
  var interactionEvents = ['click', 'scroll', 'touchstart', 'mousemove', 'pointerdown'];
  
  function triggerOnInteraction() {
    if (!played) {
      playMainAudio();
    }
    interactionEvents.forEach(function(evt) {
      document.removeEventListener(evt, triggerOnInteraction);
    });
  }

  interactionEvents.forEach(function(evt) {
    document.addEventListener(evt, triggerOnInteraction, { once: true, passive: true });
  });
  
  // Penanganan asinkronitas daftar suara TTS bawaan Chrome
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function() {
      speechSynthesis.getVoices();
    };
  }
})();
</script>

</body>
</html>
