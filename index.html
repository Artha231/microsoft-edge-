<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>♾️ INFINITE LOOP — Vibrate Forever</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #e6e8eb;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
    }
    #zone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        transition: background .15s;
    }
    #zone.idle   { background: #000; cursor: pointer; }
    #zone.active { background: radial-gradient(circle at center, #6a0000 0%, #000 100%); }

    .icon {
        font-size: 120px;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 30px #ff0000);
    }
    #zone.active .icon { animation: megaShake .05s infinite; }
    @keyframes megaShake {
        0%   { transform: rotate(-25deg) scale(1.45); }
        25%  { transform: rotate(0deg) scale(1.6); }
        50%  { transform: rotate(25deg) scale(1.45); }
        75%  { transform: rotate(0deg) scale(1.6); }
        100% { transform: rotate(-25deg) scale(1.45); }
    }

    .title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        margin-bottom: 6px;
    }
    #zone.active .title {
        color: #ff2020;
        text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
        animation: flicker .1s infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.8; }
    }

    .subtitle {
        font-size: 13px;
        color: #8b93a1;
        line-height: 1.6;
        max-width: 320px;
    }
    #zone.active .subtitle { color: #ff7070; }

    .timer {
        font-family: ui-monospace, monospace;
        font-size: 72px;
        font-weight: 900;
        color: #ff2020;
        margin: 12px 0;
        min-height: 82px;
        letter-spacing: 4px;
        text-shadow: 0 0 50px #ff0000;
        font-variant-numeric: tabular-nums;
    }
    #zone.idle .timer { color: #333; text-shadow: none; }

    /* Progress milestone */
    .milestone {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #666;
        margin-top: 8px;
        letter-spacing: 2px;
    }
    #zone.active .milestone { color: #ff6060; }

    /* Tombol STOP */
    #stopBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 280px;
        max-width: calc(100% - 40px);
        padding: 20px;
        background: #dc2626;
        color: white;
        border: 3px solid #ff4040;
        border-radius: 14px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 3px;
        cursor: pointer;
        display: none;
        z-index: 10;
        box-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000 inset;
        animation: btnPulse .5s infinite alternate;
    }
    #stopBtn.on { display: block; }
    @keyframes btnPulse {
        from { box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000 inset; }
        to   { box-shadow: 0 0 50px #ff0000, 0 0 90px #ff0000 inset; }
    }
    #stopBtn:active { transform: translateX(-50%) scale(0.95); }

    /* Stats grid */
    .stats {
        position: fixed;
        top: 6px;
        left: 6px;
        right: 6px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        z-index: 5;
    }
    .stat {
        background: rgba(20, 0, 0, 0.94);
        border: 1px solid #4a0000;
        border-radius: 5px;
        padding: 4px 2px;
        text-align: center;
    }
    .stat .v { font-size: 14px; font-weight: 900; line-height: 1.1; }
    .stat .l { color: #8b93a1; text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; font-size: 8px; }
    .stat.hi  .v { color: #ff2020; }
    .stat.ok  .v { color: #2ecc71; }
    .stat.err .v { color: #e74c3c; }
    .stat.warn .v { color: #f1c40f; }
    .stat.cy  .v { color: #00ffff; }

    /* Layer indicators */
    .layers {
        position: fixed;
        top: 54px;
        left: 6px;
        right: 6px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
        z-index: 5;
    }
    .layer {
        background: rgba(20, 0, 0, 0.94);
        border: 1px solid #4a0000;
        border-radius: 4px;
        padding: 3px 1px;
        text-align: center;
        font-family: ui-monospace, monospace;
        font-size: 8px;
        color: #666;
        transition: all .1s;
    }
    .layer.on {
        background: #3a0000;
        border-color: #ff2020;
        color: #ff2020;
        font-weight: 700;
        box-shadow: 0 0 10px #ff2020;
    }

    /* Log */
    #eventLog {
        position: fixed;
        bottom: 100px;
        left: 6px;
        right: 6px;
        max-height: 90px;
        overflow-y: auto;
        background: #000;
        border: 1px solid #4a0000;
        border-radius: 8px;
        padding: 6px 10px;
        font-family: ui-monospace, monospace;
        font-size: 9px;
        line-height: 1.35;
        white-space: pre-wrap;
        z-index: 5;
    }
    #eventLog .i  { color: #79c0ff; }
    #eventLog .ok { color: #3fb950; }
    #eventLog .wr { color: #d29922; }
    #eventLog .er { color: #f85149; }
    #eventLog .hi { color: #ff2020; font-weight: 700; }
</style>
</head>
<body>

<div class="stats">
    <div class="stat hi">   <div class="v" id="s-call">0</div>     <div class="l">Calls</div></div>
    <div class="stat ok">   <div class="v" id="s-ok">0</div>       <div class="l">OK</div></div>
    <div class="stat err">  <div class="v" id="s-fail">0</div>     <div class="l">Fail</div></div>
    <div class="stat cy">   <div class="v" id="s-hz">0</div>       <div class="l">Hz</div></div>
    <div class="stat warn"> <div class="v" id="s-gap">0</div>      <div class="l">Gap</div></div>
</div>

<div class="layers">
    <div class="layer" id="ly1">L1</div>
    <div class="layer" id="ly2">L2</div>
    <div class="layer" id="ly3">L3</div>
    <div class="layer" id="ly4">L4</div>
    <div class="layer" id="ly5">L5</div>
    <div class="layer" id="ly6">L6</div>
    <div class="layer" id="ly7">L7</div>
    <div class="layer" id="ly8">WD</div>
</div>

<div id="zone" class="idle">
    <div class="icon" id="icon">♾️</div>
    <div class="title" id="title">KLIK → INFINITE</div>
    <div class="timer" id="timer">0.00s</div>
    <div class="subtitle" id="subtitle">
        💀♾️ Loop getar tanpa batas.<br>
        Jari boleh dilepas. Getar tidak akan berhenti.<br>
        <b style="color:#ff2020;">STOP untuk menghentikan.</b>
    </div>
    <div class="milestone" id="milestone"></div>
</div>

<button id="stopBtn">■ STOP GETARAN</button>
<div id="eventLog"></div>

<script>
(() => {
'use strict';

// ============================================================
// DOM
// ============================================================
const zone      = document.getElementById('zone');
const icon      = document.getElementById('icon');
const title     = document.getElementById('title');
const timer     = document.getElementById('timer');
const subtitle  = document.getElementById('subtitle');
const milestone = document.getElementById('milestone');
const stopBtn   = document.getElementById('stopBtn');
const eventLog  = document.getElementById('eventLog');
const sCall     = document.getElementById('s-call');
const sOk       = document.getElementById('s-ok');
const sFail     = document.getElementById('s-fail');
const sHz       = document.getElementById('s-hz');
const sGap      = document.getElementById('s-gap');
const layers    = [
    document.getElementById('ly1'), document.getElementById('ly2'),
    document.getElementById('ly3'), document.getElementById('ly4'),
    document.getElementById('ly5'), document.getElementById('ly6'),
    document.getElementById('ly7'), document.getElementById('ly8'),
];

// ============================================================
// KONFIGURASI INFINITE
// ============================================================
// Strategi: kombinasi setTimeout recursive + setInterval + rAF watchdog.
// Setiap layer memanggil ulang dirinya SENDIRI, jadi tidak ada ketergantungan
// pada satu timer yang bisa mati.
//
// Setelah klik, 7 loop independen berjalan. Kalau satu mati, yang lain
// masih memanggil vibrate. Watchdog terakhir memastikan selalu ada aktivitas.

const CHUNK       = 9900;   // hampir mentok batas Chrome (10000ms)
const LAYER_STEP  = 2000;   // tiap layer fire tiap 2 detik
const WATCHDOG_MS = 200;    // watchdog cek tiap 200ms
const MAX_GAP     = 800;    // kalau gap > 800ms → paksa fire
const TICKER_MS   = 40;     // update timer 25 fps

// ============================================================
// STATE
// ============================================================
let active       = false;
let startTime    = 0;
let callCount    = 0;
let okCount      = 0;
let failCount    = 0;
let lastFireAt   = 0;
let maxGap       = 0;
let recentFires  = [];
let lastHiddenAt = 0;
let alternator   = 0;
let stopRequested = false;

// Timer handles
let layerTimeouts = [];   // recursive setTimeout
let intervalIds = [];     // interval-based layers
let watchdogId = null;
let tickerId = null;
let rafId = null;

// ============================================================
// LOG
// ============================================================
const MAX_LOG = 100;
let logLines = 0;
function ts() { return new Date().toTimeString().slice(0,8); }
function log(text, cls = '') {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = `[${ts()}] ${text}\n`;
    eventLog.appendChild(s);
    logLines++;
    while (logLines > MAX_LOG && eventLog.firstChild) {
        eventLog.removeChild(eventLog.firstChild);
        logLines--;
    }
    eventLog.scrollTop = eventLog.scrollHeight;
}

// ============================================================
// VIBRATE WRAPPER
// ============================================================
function vib(pattern) {
    if (typeof navigator.vibrate !== 'function') return false;
    try {
        const r = navigator.vibrate(pattern);
        const now = Date.now();
        const gap = now - lastFireAt;
        if (gap > maxGap && lastFireAt > 0) maxGap = gap;
        lastFireAt = now;
        recentFires.push(now);
        const cutoff = now - 2000;
        recentFires = recentFires.filter(t => t > cutoff);
        return r;
    } catch (_) {
        return false;
    }
}

// ============================================================
// UI
// ============================================================
function updateTimer() {
    if (!active) return;
    const sec = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = sec + 's';
    sGap.textContent = (Date.now() - lastFireAt);

    // Milestone berdasarkan waktu
    const s = parseFloat(sec);
    let ms = '';
    if (s >= 600)      ms = '🔥 10 MENIT — LUAR BIASA';
    else if (s >= 300) ms = '💀 5 MENIT — GILA';
    else if (s >= 120) ms = '⚡ 2 MENIT — KUAT';
    else if (s >= 60)  ms = '🎯 1 MENIT — TERUS';
    else if (s >= 30)  ms = '⏱ 30 DETIK';
    milestone.textContent = ms;
}

function updateStats() {
    sCall.textContent = callCount;
    sOk.textContent   = okCount;
    sFail.textContent = failCount;
    sHz.textContent   = (recentFires.length / 2).toFixed(1);
}

function setLayerUI(idx, on) {
    if (layers[idx]) {
        if (on) layers[idx].classList.add('on');
        else layers[idx].classList.remove('on');
    }
}

function pulseLayer(idx) {
    setLayerUI(idx, true);
    setTimeout(() => {
        if (active) setLayerUI(idx, false);
    }, 100);
}

// ============================================================
// FIRE — pattern bergantian
// ============================================================
function fire(label, layerIdx) {
    if (!active || stopRequested) return;

    let pattern;
    alternator = (alternator + 1) % 5;
    if (alternator === 0)      pattern = CHUNK;
    else if (alternator === 1) pattern = [CHUNK];
    else if (alternator === 2) pattern = [4900, 100, 4900];
    else if (alternator === 3) pattern = [3300, 50, 3300, 50, 3200];
    else                       pattern = [2475, 25, 2475, 25, 2475, 25, 2400];

    const ok = vib(pattern);
    callCount++;
    if (ok) okCount++; else failCount++;
    updateStats();
    if (layerIdx !== undefined) pulseLayer(layerIdx);
    if (!ok) log(`⚠ ${label} FAIL`, 'wr');
}

// ============================================================
// RECURSIVE LOOP — panggil dirinya sendiri tanpa henti
// ============================================================
function recursiveLoop(layerIdx, label, step) {
    if (!active || stopRequested) return;

    fire(label, layerIdx);

    // Rekursif: setTimeout memanggil dirinya sendiri
    const id = setTimeout(() => recursiveLoop(layerIdx, label, step), step);
    layerTimeouts.push(id);
}

// ============================================================
// START — 7 recursive loop + 1 watchdog + 1 ticker + 1 rAF
// ============================================================
function start() {
    if (active) return;
    if (typeof navigator.vibrate !== 'function') {
        subtitle.textContent = 'Vibration API tidak didukung.';
        log('❌ API tidak tersedia', 'er');
        return;
    }

    active = true;
    stopRequested = false;
    startTime = Date.now();
    callCount = okCount = failCount = 0;
    maxGap = 0;
    recentFires = [];
    layerTimeouts = [];
    intervalIds = [];
    updateStats();

    zone.classList.remove('idle');
    zone.classList.add('active');
    icon.textContent = '📳';
    title.textContent = '💀♾️ INFINITE AKTIF';
    stopBtn.classList.add('on');

    log('💀♾️♾️ INFINITE LOOP AKTIF ♾️♾️💀', 'hi');
    log(`Chunk=${CHUNK}ms · 7 recursive layers · watchdog ${WATCHDOG_MS}ms`, 'i');
    log('Setiap layer memanggil dirinya sendiri — tidak ada yang bisa menghentikan.', 'ok');

    // ============================================================
    // LAYER 1-4: RECURSIVE setTimeout (self-calling)
    // ============================================================
    // Setiap layer memanggil fire() lalu setTimeout dirinya sendiri.
    // Ini menciptakan loop tak terbatas yang tidak bergantung pada
    // interval global — kalau satu mati, tidak mempengaruhi yang lain.

    const layerOffsets = [0, 500, 1000, 1500];
    layerOffsets.forEach((offset, idx) => {
        setTimeout(() => {
            if (!active || stopRequested) return;
            recursiveLoop(idx, `L${idx+1}`, LAYER_STEP);
        }, offset);
    });

    // ============================================================
    // LAYER 5-7: setInterval (independent)
    // ============================================================
    [0, 400, 800].forEach((offset, i) => {
        setTimeout(() => {
            if (!active || stopRequested) return;
            const layerIdx = 4 + i;
            const id = setInterval(() => {
                if (!active || stopRequested) return;
                fire(`I${i+1}`, layerIdx);
            }, LAYER_STEP);
            intervalIds.push(id);
        }, offset);
    });

    // ============================================================
    // WATCHDOG: setInterval + recursive hybrid
    // ============================================================
    // Watchdog memeriksa apakah ada gap. Kalau ada, paksa fire.
    // Watchdog SENDIRI adalah recursive loop supaya tidak bisa mati.
    (function watchdogLoop() {
        if (!active || stopRequested) return;
        const gap = Date.now() - lastFireAt;
        if (gap > MAX_GAP) {
            fire('WD', 7);
            log(`🐕 Gap ${gap}ms → paksa fire`, 'wr');
        }
        setTimeout(watchdogLoop, WATCHDOG_MS);
    })();

    // ============================================================
    // TICKER: update UI
    // ============================================================
    updateTimer();
    tickerId = setInterval(updateTimer, TICKER_MS);

    // ============================================================
    // rAF WATCHDOG: extra layer pakai requestAnimationFrame
    // ============================================================
    // rAF berjalan ~60fps saat tab visible. Ini adalah layer ultra-fast
    // yang memastikan selalu ada fire saat tab aktif.
    let rafCounter = 0;
    function rafLoop() {
        if (!active || stopRequested) return;
        rafCounter++;
        // Fire setiap ~30 frame (≈0.5 detik) sebagai boost
        if (rafCounter % 30 === 0) {
            const gap = Date.now() - lastFireAt;
            if (gap > 400) {
                fire('RAF');
            }
        }
        rafId = requestAnimationFrame(rafLoop);
    }
    rafId = requestAnimationFrame(rafLoop);

    subtitle.innerHTML = `💀♾️ INFINITE FOREVER<br>7 recursive + 1 watchdog + 1 rAF<br><b style="color:#ff2020;">STOP untuk menghentikan.</b>`;
}

// ============================================================
// HARD STOP
// ============================================================
function hardStop(reason = 'manual') {
    if (!active && layerTimeouts.length === 0 && intervalIds.length === 0 && !watchdogId) return;

    active = false;
    stopRequested = true;

    // Bersihkan semua timer
    layerTimeouts.forEach(id => clearTimeout(id));
    layerTimeouts = [];
    intervalIds.forEach(id => clearInterval(id));
    intervalIds = [];
    clearInterval(watchdogId);   watchdogId = null;
    clearInterval(tickerId);     tickerId = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    // Reset layer UI
    layers.forEach(l => l.classList.remove('on'));

    // Triple-tap vibrate(0) untuk memastikan motor benar-benar mati
    try { navigator.vibrate(0); } catch(_) {}
    try { navigator.vibrate([]); } catch(_) {}
    try { navigator.vibrate([0, 0, 0]); } catch(_) {}
    setTimeout(() => {
        try { navigator.vibrate(0); } catch(_) {}
    }, 50);
    setTimeout(() => {
        try { navigator.vibrate(0); } catch(_) {}
    }, 200);

    zone.classList.remove('active');
    zone.classList.add('idle');
    icon.textContent = '♾️';
    title.textContent = 'KLIK → INFINITE';
    stopBtn.classList.remove('on');

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
    timer.textContent = elapsed + 's';
    subtitle.innerHTML = `Berhenti (${reason}) setelah ${elapsed}s.<br>
        ${callCount} calls · ${okCount} OK · ${failCount} FAIL<br>
        Max gap: ${maxGap}ms<br>
        <b>Klik untuk mulai lagi.</b>`;

    log(`⏹ STOP (${reason}) — ${elapsed}s — ${callCount} calls (${okCount} OK, ${failCount} FAIL) — maxGap=${maxGap}ms`, 'ok');
    updateStats();
}

// ============================================================
// EVENT: KLIK untuk start
// ============================================================
zone.addEventListener('click', (e) => {
    if (!active) start();
});

zone.addEventListener('touchstart', (e) => {
    if (!active) {
        e.preventDefault();
        start();
    }
}, { passive: false });

zone.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !active) start();
});

// ============================================================
// TOMBOL STOP
// ============================================================
stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    log('🛑 Tombol STOP ditekan', 'hi');
    hardStop('user');
});

stopBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    log('🛑 Tombol STOP ditekan (touch)', 'hi');
    hardStop('user');
}, { passive: false });

// ============================================================
// VISIBILITY — auto-stop saat tab hidden (perilaku browser)
// ============================================================
document.addEventListener('visibilitychange', () => {
    const now = Date.now();
    if (document.hidden) {
        lastHiddenAt = now;
        log('👁 HIDDEN — hard stop otomatis', 'hi');
        log(`   active=${active} calls=${callCount} gap=${now - lastFireAt}ms`, 'i');
        hardStop('hidden');
    } else {
        log('👁 VISIBLE kembali', 'hi');
        log(`   hidden ${now - lastHiddenAt}ms`, 'i');
        if (navigator.userActivation) {
            const ua = navigator.userActivation;
            log(`   userActivation: isActive=${ua.isActive}, hasBeenActive=${ua.hasBeenActive}`, 'i');
        }
    }
});

// ============================================================
// CLEANUP
// ============================================================
window.addEventListener('beforeunload', () => {
    layerTimeouts.forEach(id => clearTimeout(id));
    intervalIds.forEach(id => clearInterval(id));
    clearInterval(watchdogId);
    clearInterval(tickerId);
    if (rafId) cancelAnimationFrame(rafId);
    try { navigator.vibrate(0); } catch(_) {}
});

window.addEventListener('blur', () => log('💤 blur', 'wr'));
window.addEventListener('focus', () => log('🎯 focus', 'ok'));

// ============================================================
// INIT
// ============================================================
updateStats();
log('=== ♾️ INFINITE LOOP READY ===', 'hi');
if (typeof navigator.vibrate === 'function') {
    log('✅ Vibration API tersedia', 'ok');
    log('💀 KLIK di mana saja untuk memulai', 'i');
    log(`Chunk=${CHUNK}ms · 7 recursive + 1 rAF + 1 WD`, 'i');
    log('Getar TIDAK AKAN BERHENTI sampai STOP ditekan.', 'hi');
} else {
    log('❌ Vibration API TIDAK tersedia', 'er');
}

})();
</script>

</body>
</html>
