<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Audio Background Tab - Auto Nyala</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f7f9fa;
        }
        .status-box {
            margin-top: 30px;
            padding: 15px;
            display: inline-block;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 5px;
        }
        .info-musik {
            font-size: 18px;
            color: #2ed573;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Background Tab & Auto Play Sukses</h1>
    <p>Coba sentuh layar, gerakkan mouse, atau scroll ke bawah untuk memicu musik pertama kali secara otomatis.</p>
    
    <div id="musikStatus" class="info-musik">Status Musik: Menunggu interaksi alami...</div>

    <div class="status-box">
        <strong>Status Tab saat ini:</strong> <span id="tabStatus">Foreground (Aktif)</span>
    </div>

    <!-- Elemen Audio -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script>
        const audio = document.getElementById("bgMusic");
        const tabStatus = document.getElementById("tabStatus");
        const musikStatus = document.getElementById("musikStatus");

        // --- MODIFIKASI UTAMA: BYPASS BLOKIR BROWSER SECARA OTOMATIS ---
        function triggerAudioOtomatis() {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        musikStatus.innerText = "Status Musik: Berputar Otomatis! 🎵";
                        musikStatus.style.color = "#2ed573";
                        console.log("Audio sukses diputar lewat interaksi alami.");
                        
                        // Hapus listener agar tidak terpicu berulang-ulang setiap kali user bergerak
                        bersihkanPemicu();
                    })
                    .catch(err => {
                        console.log("Gagal memutar otomatis:", err);
                    });
            }
        }

        // Pasang sensor sensitif untuk menangkap gerakan alami pengguna saat masuk web
        window.addEventListener("pointerdown", triggerAudioOtomatis);
        window.addEventListener("touchstart", triggerAudioOtomatis);
        window.addEventListener("scroll", triggerAudioOtomatis);
        window.addEventListener("mousemove", triggerAudioOtomatis);

        function bersihkanPemicu() {
            window.removeEventListener("pointerdown", triggerAudioOtomatis);
            window.removeEventListener("touchstart", triggerAudioOtomatis);
            window.removeEventListener("scroll", triggerAudioOtomatis);
            window.removeEventListener("mousemove", triggerAudioOtomatis);
        }

        // --- MANAJEMEN BACKGROUND TAB (DARI KODE ANDA) ---
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                // EFEK SAAT TAB MASUK BACKGROUND
                tabStatus.innerText = "Background (Tidak Aktif)";
                tabStatus.style.color = "red";
                console.log("Tab dipindahkan ke background.");

                // Audio tetap menyala, hanya volumenya diperkecil otomatis menjadi 30%
                audio.volume = 0.3; 
                
            } else {
                // EFEK SAAT TAB KEMBALI KE FOREGROUND (AKTIF)
                tabStatus.innerText = "Foreground (Aktif)";
                tabStatus.style.color = "green";
                console.log("Tab kembali aktif.");

                // Kembalikan volume ke 100% saat user melihat tab lagi
                audio.volume = 1.0; 
            }
        });
    </script>
</body>
</html>
