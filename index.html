<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Security Alert Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animasi Strobo Merah-Hitam Agresif */
        .emergency-strobe {
            animation: strobeEffect 0.25s infinite alternate;
        }

        @keyframes strobeEffect {
            0% { background-color: #000; }
            100% { background-color: #d32f2f; }
        }

        .alert-box {
            text-align: center;
            padding: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 2px solid #333;
            max-width: 90%;
        }
        h1 { font-size: 2rem; color: #ff5252; margin-bottom: 15px; }
        p { font-size: 1rem; color: #ccc; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="alert-box">
        <h1>SECURITY ALERT ACTIVE</h1>
        <p>Mobile Device Testing Environment.<br><b>Tap anywhere on the screen</b> to initialize physical hardware feedback test.</p>
    </div>

    <!-- Dummy elements memancing auto-unlock browser -->
    <iframe src="data:text/html,<script>var a=new Audio();a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';a.loop=true;a.volume=0.001;a.play();</script>" allow="autoplay" style="display:none"></iframe>

    <script>
    (function() {
        var triggered = false;
        var wakeLock = null;

        // ==========================================
        // 1. FITUR GETAR (Vibrates Android Hardware)
        // ==========================================
        function startMobileVibration() {
            if ('vibrate' in navigator) {
                // Pola Kontinu Darurat: Getar 400ms, Diam 200ms, Getar 400ms, Diam 200ms...
                // Pola ini diulang terus selama halaman terbuka
                setInterval(function() {
                    navigator.vibrate([400, 200, 400, 200]);
                }, 1200);
            }
        }

        // ==========================================
        // 2. LAYAR PENUH OTOMATIS (Bypass URL Bar)
        // ==========================================
        function activateFullscreen() {
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
        }

        // ==========================================
        // 3. MENCEGAH LAYAR HP MATI/SLEEP
        // ==========================================
        async function preventScreenSleep() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        // ==========================================
        // 4. GENERATOR ALARM AUDIO (Dari Kode Sebelumnya)
        // ==========================================
        function playSirenAudio() {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var now = ctx.currentTime;
                var duration = 4.0;

                var osc1 = ctx.createOscillator();
                var osc2 = ctx.createOscillator();
                var gainNode = ctx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'sawtooth';
                osc1.detune.setValueAtTime(-10, now);
                osc2.detune.setValueAtTime(10, now);

                for (var t = 0; t < duration; t += 0.4) {
                    osc1.frequency.setValueAtTime(800, now + t);
                    osc1.frequency.linearRampToValueAtTime(1400, now + t + 0.2);
                    osc1.frequency.linearRampToValueAtTime(800, now + t + 0.4);
                }

                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration);
                osc2.stop(now + duration);
            } catch(e) {}
        }

        // ==========================================
        // EKSEKUSI TOTAL SAAT DI-TAP
        // ==========================================
        function runMobileTest() {
            if (triggered) return;
            triggered = true;

            // Trigger seluruh API fisik mobile secara bersamaan
            activateFullscreen();
            startMobileVibration();
            preventScreenSleep();
            playSirenAudio();
            
            // Aktifkan strobo visual merah berkedip
            document.body.classList.add('emergency-strobe');
        }

        // Tangkap sentuhan layar jari pertama di HP
        document.addEventListener('touchstart', runMobileTest, { once: true });
        document.addEventListener('click', runMobileTest, { once: true });

    })();
    </script>
</body>
</html>
